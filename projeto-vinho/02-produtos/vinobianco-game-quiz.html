<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
<meta name="claude:viewport-fit-sides" content="cover"/>
<title>VinoBianco · Quiz</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,900;1,400;1,700&family=Montserrat:wght@200;300;400;500;600;700&display=swap"/>
<style>
/* ══ TOKENS — dark-first, single theme ══
   Layout: header / question-zone / options / status-bar
   One aesthetic risk: the wine glass watermark behind the question
   tracks score — wine fills with correct answers, drains with wrong */

:root {
  --bg:          #0D0608;
  --surface:     rgba(20,6,9,.88);
  --surface2:    rgba(30,8,12,.72);
  --border:      rgba(212,175,55,.12);
  --border-hi:   rgba(212,175,55,.42);
  --burgundy:    #7A1F26;
  --burg-light:  #9B2E3A;
  --burg-dim:    rgba(122,31,38,.35);
  --gold:        #D4AF37;
  --gold-dim:    rgba(212,175,55,.28);
  --ivory:       #F8F6EF;
  --ivory-dim:   rgba(248,246,239,.45);
  --ivory-faint: rgba(248,246,239,.18);
  --correct:     #3D7A52;
  --correct-bg:  rgba(61,122,82,.18);
  --wrong:       #8B1A20;
  --wrong-bg:    rgba(139,26,32,.22);
  --timer-full:  #D4AF37;
  --timer-low:   #c44;
  --ff-display:  'Playfair Display', Georgia, serif;
  --ff-body:     'Montserrat', system-ui, sans-serif;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%; height: 100%;
  background: var(--bg);
  color: var(--ivory);
  font-family: var(--ff-body);
  overflow: hidden;
}

/* ══ SHELL ══ */
.shell {
  display: grid;
  grid-template-rows: auto 1fr auto auto;
  width: 100vw; height: 100vh;
  max-width: 680px;
  margin: 0 auto;
  padding-left:  max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
  position: relative;
}

/* ══ FUNDO ATMOSFÉRICO ══ */
.bg-atm {
  position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background:
    radial-gradient(ellipse 80% 45% at 50% 0%,   rgba(122,31,38,.45) 0%, transparent 65%),
    radial-gradient(ellipse 60% 35% at 50% 105%,  rgba(80,15,20,.6)  0%, transparent 60%),
    #0D0608;
}
.bg-tex {
  position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background: repeating-linear-gradient(
    168deg, transparent 0, transparent 22px,
    rgba(122,31,38,.016) 22px, rgba(122,31,38,.016) 23px);
}

/* ══ HEADER ══ */
.hdr {
  position: relative; z-index: 10;
  display: flex; align-items: center; gap: 10px;
  padding: clamp(10px,2.5vh,18px) 0 clamp(8px,2vh,14px);
  border-bottom: 1px solid var(--border);
}
.hdr-logo {
  display: flex; align-items: center; gap: 8px;
  flex: 0 0 auto;
}
.hdr-glass { width: 28px; height: auto; }
.hdr-brand {
  font-family: var(--ff-display);
  font-size: clamp(.78rem, 2vw, 1rem);
  font-weight: 700; color: var(--ivory);
  white-space: nowrap;
}
.hdr-brand em { color: var(--burgundy); font-style: italic; }

/* Progress bar */
.prog-wrap {
  flex: 1; display: flex; flex-direction: column; gap: 4px;
  align-items: center;
}
.prog-label {
  font-size: .5rem; letter-spacing: .25em;
  color: var(--gold-dim); font-weight: 500; text-transform: uppercase;
}
.prog-bar {
  width: 100%; height: 3px;
  background: var(--burg-dim); border-radius: 2px; overflow: hidden;
}
.prog-fill {
  height: 100%;
  background: linear-gradient(to right, var(--burgundy), var(--gold));
  border-radius: 2px;
  transition: width .5s cubic-bezier(.4,0,.2,1);
}

/* Lives */
.lives {
  display: flex; gap: 5px; align-items: center; flex: 0 0 auto;
}
.life {
  width: 18px; height: 18px;
  transition: all .3s ease;
}
.life.lost { opacity: .2; filter: grayscale(1); }

/* ══ QUESTION ZONE ══ */
.q-zone {
  position: relative; z-index: 5;
  display: flex; flex-direction: column;
  justify-content: center;
  padding: clamp(8px,2vh,16px) 0;
  min-height: 0;
}

/* Taça watermark no fundo — Canvas */
.glass-watermark {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -52%);
  width: clamp(200px, 45vw, 280px);
  pointer-events: none;
  opacity: .07;
  transition: opacity .6s ease;
  z-index: 0;
}
.glass-watermark.pulse { opacity: .14; }

/* Meta da pergunta */
.q-meta {
  position: relative; z-index: 2;
  display: flex; align-items: center; gap: 10px;
  margin-bottom: clamp(6px,1.5vh,12px);
}
.q-category {
  font-size: .48rem; letter-spacing: .25em; font-weight: 600;
  color: var(--gold); text-transform: uppercase;
  border: 1px solid var(--gold-dim);
  padding: 3px 10px; border-radius: 1px;
}
.q-stars {
  display: flex; gap: 2px;
}
.q-star { font-size: .55rem; }

/* Timer circular */
.timer-wrap {
  margin-left: auto;
  position: relative; width: 38px; height: 38px;
}
.timer-svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.timer-track {
  fill: none; stroke: var(--burg-dim); stroke-width: 2.5;
}
.timer-arc {
  fill: none; stroke: var(--gold); stroke-width: 2.5;
  stroke-linecap: round;
  stroke-dasharray: 94.2; /* 2π·15 */
  stroke-dashoffset: 0;
  transition: stroke-dashoffset .9s linear, stroke .3s ease;
}
.timer-num {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: .65rem; font-weight: 700;
  color: var(--gold); font-variant-numeric: tabular-nums;
}

/* Texto da pergunta */
.q-text {
  position: relative; z-index: 2;
  font-family: var(--ff-display);
  font-size: clamp(1.05rem, 3.2vw, 1.55rem);
  font-weight: 600; line-height: 1.38;
  color: var(--ivory);
  text-wrap: balance;
}

/* Dica de contexto */
.q-hint {
  position: relative; z-index: 2;
  margin-top: clamp(5px,1.2vh,10px);
  font-size: clamp(.5rem, 1.2vw, .62rem);
  color: var(--ivory-dim); font-weight: 300; font-style: italic;
  letter-spacing: .04em;
}

/* ══ OPÇÕES ══ */
.options {
  position: relative; z-index: 10;
  display: flex; flex-direction: column;
  gap: clamp(6px, 1.5vh, 10px);
  padding-bottom: clamp(8px, 2vh, 14px);
}

.opt {
  display: flex; align-items: center; gap: 12px;
  padding: clamp(10px,2.4vh,16px) clamp(12px,3vw,18px);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 2px;
  cursor: pointer;
  transition: all .25s ease;
  position: relative; overflow: hidden;
}
.opt::before {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(90deg, var(--burg-dim), transparent);
  opacity: 0; transition: opacity .3s ease;
}
.opt:hover:not(.disabled)::before { opacity: 1; }
.opt:hover:not(.disabled) {
  border-color: var(--border-hi);
  transform: translateX(2px);
}

.opt-letter {
  width: clamp(26px,5vw,32px); height: clamp(26px,5vw,32px);
  border-radius: 50%;
  border: 1.5px solid var(--border-hi);
  display: flex; align-items: center; justify-content: center;
  font-size: clamp(.6rem,1.4vw,.72rem);
  font-weight: 700; color: var(--gold);
  flex: 0 0 auto;
  transition: all .25s ease;
  background: rgba(122,31,38,.2);
}
.opt-text {
  font-size: clamp(.65rem, 1.8vw, .82rem);
  font-weight: 400; color: var(--ivory);
  line-height: 1.35;
  flex: 1; min-width: 0;
}

/* Estados de resposta */
.opt.selected {
  border-color: var(--gold);
  background: rgba(212,175,55,.08);
}
.opt.selected .opt-letter {
  background: var(--gold); color: var(--bg); border-color: var(--gold);
}

.opt.correct {
  border-color: var(--correct);
  background: var(--correct-bg);
  animation: correctFlash .5s ease;
}
.opt.correct .opt-letter {
  background: var(--correct); color: #fff; border-color: var(--correct);
}
.opt.correct .opt-text { color: #a8e8bc; }

.opt.wrong {
  border-color: var(--wrong);
  background: var(--wrong-bg);
  animation: wrongShake .45s ease;
}
.opt.wrong .opt-letter {
  background: var(--wrong); color: #fff; border-color: var(--wrong);
}
.opt.wrong .opt-text { color: var(--ivory-dim); }

.opt.reveal {
  border-color: var(--correct);
  background: var(--correct-bg);
}
.opt.reveal .opt-letter {
  background: var(--correct); color: #fff; border-color: var(--correct);
}
.opt.reveal .opt-text { color: #a8e8bc; }

.opt.disabled { cursor: default; pointer-events: none; }

/* Feedback inline */
.feedback-bar {
  padding: clamp(7px,1.8vh,11px) clamp(12px,3vw,18px);
  background: var(--surface2);
  border-radius: 2px;
  border-left: 2px solid var(--gold);
  font-size: clamp(.52rem,1.3vw,.65rem);
  font-weight: 400; color: var(--ivory-dim);
  line-height: 1.5;
  transition: all .3s ease;
  display: none;
}
.feedback-bar.show { display: block; }
.feedback-bar.correct-fb { border-left-color: var(--correct); }
.feedback-bar.wrong-fb   { border-left-color: var(--wrong); }
.feedback-bar strong { color: var(--ivory); font-weight: 600; }

/* Botão próxima */
.next-btn {
  display: none;
  margin-top: clamp(4px,1vh,8px);
  padding: clamp(.6rem,1.6vh,.85rem) 0;
  width: 100%;
  background: linear-gradient(135deg, rgba(122,31,38,.55), rgba(60,8,14,.7));
  border: 1px solid var(--border-hi);
  border-radius: 2px;
  color: var(--gold);
  font-family: var(--ff-body);
  font-size: clamp(.6rem,1.4vw,.75rem);
  font-weight: 700; letter-spacing: .22em; text-transform: uppercase;
  cursor: pointer; transition: all .3s ease;
}
.next-btn.show { display: block; }
.next-btn:hover {
  background: rgba(122,31,38,.75);
  border-color: var(--gold);
  letter-spacing: .27em;
}

/* ══ STATUS BAR ══ */
.status-bar {
  position: relative; z-index: 10;
  display: flex; align-items: center; gap: clamp(10px,3vw,20px);
  padding: clamp(8px,2vh,13px) 0;
  border-top: 1px solid var(--border);
}
.stat-item {
  display: flex; align-items: center; gap: 6px;
  flex: 1;
}
.stat-icon { font-size: clamp(.7rem,1.8vw,.9rem); }
.stat-value {
  font-size: clamp(.55rem,1.4vw,.7rem);
  font-weight: 700; color: var(--gold);
  font-variant-numeric: tabular-nums;
  letter-spacing: .06em;
}
.stat-label {
  font-size: .45rem; letter-spacing: .18em;
  color: var(--ivory-faint); font-weight: 500; text-transform: uppercase;
}
.xp-gain {
  font-size: .58rem; font-weight: 700;
  color: var(--gold);
  opacity: 0;
  transition: all .3s ease;
  position: absolute; right: 0;
  animation: none;
}
.xp-gain.pop {
  animation: xpPop .9s ease forwards;
}

/* ══ FIM DE JOGO ══ */
.endscreen {
  position: fixed; inset: 0; z-index: 100;
  background: rgba(13,6,8,.95);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: clamp(12px,3vh,22px);
  padding: max(24px, env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-left,0px));
  opacity: 0; pointer-events: none;
  transition: opacity .6s ease;
}
.endscreen.show { opacity: 1; pointer-events: all; }
.end-glass { width: clamp(80px,18vw,120px); }
.end-title {
  font-family: var(--ff-display);
  font-size: clamp(1.4rem, 5vw, 2.4rem);
  font-weight: 700; color: var(--ivory); text-align: center;
  line-height: 1.1;
}
.end-title em { color: var(--burgundy); font-style: italic; }
.end-score-wrap {
  display: flex; gap: clamp(16px,4vw,28px); align-items: center;
}
.end-score {
  text-align: center;
}
.end-num {
  font-family: var(--ff-display);
  font-size: clamp(2rem,8vw,3.5rem);
  font-weight: 900; color: var(--gold);
  line-height: 1;
}
.end-lbl {
  font-size: .5rem; letter-spacing: .22em; text-transform: uppercase;
  color: var(--ivory-dim); font-weight: 500; margin-top: 3px;
}
.end-divider { width: 1px; height: 48px; background: var(--border-hi); }
.end-rule {
  width: clamp(120px,30vw,200px); height: 1px;
  background: linear-gradient(to right, transparent, var(--gold), transparent);
}
.end-message {
  font-size: clamp(.65rem,1.6vw,.82rem);
  color: var(--ivory-dim); text-align: center;
  max-width: 380px; line-height: 1.55;
}
.end-btn {
  padding: clamp(.6rem,1.6vh,.85rem) clamp(2rem,6vw,3.2rem);
  background: none;
  border: 1px solid var(--border-hi);
  color: var(--gold);
  font-family: var(--ff-body);
  font-size: clamp(.62rem,1.4vw,.78rem);
  font-weight: 700; letter-spacing: .22em; text-transform: uppercase;
  cursor: pointer; border-radius: 1px;
  transition: all .3s ease;
}
.end-btn:hover {
  background: rgba(122,31,38,.4);
  border-color: var(--gold);
  letter-spacing: .27em;
}

/* ══ ANIMAÇÕES ══ */
@keyframes correctFlash {
  0%  { background: rgba(61,122,82,.5); }
  100%{ background: var(--correct-bg); }
}
@keyframes wrongShake {
  0%,100%{ transform: translateX(0); }
  20%    { transform: translateX(-6px); }
  40%    { transform: translateX(6px); }
  60%    { transform: translateX(-4px); }
  80%    { transform: translateX(4px); }
}
@keyframes xpPop {
  0%  { opacity:0; transform: translateY(0) scale(.8); }
  30% { opacity:1; transform: translateY(-10px) scale(1.1); }
  70% { opacity:1; transform: translateY(-14px) scale(1); }
  100%{ opacity:0; transform: translateY(-20px) scale(.9); }
}
@keyframes fadeSlideIn {
  from{ opacity:0; transform:translateY(14px); }
  to  { opacity:1; transform:translateY(0); }
}
.q-zone, .options { animation: fadeSlideIn .45s ease both; }
</style>
</head>
<body>

<div class="bg-atm"></div>
<div class="bg-tex"></div>

<div class="shell">

  <!-- HEADER -->
  <header class="hdr">
    <div class="hdr-logo">
      <svg class="hdr-glass" viewBox="0 0 44 56" fill="none">
        <path d="M11 7Q9 22 14 31Q19 38 22 40Q25 38 30 31Q35 22 33 7Z"
              stroke="#7A1F26" stroke-width="1.6" fill="rgba(122,31,38,.18)" stroke-linejoin="round"/>
        <path d="M22 40L21 47M22 40L23 47M21 47L23 47"
              stroke="#7A1F26" stroke-width="1.2" stroke-linecap="round"/>
        <path d="M14 51Q22 48 30 51" stroke="#7A1F26" stroke-width="1.8" fill="none" stroke-linecap="round"/>
        <path d="M14 51Q11 44 14 51M30 51Q33 44 30 51"
              stroke="#7A1F26" stroke-width="1.2" fill="none"/>
        <g transform="translate(22,17)" opacity=".92">
          <path d="M0,-5.5L.7,-1.8L3.5,-3L1.5,-.5L5.5,0L1.5,.5L3.5,3L.7,1.8L0,5.5L-.7,1.8L-3.5,3L-1.5,.5L-5.5,0L-1.5,-.5L-3.5,-3L-.7,-1.8Z"
                fill="#D4AF37"/>
          <circle r="1.3" fill="#D4AF37"/>
        </g>
      </svg>
      <div class="hdr-brand">Vino<em>Bianco</em></div>
    </div>

    <div class="prog-wrap">
      <div class="prog-label" id="progLabel">Pergunta 1 de 8</div>
      <div class="prog-bar"><div class="prog-fill" id="progFill" style="width:12.5%"></div></div>
    </div>

    <div class="lives" id="livesWrap">
      <!-- gerado por JS -->
    </div>
  </header>

  <!-- ZONA DA PERGUNTA -->
  <div class="q-zone" id="qZone">
    <!-- Taça watermark Canvas -->
    <canvas class="glass-watermark" id="wmCanvas"></canvas>

    <div class="q-meta">
      <div class="q-category" id="qCategory">Região</div>
      <div class="q-stars" id="qStars"></div>
      <div class="timer-wrap">
        <svg class="timer-svg" viewBox="0 0 36 36">
          <circle class="timer-track" cx="18" cy="18" r="15"/>
          <circle class="timer-arc"  cx="18" cy="18" r="15" id="timerArc"/>
        </svg>
        <div class="timer-num" id="timerNum">30</div>
      </div>
    </div>

    <div class="q-text" id="qText">Carregando…</div>
    <div class="q-hint" id="qHint"></div>
  </div>

  <!-- OPÇÕES -->
  <div class="options" id="optionsWrap">
    <!-- gerado por JS -->
    <div class="feedback-bar" id="feedbackBar"></div>
    <button class="next-btn" id="nextBtn">Próxima Pergunta →</button>
  </div>

  <!-- STATUS BAR -->
  <div class="status-bar">
    <div class="stat-item">
      <span class="stat-icon">🔥</span>
      <div>
        <div class="stat-value" id="streakVal">0×</div>
        <div class="stat-label">Sequência</div>
      </div>
    </div>
    <div class="stat-item">
      <span class="stat-icon">⭐</span>
      <div>
        <div class="stat-value" id="xpVal">420</div>
        <div class="stat-label">XP Total</div>
      </div>
    </div>
    <div class="stat-item">
      <span class="stat-icon">✓</span>
      <div>
        <div class="stat-value" id="correctVal">0/0</div>
        <div class="stat-label">Acertos</div>
      </div>
    </div>
    <div class="xp-gain" id="xpGain">+25</div>
  </div>

</div><!-- /shell -->

<!-- TELA FINAL -->
<div class="endscreen" id="endscreen">
  <svg class="end-glass" viewBox="0 0 220 260" fill="none">
    <defs>
      <linearGradient id="ewg" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="rgba(122,31,38,.5)"/>
        <stop offset="100%" stop-color="rgba(60,8,16,.7)"/>
      </linearGradient>
      <clipPath id="ewc">
        <path d="M55 38 Q47 95 62 130 Q76 158 110 170 Q144 158 158 130 Q173 95 165 38Z"/>
      </clipPath>

      <rect x="40" y="38" width="140" height="136" fill="url(#ewg)"/>
    </g>
    <path d="M55 38 Q47 95 62 130 Q76 158 110 170 Q144 158 158 130 Q173 95 165 38Z"
          stroke="#7A1F26" stroke-width="2.5" fill="none"/>
    <path d="M110 170 L108 198 M110 170 L112 198 M108 198 L112 198"
          stroke="#7A1F26" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M82 226 Q110 218 138 226" stroke="#7A1F26" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <path d="M108 198 Q105 210 82 226M112 198 Q115 210 138 226"
          stroke="#7A1F26" stroke-width="2" fill="none" stroke-linecap="round"/>
    <g transform="translate(110,90)" opacity=".92">
      <path d="M0,-13L1.8,-4L9,-7.5L3.5,-1.2L13,0L3.5,1.2L9,7.5L1.8,4L0,13L-1.8,4L-9,7.5L-3.5,1.2L-13,0L-3.5,-1.2L-9,-7.5L-1.8,-4Z"

    </g>
  </svg>

  <div class="end-title">Sessão<br><em>Concluída</em></div>
  <div class="end-rule"></div>

  <div class="end-score-wrap">
    <div class="end-score">
      <div class="end-num" id="endCorrect">0</div>
      <div class="end-lbl">Acertos</div>
    </div>
    <div class="end-divider"></div>
    <div class="end-score">
      <div class="end-num" id="endXP">0</div>
      <div class="end-lbl">XP Ganho</div>
    </div>
    <div class="end-divider"></div>
    <div class="end-score">
      <div class="end-num" id="endMax">0</div>
      <div class="end-lbl">Sequência Máx.</div>
    </div>
  </div>

  <div class="end-rule"></div>
  <div class="end-message" id="endMessage">Boa sessão!</div>
  <button class="end-btn" id="restartBtn">▶ Jogar Novamente</button>
</div>

<script>
// ══════════════════════════════════════════════════
//  TAÇA WATERMARK — Canvas 2D detalhado
//  A mesma taça do logo, renderizada atrás da pergunta
//  Nível de vinho sobe com acertos, cai com erros
// ══════════════════════════════════════════════════
const wm = (function(){
  const c   = document.getElementById('wmCanvas');
  const ctx = c.getContext('2d');
  const W   = 440, H = 540;
  const DPR = Math.min(window.devicePixelRatio||1,2);

  function setSz(){
    const vw = window.innerWidth;
    const px = Math.min(Math.max(200,vw*.42),280);
    c.style.width  = px+'px';
    c.style.height = (px*H/W)+'px';
  }
  setSz(); window.addEventListener('resize',setSz);
  c.width  = W*DPR; c.height = H*DPR;
  ctx.scale(DPR,DPR);

  function gp(ct){
    ct.beginPath();
    ct.moveTo(172,30);
    ct.bezierCurveTo(132,30,100,90,100,200);
    ct.bezierCurveTo(100,285,110,322,208,340);
    ct.lineTo(208,340); ct.lineTo(204,432);
    ct.bezierCurveTo(172,432,150,442,148,450);
    ct.lineTo(292,450);
    ct.bezierCurveTo(290,442,268,432,236,432);
    ct.lineTo(232,340);
    ct.bezierCurveTo(330,322,340,285,340,200);
    ct.bezierCurveTo(340,90,308,30,268,30);
    ct.closePath();
  }
  function ip(ct){
    ct.beginPath();
    ct.moveTo(178,32);
    ct.bezierCurveTo(140,32,108,92,108,200);
    ct.bezierCurveTo(108,282,116,318,210,338);
    ct.bezierCurveTo(220,340,220,340,220,340);
    ct.bezierCurveTo(220,340,220,340,230,338);
    ct.bezierCurveTo(324,318,332,282,332,200);
    ct.bezierCurveTo(332,92,300,32,262,32);
    ct.closePath();
  }

  let t=0, wineLevel=1, starAngle=0;
  const swayPh=[0,1.3,.8,2.1];

  function draw(){
    ctx.clearRect(0,0,W,H); t++;
    if(wineLevel>0) wineLevel=Math.max(0,wineLevel-1/160);
    const wineTopY = 32+wineLevel*306;

    // corpo vitreo
    ctx.save(); gp(ctx); ctx.clip();
    const bg=ctx.createLinearGradient(100,30,340,340);
    bg.addColorStop(0,'rgba(30,6,8,.3)');
    bg.addColorStop(1,'rgba(10,2,4,.5)');
    ctx.fillStyle=bg; ctx.fill(); ctx.restore();

    // vinho
    ctx.save(); ip(ctx); ctx.rect(0,wineTopY,W,H); ctx.clip();
    const wg=ctx.createLinearGradient(100,wineTopY,340,340);
    wg.addColorStop(0,'rgba(130,26,40,.7)');
    wg.addColorStop(1,'rgba(55,7,14,.85)');
    ctx.fillStyle=wg; ctx.fillRect(0,wineTopY,W,H); ctx.restore();

    // superfície ondulante
    if(wineLevel<.97){
      ctx.save(); ip(ctx); ctx.clip();
      const sy=wineTopY;
      const w2=Math.sin(t*.04)*2.5;
      ctx.beginPath();
      ctx.ellipse(220,sy+w2,108,4+Math.abs(Math.sin(t*.035))*1.5,0,0,Math.PI*2);
      const sg=ctx.createLinearGradient(110,sy-5,330,sy+5);
      sg.addColorStop(0,'rgba(212,175,55,.1)');
      sg.addColorStop(.5,'rgba(170,60,80,.45)');
      sg.addColorStop(1,'rgba(212,175,55,.1)');
      ctx.fillStyle=sg; ctx.fill(); ctx.restore();
    }

    // cena do vinhedo
    ctx.save(); ip(ctx); ctx.clip();

    // colinas
    [[280,'rgba(122,31,38,.08)'],[300,'rgba(122,31,38,.15)'],[318,'rgba(122,31,38,.26)']].forEach(([y,col])=>{
      ctx.beginPath();
      ctx.moveTo(108,y);
      ctx.quadraticCurveTo(165,y-32,220,y-42);
      ctx.quadraticCurveTo(275,y-32,332,y);
      ctx.lineTo(332,340); ctx.lineTo(108,340); ctx.closePath();
      ctx.fillStyle=col; ctx.fill();
    });

    // fileiras perspectiva
    const VP={x:220,y:248};
    [132,152,172,192,248,268,288,308].forEach(bx=>{
      ctx.beginPath(); ctx.moveTo(bx,334);
      ctx.lineTo(VP.x+(bx-VP.x)*.28,VP.y+(334-VP.y)*.28);
      ctx.strokeStyle='rgba(122,31,38,.4)'; ctx.lineWidth=.8; ctx.stroke();
    });
    [320,308,296].forEach((ry,idx)=>{
      const fr=(ry-VP.y)/(334-VP.y);
      const hw=108*fr;
      ctx.beginPath();
      ctx.moveTo(VP.x-hw,ry); ctx.lineTo(VP.x+hw,ry);
      ctx.strokeStyle=`rgba(122,31,38,${.32-idx*.05})`; ctx.lineWidth=.75; ctx.stroke();
    });

    // ciprestes
    [{x:168,y:280,h:52,rx:7,ry:14,i:0},{x:196,y:272,h:62,rx:8,ry:17,i:1},
     {x:244,y:272,h:62,rx:8,ry:17,i:2},{x:272,y:280,h:52,rx:7,ry:14,i:3}].forEach(({x,y,h,rx,ry,i})=>{
      const sw=Math.sin(t*.025+swayPh[i])*[1.8,2.2,2.0,1.6][i];
      ctx.save(); ctx.translate(x,y); ctx.rotate(sw*Math.PI/180);
      ctx.strokeStyle='rgba(122,31,38,.72)'; ctx.lineWidth=2.1; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(0,-h*.35); ctx.stroke();
      const cg=ctx.createRadialGradient(0,-h*.7,1,0,-h*.6,rx*1.3);
      cg.addColorStop(0,'rgba(122,31,38,.82)'); cg.addColorStop(1,'rgba(80,12,20,.35)');
      ctx.fillStyle=cg; ctx.beginPath();
      ctx.ellipse(0,-h*.7,rx,ry,0,0,Math.PI*2); ctx.fill(); ctx.restore();
    });
    ctx.restore();

    // estrela
    starAngle+=.0028;
    ctx.save(); ctx.translate(220,100); ctx.rotate(starAngle);
    const sg2=ctx.createRadialGradient(0,0,0,0,0,20);
    sg2.addColorStop(0,'rgba(212,175,55,.2)'); sg2.addColorStop(1,'rgba(212,175,55,0)');
    ctx.fillStyle=sg2; ctx.beginPath(); ctx.arc(0,0,20,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='rgba(212,175,55,.9)';
    ctx.beginPath();
    for(let i=0;i<16;i++){
      const a=i*Math.PI/8, r=i%2===0?14:5.5;
      const px=Math.cos(a-Math.PI/2)*r, py=Math.sin(a-Math.PI/2)*r;
      i===0?ctx.moveTo(px,py):ctx.lineTo(px,py);
    }
    ctx.closePath(); ctx.fill();
    const cg2=ctx.createRadialGradient(0,0,0,0,0,4.5);
    cg2.addColorStop(0,'rgba(255,245,200,1)'); cg2.addColorStop(1,'rgba(212,175,55,0)');
    ctx.fillStyle=cg2; ctx.beginPath(); ctx.arc(0,0,4.5,0,Math.PI*2); ctx.fill();
    ctx.restore();

    // stroke da taça
    ctx.save();
    ctx.shadowColor='rgba(212,175,55,.12)'; ctx.shadowBlur=6;
    ctx.strokeStyle='#7A1F26'; ctx.lineWidth=3; ctx.lineJoin='round';
    gp(ctx); ctx.stroke(); ctx.restore();

    // reflexos
    ctx.save();
    ctx.strokeStyle='rgba(212,175,55,.2)'; ctx.lineWidth=2.2; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(116,38); ctx.bezierCurveTo(104,95,106,160,118,220); ctx.stroke();
    ctx.strokeStyle='rgba(255,245,230,.09)'; ctx.lineWidth=1.1;
    ctx.beginPath(); ctx.moveTo(120,42); ctx.bezierCurveTo(110,96,112,155,123,210); ctx.stroke();
    // rimlight
    const rl=ctx.createLinearGradient(172,30,268,30);
    rl.addColorStop(0,'rgba(212,175,55,0)'); rl.addColorStop(.5,'rgba(248,246,239,.25)'); rl.addColorStop(1,'rgba(212,175,55,0)');
    ctx.strokeStyle=rl; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.moveTo(172,30); ctx.lineTo(268,30); ctx.stroke();
    ctx.restore();

    requestAnimationFrame(draw);
  }
  draw();
  return {
    addWine(){ wineLevel = Math.max(0, wineLevel - .18); },
    loseWine(){ wineLevel = Math.min(1, wineLevel + .12); }
  };
})();

// ══════════════════════════════════════════════════
//  MOTOR DO QUIZ
// ══════════════════════════════════════════════════
const TOTAL_LIVES  = 3;
const TIMER_MAX    = 30;
const BASE_XP      = 420;  // XP inicial fictício do jogador

let state = {
  qIdx:     0,
  lives:    TOTAL_LIVES,
  xp:       BASE_XP,
  correct:  0,
  streak:   0,
  maxStreak:0,
  answered: false,
  timer:    TIMER_MAX,
  timerID:  null,
  sessionXP:0,
};

// ── DOM refs ──
const progLabel  = document.getElementById('progLabel');
const progFill   = document.getElementById('progFill');
const livesWrap  = document.getElementById('livesWrap');
const qCategory  = document.getElementById('qCategory');
const qStars     = document.getElementById('qStars');
const qText      = document.getElementById('qText');
const qHint      = document.getElementById('qHint');
const optWrap    = document.getElementById('optionsWrap');
const feedbackBar= document.getElementById('feedbackBar');
const nextBtn    = document.getElementById('nextBtn');
const timerArc   = document.getElementById('timerArc');
const timerNum   = document.getElementById('timerNum');
const streakVal  = document.getElementById('streakVal');
const xpVal      = document.getElementById('xpVal');
const correctVal = document.getElementById('correctVal');
const xpGain     = document.getElementById('xpGain');
const endscreen  = document.getElementById('endscreen');
const endCorrect = document.getElementById('endCorrect');
const endXP      = document.getElementById('endXP');
const endMax     = document.getElementById('endMax');
const endMessage = document.getElementById('endMessage');
const restartBtn = document.getElementById('restartBtn');

function buildLives(){
  livesWrap.innerHTML = '';
  for(let i=0;i<TOTAL_LIVES;i++){
    const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
    svg.setAttribute('viewBox','0 0 22 26');
    svg.setAttribute('fill','none');
    svg.classList.add('life');
    if(i >= state.lives) svg.classList.add('lost');
    svg.innerHTML = `
      <path d="M5 4Q4 11 7 16Q10 20 11 21Q12 20 15 16Q18 11 17 4Z"
            stroke="#7A1F26" stroke-width="1.4" fill="${i<state.lives?'rgba(122,31,38,.5)':'none'}" stroke-linejoin="round"/>
      <path d="M11 21L10.5 24M11 21L11.5 24M10.5 24L11.5 24"
            stroke="#7A1F26" stroke-width=".9" stroke-linecap="round"/>
      <path d="M7 26Q11 24.5 15 26" stroke="#7A1F26" stroke-width="1.2" fill="none" stroke-linecap="round"/>
      <path d="M7 26Q5.5 22 7 26M15 26Q16.5 22 15 26"
            stroke="#7A1F26" stroke-width=".8" fill="none"/>`;
    livesWrap.appendChild(svg);
  }
}

function buildStars(diff){
  qStars.innerHTML = '';
  for(let i=1;i<=5;i++){
    const s = document.createElement('span');
    s.className = 'q-star';
    s.textContent = i<=diff ? '★' : '☆';
    s.style.color = i<=diff ? '#D4AF37' : 'rgba(212,175,55,.25)';
    qStars.appendChild(s);
  }
}

function buildOptions(q){
  // Remove opções anteriores
  document.querySelectorAll('.opt').forEach(e=>e.remove());
  feedbackBar.classList.remove('show','correct-fb','wrong-fb');
  nextBtn.classList.remove('show');

  const letters = ['A','B','C','D'];
  q.options.forEach((text,i)=>{
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.dataset.idx = i;
    btn.innerHTML = `
      <div class="opt-letter">${letters[i]}</div>
      <div class="opt-text">${text}</div>`;
    btn.addEventListener('click',()=>onAnswer(i));
    // Insert before feedbackBar
    optWrap.insertBefore(btn, feedbackBar);
  });
}

function loadQuestion(){
  if(state.qIdx >= QUESTIONS.length){ endGame(); return; }
  const q = QUESTIONS[state.qIdx];
  state.answered = false;

  // Atualiza header
  progLabel.textContent = `Pergunta ${state.qIdx+1} de ${QUESTIONS.length}`;
  progFill.style.width  = `${((state.qIdx+1)/QUESTIONS.length)*100}%`;
  buildLives();

  // Animação re-entrada
  const qZone = document.getElementById('qZone');
  qZone.style.animation = 'none';
  optWrap.style.animation = 'none';
  requestAnimationFrame(()=>{
    qZone.style.animation = 'fadeSlideIn .4s ease both';
    optWrap.style.animation = 'fadeSlideIn .4s .1s ease both';
  });

  qCategory.textContent = q.category;
  buildStars(q.difficulty);
  qText.textContent     = q.text;
  qHint.textContent     = q.hint || '';
  buildOptions(q);

  // Atualiza stats
  correctVal.textContent = `${state.correct}/${state.qIdx}`;

  // Timer
  startTimer();
}

function startTimer(){
  clearInterval(state.timerID);
  state.timer = TIMER_MAX;
  updateTimerUI();
  state.timerID = setInterval(()=>{
    if(state.answered){ clearInterval(state.timerID); return; }
    state.timer--;
    updateTimerUI();
    if(state.timer <= 0){
      clearInterval(state.timerID);
      onTimeout();
    }
  },1000);
}

function updateTimerUI(){
  const pct = state.timer / TIMER_MAX;
  const circ = 94.2;
  timerArc.style.strokeDashoffset = circ * (1 - pct);
  timerArc.style.stroke = state.timer <= 8 ? 'var(--timer-low)' : 'var(--timer-full)';
  timerNum.textContent  = state.timer;
  timerNum.style.color  = state.timer <= 8 ? 'var(--timer-low)' : 'var(--gold)';
}

function onTimeout(){
  if(state.answered) return;
  state.answered = true;
  revealResult(-1); // -1 = timeout
}

function onAnswer(idx){
  if(state.answered) return;
  state.answered = true;
  clearInterval(state.timerID);
  revealResult(idx);
}

function revealResult(selected){
  const q = QUESTIONS[state.qIdx];
  const opts = document.querySelectorAll('.opt');
  const isCorrect = selected === q.answer;

  opts.forEach(o => o.classList.add('disabled'));

  if(selected >= 0) opts[selected].classList.add('selected');

  setTimeout(()=>{
    if(isCorrect){
      opts[selected].classList.remove('selected');
      opts[selected].classList.add('correct');
      state.correct++;
      state.streak++;
      if(state.streak > state.maxStreak) state.maxStreak = state.streak;
      const earned = q.xp * (state.streak >= 3 ? 2 : state.streak >= 2 ? 1.5 : 1);
      state.xp += Math.round(earned);
      state.sessionXP += Math.round(earned);
      showXPGain('+' + Math.round(earned));
      wm.addWine();
    } else {
      if(selected >= 0) { opts[selected].classList.remove('selected'); opts[selected].classList.add('wrong'); }
      opts[q.answer].classList.add('reveal');
      state.streak = 0;
      state.lives--;
      buildLives();
      wm.loseWine();
    }

    // Feedback
    feedbackBar.innerHTML = q.feedback;
    feedbackBar.className = 'feedback-bar show ' + (isCorrect ? 'correct-fb' : 'wrong-fb');

    // Atualiza stats
    streakVal.textContent  = state.streak >= 2 ? `${state.streak}×` : `${state.streak}×`;
    streakVal.style.color  = state.streak >= 3 ? '#ff9' : 'var(--gold)';
    xpVal.textContent      = state.xp;
    correctVal.textContent = `${state.correct}/${state.qIdx+1}`;

    nextBtn.classList.add('show');
    nextBtn.textContent = state.qIdx+1 >= QUESTIONS.length ? 'Ver Resultado →' : 'Próxima Pergunta →';

    // Se perdeu todas as vidas
    if(state.lives <= 0){
      nextBtn.textContent = 'Ver Resultado';
    }
  }, 120);
}

function showXPGain(text){
  xpGain.textContent = text;
  xpGain.className = '';
  void xpGain.offsetWidth;
  xpGain.className = 'xp-gain pop';
}

nextBtn.addEventListener('click',()=>{
  if(state.lives <= 0){ endGame(); return; }
  state.qIdx++;
  loadQuestion();
});

function endGame(){
  clearInterval(state.timerID);
  const total = state.qIdx + (state.answered && state.qIdx < QUESTIONS.length ? 1 : 0);
  const pct   = total > 0 ? Math.round(state.correct/total*100) : 0;

  endCorrect.textContent = `${state.correct}/${total}`;
  endXP.textContent      = state.sessionXP;
  endMax.textContent     = state.maxStreak;

  const msgs = [
    [90, 'Impressionante! Você tem o palato de um Grand Maître. O vinho revela seus segredos para quem sabe observar.'],
    [70, 'Excelente desempenho! Seu conhecimento enológico está bem acima da média — continue explorando os terroirs.'],
    [50, 'Bom começo! O mundo do vinho é vasto. Cada garrafa aberta é uma nova lição.'],
    [0,  'Todo grande sommelier começou do zero. Estude as regiões no Atlas e tente novamente — você vai evoluir!'],
  ];
  endMessage.textContent = (msgs.find(([min])=>pct>=min)||msgs[3])[1];

  endscreen.classList.add('show');
}

restartBtn.addEventListener('click',()=>{
  state = {
    qIdx:0, lives:TOTAL_LIVES, xp:BASE_XP,
    correct:0, streak:0, maxStreak:0,
    answered:false, timer:TIMER_MAX, timerID:null, sessionXP:0
  };
  endscreen.classList.remove('show');
  loadQuestion();
});

// ── Iniciar ──
loadQuestion();
</script>
