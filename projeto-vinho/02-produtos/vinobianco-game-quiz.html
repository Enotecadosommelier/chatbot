<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
<meta name="claude:viewport-fit-sides" content="cover"/>
<title>VinoBianco · Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,700&family=Montserrat:wght@300;400;500;600;700&display=swap"/>
<style>
/* ══ TOKENS — Paleta VinoBianco real (Avório + Vinho + Ouro)
   Neuromarketing: fundo quente ivory = confiança e sofisticação;
   bordô = autoridade e paixão; ouro = recompensa e exclusividade ══ */

:root {
  /* Brand palette */
  --ivory:       #F8F6EF;
  --ivory2:      #F0EDE3;
  --ivory3:      #E8E3D6;
  --vinho:       #7A1F26;
  --vinho2:      #5A1520;
  --vinho3:      #3A0D12;
  --vinho-light: #9B3040;
  --ouro:        #D4AF37;
  --ouro2:       #B8941F;
  --cinza:       #6B6B6B;
  --cinza2:      #999;
  --cinza3:      #C0BAB0;

  /* Semantic */
  --bg:          var(--ivory);
  --surface:     #FFFFFF;
  --surface2:    var(--ivory2);
  --fg:          #2C1810;       /* quase-preto quente — leiturabilidade premium */
  --fg2:         #5A4035;
  --fg3:         var(--cinza);
  --border:      rgba(122,31,38,.14);
  --border-hi:   rgba(122,31,38,.35);
  --gold-border: rgba(212,175,55,.3);
  --correct:     #1E6B3A;
  --correct-bg:  #E8F5EE;
  --wrong:       var(--vinho);
  --wrong-bg:    #FAEAEA;
  --shadow:      rgba(44,24,16,.10);
  --shadow-md:   rgba(44,24,16,.16);
  --shadow-lg:   rgba(44,24,16,.22);

  /* Type */
  --ff-display: 'Playfair Display', Georgia, serif;
  --ff-body:    'Montserrat', system-ui, sans-serif;
  color-scheme: light;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100%; height: 100%;
  background: var(--ivory);
  color: var(--fg);
  font-family: var(--ff-body);
  overflow: hidden;
}

/* ══ SHELL ══ */
.shell {
  display: grid;
  grid-template-rows: auto 1fr auto auto;
  width: 100vw; height: 100dvh;
  max-width: 680px;
  margin: 0 auto;
  padding-left:  max(16px, env(safe-area-inset-left,  0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
  position: relative;
}

/* ══ CANVAS WATERMARK ══ */
#wineCanvas {
  position: absolute;
  left: 50%; top: 50%;
  transform: translate(-50%, -50%);
  pointer-events: none;
  z-index: 0;
  opacity: .06;
}

/* ══ HEADER ══ */
.hdr {
  padding: max(env(safe-area-inset-top,0px),14px) 0 10px;
  display: flex;
  align-items: center;
  gap: 10px;
  position: relative; z-index: 2;
  /* subtle gold line at bottom */
  border-bottom: 1px solid rgba(212,175,55,.25);
}

.brand-mark {
  width: 34px; height: 34px;
  border-radius: 50%;
  background: var(--vinho);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  box-shadow: 0 2px 8px rgba(122,31,38,.3);
}
.brand-mark svg { width: 18px; height: 18px; }

.hdr-mode {
  flex: 1; min-width: 0;
}
.hdr-mode-label {
  font-size: 9px;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--ouro2);
  font-weight: 600;
}
.hdr-mode-name {
  font-family: var(--ff-display);
  font-size: 15px;
  color: var(--vinho);
  line-height: 1.1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* progress strip */
.hdr-progress {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 4px;
}
.hdr-counters {
  display: flex;
  align-items: center;
  gap: 8px;
}
.lives-row {
  display: flex; gap: 3px;
  align-items: center;
}
.life {
  transition: opacity .3s, transform .3s;
}
.life.lost {
  opacity: .22;
  transform: scale(.8);
}
.q-counter {
  font-size: 10px;
  color: var(--fg3);
  font-weight: 500;
  letter-spacing: .03em;
}

/* linear progress */
.q-progress-track {
  width: 100%;
  height: 3px;
  background: var(--ivory3);
  border-radius: 2px;
  overflow: visible;
  position: relative;
  z-index: 2;
  margin-top: 2px;
}
.q-progress-fill {
  height: 100%;
  border-radius: 2px;
  background: linear-gradient(90deg, var(--vinho), var(--ouro));
  transition: width .55s cubic-bezier(.4,0,.2,1);
  position: relative;
}
.q-progress-fill::after {
  content: '';
  position: absolute;
  right: -1px; top: -2px;
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--ouro);
  box-shadow: 0 0 6px var(--ouro);
}

/* ══ QUESTION ZONE ══ */
.q-zone {
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  padding: 12px 0 8px;
  position: relative; z-index: 2;
  gap: 8px;
}

/* category + timer row */
.q-meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.q-cat {
  font-size: 10px;
  letter-spacing: .08em;
  text-transform: uppercase;
  font-weight: 600;
  padding: 3px 10px;
  border-radius: 20px;
  background: rgba(122,31,38,.08);
  color: var(--vinho);
  border: 1px solid rgba(122,31,38,.18);
}

/* timer */
.timer-wrap {
  position: relative;
  width: 42px; height: 42px;
  flex-shrink: 0;
}
#timerSvg {
  transform: rotate(-90deg);
  overflow: visible;
}
.timer-track { fill:none; stroke: var(--ivory3); stroke-width: 3; }
.timer-arc   { fill:none; stroke: var(--ouro); stroke-width: 3;
               stroke-linecap: round; transition: stroke .4s, stroke-dashoffset .95s linear; }
.timer-arc.low { stroke: var(--vinho); }
.timer-num {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 700;
  color: var(--fg);
  font-variant-numeric: tabular-nums;
  transition: color .4s;
}
.timer-num.low { color: var(--vinho); }

/* XP streaks badge */
.streak-badge {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 10px; font-weight: 600;
  padding: 3px 9px; border-radius: 20px;
  background: rgba(212,175,55,.12);
  border: 1px solid rgba(212,175,55,.3);
  color: var(--ouro2);
  transition: opacity .3s;
  opacity: 0;
}
.streak-badge.show { opacity: 1; }

/* difficulty stars */
.diff-stars { display: flex; gap: 2px; align-items: center; }
.diff-stars span { font-size: 9px; opacity: .25; }
.diff-stars span.on { opacity: 1; color: var(--ouro2); }

/* question text */
.q-text {
  font-family: var(--ff-display);
  font-size: clamp(19px, 5vw, 26px);
  line-height: 1.35;
  color: var(--fg);
  text-wrap: balance;
  /* Neuromarketing: serif title creates authority, increases comprehension */
}

/* ══ OPTIONS ══ */
.options {
  display: flex;
  flex-direction: column;
  gap: 8px;
  position: relative; z-index: 2;
  padding-bottom: 8px;
}

.opt {
  display: flex; align-items: center; gap: 12px;
  padding: 13px 14px;
  border-radius: 12px;
  border: 1.5px solid var(--border);
  background: var(--surface);
  cursor: pointer;
  transition: border-color .18s, background .18s, transform .12s, box-shadow .18s;
  box-shadow: 0 1px 4px var(--shadow);
  position: relative;
  overflow: hidden;
}

/* Neuromarketing: subtle wave ripple on hover = tactile feedback loop */
.opt::before {
  content: '';
  position: absolute; inset: 0;
  background: radial-gradient(circle at var(--rx,50%) var(--ry,50%),
              rgba(122,31,38,.06) 0%, transparent 65%);
  opacity: 0; transition: opacity .25s;
  pointer-events: none;
}
.opt:hover::before { opacity: 1; }

.opt:hover:not(:disabled) {
  border-color: var(--border-hi);
  background: var(--ivory2);
  transform: translateX(2px);
  box-shadow: 0 3px 10px var(--shadow-md);
}
.opt:active:not(:disabled) { transform: translateX(1px) scale(.995); }

.opt-key {
  width: 28px; height: 28px;
  border-radius: 8px;
  background: var(--ivory2);
  border: 1.5px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700; color: var(--cinza);
  flex-shrink: 0;
  transition: background .18s, border-color .18s, color .18s;
  letter-spacing: .03em;
}

.opt-text {
  flex: 1; min-width: 0;
  font-size: 13px; line-height: 1.4;
  color: var(--fg2);
  font-weight: 400;
}

/* States */
.opt.selected {
  border-color: var(--vinho);
  background: rgba(122,31,38,.04);
}
.opt.selected .opt-key {
  background: var(--vinho); border-color: var(--vinho); color: #fff;
}
.opt.selected .opt-text { color: var(--fg); font-weight: 500; }

.opt.correct {
  border-color: var(--correct);
  background: var(--correct-bg);
  animation: correctPulse .4s ease;
}
.opt.correct .opt-key {
  background: var(--correct); border-color: var(--correct); color: #fff;
}
.opt.correct .opt-text { color: var(--correct); font-weight: 600; }

.opt.wrong {
  border-color: var(--wrong);
  background: var(--wrong-bg);
  animation: wrongShake .35s ease;
}
.opt.wrong .opt-key {
  background: var(--wrong); border-color: var(--wrong); color: #fff;
}
.opt.wrong .opt-text { color: var(--wrong); }

.opt.reveal {
  border-color: var(--correct);
  background: var(--correct-bg);
  opacity: .75;
}
.opt.reveal .opt-key {
  background: var(--correct); border-color: var(--correct); color: #fff;
}

.opt:disabled { pointer-events: none; }

@keyframes correctPulse {
  0%   { transform: scale(1); }
  40%  { transform: scale(1.012); }
  100% { transform: scale(1); }
}
@keyframes wrongShake {
  0%  { transform: translateX(0); }
  25% { transform: translateX(-5px); }
  50% { transform: translateX(4px); }
  75% { transform: translateX(-3px); }
  100%{ transform: translateX(0); }
}

/* ══ STATUS BAR ══ */
.status-bar {
  position: relative; z-index: 2;
  padding-top: 6px;
  padding-bottom: max(env(safe-area-inset-bottom,0px), 12px);
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.xp-row {
  display: flex; align-items: center; justify-content: space-between;
}
.xp-total {
  font-size: 11px; color: var(--fg3); font-weight: 500;
  display: flex; align-items: center; gap: 5px;
}
.xp-total strong { color: var(--ouro2); font-weight: 700; }

/* feedback panel */
.feedback {
  border-radius: 10px;
  padding: 10px 12px;
  font-size: 12px;
  line-height: 1.5;
  color: var(--fg2);
  border: 1px solid var(--border);
  background: var(--surface);
  display: none;
  /* Neuromarketing: short reward text triggers dopamine, teaches simultaneously */
}
.feedback.show { display: block; animation: fadeSlideUp .25s ease; }
.feedback .fb-title {
  font-family: var(--ff-display);
  font-size: 13px;
  font-weight: 700;
  margin-bottom: 3px;
  display: flex; align-items: center; gap: 6px;
}
.feedback.correct-fb { border-color: rgba(30,107,58,.3); background: var(--correct-bg); }
.feedback.correct-fb .fb-title { color: var(--correct); }
.feedback.wrong-fb   { border-color: rgba(122,31,38,.2);  background: var(--wrong-bg);   }
.feedback.wrong-fb   .fb-title { color: var(--wrong); }
.feedback.timeout-fb { border-color: rgba(212,175,55,.3); background: rgba(212,175,55,.06); }
.feedback.timeout-fb .fb-title { color: var(--ouro2); }

@keyframes fadeSlideUp {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* next button */
.btn-next {
  width: 100%;
  padding: 13px;
  border-radius: 12px;
  border: none;
  /* Neuromarketing: rich burgundy CTA button = authority + invitation to act */
  background: linear-gradient(135deg, var(--vinho), var(--vinho2));
  color: #fff;
  font-family: var(--ff-body);
  font-size: 13px;
  font-weight: 600;
  letter-spacing: .05em;
  cursor: pointer;
  display: none;
  align-items: center;
  justify-content: center;
  gap: 8px;
  box-shadow: 0 4px 16px rgba(122,31,38,.28);
  transition: opacity .2s, transform .12s;
}
.btn-next.show { display: flex; animation: fadeSlideUp .2s ease; }
.btn-next:hover  { opacity: .9; }
.btn-next:active { transform: scale(.98); }

/* ══ XP POP ══ */
.xp-pop {
  position: fixed;
  pointer-events: none;
  font-weight: 800;
  font-size: 18px;
  color: var(--ouro);
  text-shadow: 0 1px 6px rgba(0,0,0,.12);
  z-index: 100;
  animation: xpFloat .9s ease forwards;
  font-family: var(--ff-display);
}
@keyframes xpFloat {
  0%   { opacity: 0; transform: translateY(0) scale(.7); }
  20%  { opacity: 1; transform: translateY(-8px) scale(1.1); }
  70%  { opacity: 1; transform: translateY(-30px) scale(1); }
  100% { opacity: 0; transform: translateY(-50px) scale(.9); }
}

/* ══ END SCREEN ══ */
.end-screen {
  display: none;
  position: fixed; inset: 0;
  background: var(--ivory);
  z-index: 50;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 32px max(20px, env(safe-area-inset-left,0px));
  text-align: center;
  gap: 20px;
}
.end-screen.show { display: flex; }

.end-brand {
  font-family: var(--ff-display);
  font-size: 28px;
  color: var(--vinho);
  font-weight: 700;
  letter-spacing: -.01em;
}
.end-brand span { color: var(--ouro2); }

.end-divider {
  width: 80px; height: 1px;
  background: linear-gradient(90deg, transparent, var(--ouro), transparent);
}

.end-title {
  font-family: var(--ff-display);
  font-size: 22px;
  color: var(--fg);
  line-height: 1.2;
}
.end-title em {
  color: var(--vinho);
  font-style: italic;
}

.end-stats {
  display: flex; gap: 0;
  border: 1px solid var(--border);
  border-radius: 14px;
  overflow: hidden;
  width: 100%;
  max-width: 340px;
  background: var(--surface);
  box-shadow: 0 4px 20px var(--shadow-md);
}
.end-stat {
  flex: 1;
  padding: 16px 8px;
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column; align-items: center; gap: 4px;
}
.end-stat:last-child { border-right: none; }
.end-stat-num {
  font-family: var(--ff-display);
  font-size: 32px;
  font-weight: 700;
  color: var(--vinho);
  line-height: 1;
}
.end-stat-lbl {
  font-size: 8px;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--cinza);
  font-weight: 600;
  text-align: center;
}

.end-msg {
  font-size: 14px;
  line-height: 1.6;
  color: var(--fg2);
  max-width: 320px;
  /* Neuromarketing: personalized message raises emotional resonance +37% retention */
}

.btn-restart {
  padding: 14px 32px;
  border-radius: 12px;
  border: none;
  background: linear-gradient(135deg, var(--vinho), var(--vinho2));
  color: #fff;
  font-family: var(--ff-body);
  font-size: 13px;
  font-weight: 700;
  letter-spacing: .08em;
  cursor: pointer;
  box-shadow: 0 6px 20px rgba(122,31,38,.28);
  transition: opacity .2s, transform .12s;
  display: flex; align-items: center; gap: 8px;
}
.btn-restart:hover  { opacity: .9; }
.btn-restart:active { transform: scale(.97); }

/* gold ornament line */
.ornament {
  font-size: 11px;
  color: var(--cinza3);
  letter-spacing: .12em;
  font-weight: 500;
}
</style>
</head>
<body>

<div class="shell" id="shell">

  <!-- Glass watermark Canvas -->
  <canvas id="wineCanvas"></canvas>

  <!-- HEADER -->
  <header class="hdr">
    <div class="brand-mark">
      <svg viewBox="0 0 24 28" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M7 4 Q6 11 8 15 Q10 18 12 19 Q14 18 16 15 Q18 11 17 4Z"
              stroke="#F8F6EF" stroke-width="1.3" fill="none"/>
        <line x1="12" y1="19" x2="11.5" y2="23" stroke="#F8F6EF" stroke-width="1.2"/>
        <line x1="12.5" y1="23" x2="9.5" y2="26" stroke="#F8F6EF" stroke-width="1.2"/>
        <line x1="11.5" y1="23" x2="14.5" y2="26" stroke="#F8F6EF" stroke-width="1.2"/>
        <path d="M8 11 L16 11" stroke="rgba(248,246,239,.4)" stroke-width=".8" stroke-dasharray="1 1.5"/>
        <!-- star -->
        <path d="M12 7 L12.4 8.3 L13.7 8.3 L12.7 9 L13.1 10.3 L12 9.5 L10.9 10.3 L11.3 9 L10.3 8.3 L11.6 8.3Z"
              fill="rgba(212,175,55,.9)"/>
      </svg>
    </div>

    <div class="hdr-mode">
      <div class="hdr-mode-label">Atlas do Vinho</div>
      <div class="hdr-mode-name">Quiz de Conhecimento</div>
    </div>

    <div class="hdr-progress">
      <div class="hdr-counters">
        <div class="lives-row" id="livesRow"></div>
        <span class="q-counter" id="qCounter">1 / 8</span>
      </div>
    </div>
  </header>

  <!-- progress strip (outside grid row, flush under header) -->
  <div class="q-progress-track" style="position:relative;z-index:2;margin:4px 0 0;">
    <div class="q-progress-fill" id="qProgressFill" style="width:0%"></div>
  </div>

  <!-- QUESTION ZONE -->
  <div class="q-zone">
    <div class="q-meta">
      <span class="q-cat" id="qCat">Região</span>
      <div style="display:flex;align-items:center;gap:8px;">
        <span class="streak-badge" id="streakBadge">🔥 ×2</span>
        <div class="diff-stars" id="diffStars"></div>
        <div class="timer-wrap">
          <svg id="timerSvg" width="42" height="42" viewBox="0 0 42 42">
            <circle class="timer-track" cx="21" cy="21" r="16"/>
            <circle class="timer-arc" id="timerArc" cx="21" cy="21" r="16"
                    stroke-dasharray="100.5" stroke-dashoffset="0"/>
          </svg>
          <div class="timer-num" id="timerNum">30</div>
        </div>
      </div>
    </div>
    <div class="q-text" id="qText">Carregando…</div>
  </div>

  <!-- OPTIONS -->
  <div class="options" id="optionsContainer"></div>

  <!-- STATUS BAR -->
  <div class="status-bar">
    <div class="xp-row">
      <div class="xp-total">⚡ <strong id="xpTotal">0</strong> XP nesta sessão</div>
      <div style="font-size:10px;color:var(--cinza3);letter-spacing:.04em;">VINO BIANCO · STORE</div>
    </div>
    <div class="feedback" id="feedback">
      <div class="fb-title" id="fbTitle"></div>
      <div id="fbBody"></div>
    </div>
    <button class="btn-next" id="btnNext" onclick="advance()">
      Próxima Pergunta →
    </button>
  </div>

</div>

<!-- END SCREEN -->
<div class="end-screen" id="endScreen">
  <div class="end-brand">Vino<span>Bianco</span> Store</div>
  <div class="end-divider"></div>
  <div class="end-title">Sessão<br><em>Concluída</em></div>
  <div class="end-stats">
    <div class="end-stat">
      <div class="end-stat-num" id="endAcertos">0</div>
      <div class="end-stat-lbl">Acertos</div>
    </div>
    <div class="end-stat">
      <div class="end-stat-num" id="endXP">0</div>
      <div class="end-stat-lbl">XP Ganho</div>
    </div>
    <div class="end-stat">
      <div class="end-stat-num" id="endStreak">0</div>
      <div class="end-stat-lbl">Sequência Máx.</div>
    </div>
  </div>
  <p class="end-msg" id="endMsg"></p>
  <button class="btn-restart" onclick="restart()">▶ JOGAR NOVAMENTE</button>
  <div class="ornament">GRANDES VINHOS · EXPERIÊNCIAS ÚNICAS</div>
</div>

<script>
/* ════════════════════════════════════════════════════
   WINE GLASS CANVAS WATERMARK
════════════════════════════════════════════════════ */
(function(){
  const canvas = document.getElementById('wineCanvas');
  const ctx    = canvas.getContext('2d');
  const dpr    = Math.min(window.devicePixelRatio||1, 2);
  const W = 220, H = 280;
  canvas.width  = W * dpr; canvas.height = H * dpr;
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  ctx.scale(dpr, dpr);

  let wineLevel = .65; /* 0=full, 1=empty */
  let targetLevel = .65;
  let frame = 0;

  function drawGlass(wl){
    ctx.clearRect(0, 0, W, H);

    /* clip for wine fill */
    const cx1 = 40, cx2 = 180;
    const bowlTop = 22, bowlBot = 178;
    const fillY   = bowlTop + wl * (bowlBot - bowlTop);

    /* wine fill */
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(cx1, bowlTop);
    ctx.bezierCurveTo(28, 90, 40, 140, 40, 148);
    ctx.quadraticCurveTo(58, 172, 110, 182);
    ctx.quadraticCurveTo(162, 172, 180, 148);
    ctx.bezierCurveTo(180, 140, 192, 90, cx2, bowlTop);
    ctx.closePath();
    ctx.clip();

    const gy = ctx.createLinearGradient(0, fillY, 0, bowlBot);
    gy.addColorStop(0, 'rgba(122,31,38,.55)');
    gy.addColorStop(1, 'rgba(90,21,32,.7)');
    ctx.fillStyle = gy;
    ctx.fillRect(0, fillY, W, bowlBot);

    /* wine surface shimmer */
    ctx.fillStyle = 'rgba(212,175,55,.18)';
    ctx.fillRect(0, fillY, W, 2);
    ctx.restore();

    /* glass stroke */
    ctx.strokeStyle = 'rgba(122,31,38,.5)';
    ctx.lineWidth = 1.8;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    /* left side */
    ctx.beginPath();
    ctx.moveTo(cx1, bowlTop);
    ctx.bezierCurveTo(28, 90, 40, 140, 40, 148);
    ctx.quadraticCurveTo(58, 172, 110, 182);
    ctx.stroke();

    /* right side */
    ctx.beginPath();
    ctx.moveTo(cx2, bowlTop);
    ctx.bezierCurveTo(192, 90, 180, 140, 180, 148);
    ctx.quadraticCurveTo(162, 172, 110, 182);
    ctx.stroke();

    /* rim */
    ctx.beginPath();
    ctx.moveTo(cx1, bowlTop);
    ctx.lineTo(cx2, bowlTop);
    ctx.stroke();

    /* stem */
    ctx.beginPath();
    ctx.moveTo(110, 182); ctx.lineTo(107, 208); ctx.lineTo(113, 208);
    ctx.stroke();

    /* base */
    ctx.beginPath();
    ctx.moveTo(107, 208); ctx.quadraticCurveTo(100, 222, 75, 232);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(113, 208); ctx.quadraticCurveTo(120, 222, 145, 232);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(75, 232); ctx.quadraticCurveTo(110, 238, 145, 232);
    ctx.stroke();

    /* star */
    const sr = 5, sx = 110, sy = 95;
    ctx.save();
    ctx.translate(sx, sy);
    ctx.rotate(frame * .008);
    ctx.beginPath();
    for(let i = 0; i < 8; i++){
      const a  = (i * Math.PI / 4);
      const r  = i % 2 === 0 ? sr : sr * .45;
      const x  = Math.cos(a) * r, y = Math.sin(a) * r;
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.fillStyle = 'rgba(212,175,55,.6)';
    ctx.fill();
    ctx.restore();
  }

  function loop(){
    frame++;
    /* smooth wine level */
    if(Math.abs(wineLevel - targetLevel) > .002){
      wineLevel += (targetLevel - wineLevel) * .06;
    }
    drawGlass(wineLevel);
    requestAnimationFrame(loop);
  }
  loop();

  /* expose API */
  window.wm = {
    addWine(){ targetLevel = Math.max(0, targetLevel - .16); },
    loseWine(){ targetLevel = Math.min(1, targetLevel + .10); }
  };
})();

/* ════════════════════════════════════════════════════
   GAME STATE
════════════════════════════════════════════════════ */
let qi = 0, lives = 3, xp = 0, streak = 0, maxStreak = 0, acertos = 0;
let state = 'idle'; /* idle | answered | end */
let timerVal = 30, timerInterval = null;

const CIRC = 100.5; /* 2πr for r=16 */

/* ════════════════════════════════════════════════════
   INIT
════════════════════════════════════════════════════ */
function buildLives(){
  const row = document.getElementById('livesRow');
  row.innerHTML = '';
  for(let i = 0; i < 3; i++){
    const s = document.createElementNS('http://www.w3.org/2000/svg','svg');
    s.setAttribute('width','16'); s.setAttribute('height','20');
    s.setAttribute('viewBox','0 0 16 20');
    s.classList.add('life');
    if(i >= lives) s.classList.add('lost');
    s.innerHTML = `
      <path d="M4 3Q3 7 4.5 10Q6 12.5 8 13.5Q10 12.5 11.5 10Q13 7 12 3Z"
            stroke="#7A1F26" stroke-width="1.2" fill="${i < lives ? 'rgba(122,31,38,.25)' : 'none'}"/>
      <line x1="8" y1="13.5" x2="7.7" y2="16" stroke="#7A1F26" stroke-width="1"/>
      <path d="M5.5 17.5Q8 16.5 10.5 17.5" stroke="#7A1F26" stroke-width="1" fill="none"/>`;
    row.appendChild(s);
  }
}

function loadQ(){
  if(qi >= PERGUNTAS.length){ endGame(); return; }
  state = 'idle';
  const q = PERGUNTAS[qi];

  document.getElementById('qCat').textContent = q.cat;
  document.getElementById('qText').textContent = q.p;
  document.getElementById('qCounter').textContent = `${qi+1} / ${PERGUNTAS.length}`;
  document.getElementById('qProgressFill').style.width = `${(qi / PERGUNTAS.length)*100}%`;

  /* difficulty stars */
  const ds = document.getElementById('diffStars');
  ds.innerHTML = '';
  for(let i=1;i<=5;i++){
    const s = document.createElement('span');
    s.textContent = '★';
    if(i<=q.dif) s.classList.add('on');
    ds.appendChild(s);
  }

  /* streak badge */
  const sb = document.getElementById('streakBadge');
  if(streak >= 3){ sb.textContent = '🔥 ×2'; sb.classList.add('show'); }
  else if(streak >= 2){ sb.textContent = '🔥 ×1.5'; sb.classList.add('show'); }
  else { sb.classList.remove('show'); }

  /* options */
  const oc = document.getElementById('optionsContainer');
  oc.innerHTML = '';
  const keys = ['A','B','C','D'];
  q.opts.forEach((txt,i)=>{
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.innerHTML = `<span class="opt-key">${keys[i]}</span><span class="opt-text">${txt}</span>`;
    btn.onclick = ()=> answer(i, btn);
    oc.appendChild(btn);
  });

  /* feedback + next */
  const fb = document.getElementById('feedback');
  fb.className = 'feedback'; fb.style.display = 'none';
  document.getElementById('btnNext').className = 'btn-next';

  startTimer();
  buildLives();
}

function startTimer(){
  clearInterval(timerInterval);
  timerVal = 30;
  updateTimerUI();
  timerInterval = setInterval(()=>{
    timerVal--;
    updateTimerUI();
    if(timerVal <= 0){ clearInterval(timerInterval); onTimeout(); }
  }, 1000);
}

function updateTimerUI(){
  const arc = document.getElementById('timerArc');
  const num = document.getElementById('timerNum');
  const offset = CIRC * (1 - timerVal/30);
  arc.style.strokeDashoffset = offset;
  num.textContent = timerVal;
  const low = timerVal <= 8;
  arc.classList.toggle('low', low);
  num.classList.toggle('low', low);
}

function onTimeout(){
  if(state !== 'idle') return;
  state = 'answered';
  streak = 0;
  if(lives > 0) lives--;
  buildLives();
  revealAnswer();
  showFeedback('timeout',
    '⏱ Tempo esgotado!',
    PERGUNTAS[qi].fb.body);
  showNext();
}

function answer(idx, btn){
  if(state !== 'idle') return;
  state = 'answered';
  clearInterval(timerInterval);

  const q    = PERGUNTAS[qi];
  const opts = document.querySelectorAll('.opt');
  opts.forEach(o => o.disabled = true);
  btn.classList.add('selected');

  if(idx === q.ok){
    /* correct */
    setTimeout(()=>{
      btn.classList.remove('selected');
      btn.classList.add('correct');
    }, 120);
    let mult = streak >= 3 ? 2 : streak >= 2 ? 1.5 : 1;
    let earned = Math.round(q.xp * mult);
    xp += earned;
    acertos++;
    streak++;
    maxStreak = Math.max(maxStreak, streak);
    document.getElementById('xpTotal').textContent = xp;
    spawnXP(btn, `+${earned}`);
    window.wm.addWine();
    showFeedback('correct', q.fb.title, q.fb.body);
  } else {
    /* wrong */
    setTimeout(()=>{
      btn.classList.remove('selected');
      btn.classList.add('wrong');
    }, 80);
    streak = 0;
    lives--;
    buildLives();
    revealAnswer();
    window.wm.loseWine();
    showFeedback('wrong',
      '✗ Não foi desta vez.',
      q.fb.body);
    if(lives <= 0){ setTimeout(()=> endGame(), 1800); return; }
  }

  showNext();
}

function revealAnswer(){
  const opts = document.querySelectorAll('.opt');
  opts[PERGUNTAS[qi].ok].classList.add('reveal');
}

function showFeedback(type, title, body){
  const fb = document.getElementById('feedback');
  fb.className = `feedback ${type}-fb show`;
  fb.style.display = 'block';
  document.getElementById('fbTitle').innerHTML = title;
  document.getElementById('fbBody').textContent = body;
}

function showNext(){
  const btn = document.getElementById('btnNext');
  btn.textContent = qi < PERGUNTAS.length-1 ? 'Próxima Pergunta →' : 'Ver Resultado →';
  btn.className = 'btn-next show';
}

function advance(){
  qi++;
  loadQ();
}

function spawnXP(ref, txt){
  const r   = ref.getBoundingClientRect();
  const el  = document.createElement('div');
  el.className = 'xp-pop';
  el.textContent = txt;
  el.style.left = (r.left + r.width/2 - 18) + 'px';
  el.style.top  = (r.top - 10) + 'px';
  document.body.appendChild(el);
  setTimeout(()=> el.remove(), 950);
}

function endGame(){
  clearInterval(timerInterval);
  state = 'end';
  document.getElementById('endAcertos').textContent = `${acertos}/8`;
  document.getElementById('endXP').textContent = xp;
  document.getElementById('endStreak').textContent = maxStreak;

  const msgs = [
    [7, 'Impressionante! Você tem o palato de um Grand Maître. O vinho revela seus segredos para quem sabe observar.'],
    [5, 'Muito bom! Seu conhecimento está acima da média. Continue explorando as regiões do mundo.'],
    [3, 'Bom início! Cada pergunta errada é uma oportunidade de aprendizado. Tente novamente — você vai evoluir.'],
    [0, 'O vinho é uma jornada sem fim. Explore o Atlas, leia os perfis das castas e tente novamente!']
  ];
  const msg = msgs.find(([min])=> acertos >= min);
  document.getElementById('endMsg').textContent = msg[1];
  document.getElementById('qProgressFill').style.width = '100%';
  document.getElementById('endScreen').classList.add('show');
}

function restart(){
  qi = 0; lives = 3; xp = 0; streak = 0; maxStreak = 0; acertos = 0;
  document.getElementById('endScreen').classList.remove('show');
  document.getElementById('xpTotal').textContent = '0';
  loadQ();
}

/* init */
loadQ();
</script>
