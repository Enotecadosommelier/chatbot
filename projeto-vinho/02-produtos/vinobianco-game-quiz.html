<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
<meta name="claude:viewport-fit-sides" content="cover"/>
<title>VinoBianco · Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,700&family=Montserrat:wght@300;400;500;600;700&display=swap"/>
<style>
/* ══ TOKENS — Paleta VinoBianco real ══ */
:root {
  --ivory:      #F8F6EF;
  --ivory2:     #F0EDE3;
  --ivory3:     #E8E3D6;
  --vinho:      #7A1F26;
  --vinho2:     #5A1520;
  --ouro:       #D4AF37;
  --ouro2:      #B8941F;
  --cinza:      #6B6B6B;
  --cinza2:     #999;
  --cinza3:     #C0BAB0;
  --bg:         var(--ivory);
  --surface:    #FFFFFF;
  --fg:         #2C1810;
  --fg2:        #5A4035;
  --fg3:        var(--cinza);
  --border:     rgba(122,31,38,.13);
  --border-hi:  rgba(122,31,38,.32);
  --correct:    #1E6B3A;
  --correct-bg: #E8F5EE;
  --wrong:      var(--vinho);
  --wrong-bg:   #FAEAEA;
  --shadow:     rgba(44,24,16,.09);
  --shadow-md:  rgba(44,24,16,.15);
  --ff-display: 'Playfair Display', Georgia, serif;
  --ff-body:    'Montserrat', system-ui, sans-serif;
  color-scheme: light;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:var(--ivory);color:var(--fg);font-family:var(--ff-body);overflow:hidden}

/* ══ SHELL ══ */
.shell{
  display:grid;grid-template-rows:auto 1fr auto auto;
  width:100vw;height:100dvh;max-width:680px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0;position:relative;overflow:hidden;
}

/* ══ LOGO GLASS SVG WATERMARK ══ */
.glass-watermark{
  position:absolute;
  left:50%;top:52%;
  transform:translate(-50%,-50%);
  pointer-events:none;z-index:0;
  width:min(220px,55vw);
  height:auto;
  opacity:.18;
}
/* wine fill clip animated via JS — clipPathUnits userSpaceOnUse */
#wineFillRect{transition:y .7s cubic-bezier(.4,0,.2,1),height .7s cubic-bezier(.4,0,.2,1)}

/* ══ HEADER ══ */
.hdr{
  padding:max(env(safe-area-inset-top,0px),14px) 0 10px;
  display:flex;align-items:center;gap:10px;
  position:relative;z-index:2;
  border-bottom:1px solid rgba(212,175,55,.22);
}
.brand-mark{
  width:34px;height:34px;border-radius:50%;
  background:var(--vinho);display:flex;align-items:center;justify-content:center;
  flex-shrink:0;box-shadow:0 2px 8px rgba(122,31,38,.28);
}
.hdr-mode{flex:1;min-width:0}
.hdr-mode-label{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--ouro2);font-weight:600}
.hdr-mode-name{font-family:var(--ff-display);font-size:15px;color:var(--vinho);line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr-progress{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.hdr-counters{display:flex;align-items:center;gap:8px}
.lives-row{display:flex;gap:3px;align-items:center}
.life{transition:opacity .3s,transform .3s}
.life.lost{opacity:.22;transform:scale(.8)}
.q-counter{font-size:10px;color:var(--fg3);font-weight:500;letter-spacing:.03em}
.q-progress-track{width:100%;height:3px;background:var(--ivory3);border-radius:2px;position:relative;z-index:2;margin:4px 0 0}
.q-progress-fill{height:100%;border-radius:2px;background:linear-gradient(90deg,var(--vinho),var(--ouro));transition:width .55s cubic-bezier(.4,0,.2,1);position:relative}
.q-progress-fill::after{content:'';position:absolute;right:-1px;top:-2px;width:7px;height:7px;border-radius:50%;background:var(--ouro);box-shadow:0 0 6px var(--ouro)}

/* ══ QUESTION ZONE ══ */
.q-zone{
  display:flex;flex-direction:column;justify-content:flex-end;
  padding:12px 0 8px;position:relative;z-index:2;gap:8px;
}
.q-meta{display:flex;align-items:center;justify-content:space-between}
.q-cat{
  font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;
  padding:3px 10px;border-radius:20px;
  background:rgba(122,31,38,.08);color:var(--vinho);border:1px solid rgba(122,31,38,.18);
}

/* timer */
.timer-wrap{position:relative;width:42px;height:42px;flex-shrink:0}
#timerSvg{transform:rotate(-90deg);overflow:visible}
.timer-track{fill:none;stroke:var(--ivory3);stroke-width:3}
.timer-arc{fill:none;stroke:var(--ouro);stroke-width:3;stroke-linecap:round;transition:stroke .4s,stroke-dashoffset .95s linear}
.timer-arc.low{stroke:var(--vinho)}
.timer-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--fg);font-variant-numeric:tabular-nums;transition:color .4s}
.timer-num.low{color:var(--vinho)}

.streak-badge{
  display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:600;
  padding:3px 9px;border-radius:20px;
  background:rgba(212,175,55,.12);border:1px solid rgba(212,175,55,.3);color:var(--ouro2);
  transition:opacity .3s;opacity:0;
}
.streak-badge.show{opacity:1}
.diff-stars{display:flex;gap:2px;align-items:center}
.diff-stars span{font-size:9px;opacity:.25}
.diff-stars span.on{opacity:1;color:var(--ouro2)}
.q-text{font-family:var(--ff-display);font-size:clamp(18px,5vw,25px);line-height:1.35;color:var(--fg);text-wrap:balance}

/* ══ OPTIONS ══ */
.options{display:flex;flex-direction:column;gap:8px;position:relative;z-index:2;padding-bottom:8px}
.opt{
  display:flex;align-items:center;gap:12px;padding:13px 14px;
  border-radius:12px;border:1.5px solid var(--border);background:var(--surface);
  cursor:pointer;transition:border-color .18s,background .18s,transform .12s,box-shadow .18s;
  box-shadow:0 1px 4px var(--shadow);position:relative;overflow:hidden;
}
.opt::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(circle at var(--rx,50%) var(--ry,50%),rgba(122,31,38,.06) 0%,transparent 65%);
  opacity:0;transition:opacity .25s;pointer-events:none;
}
.opt:hover::before{opacity:1}
.opt:hover:not(:disabled){border-color:var(--border-hi);background:var(--ivory2);transform:translateX(2px);box-shadow:0 3px 10px var(--shadow-md)}
.opt:active:not(:disabled){transform:translateX(1px) scale(.995)}
.opt-key{
  width:28px;height:28px;border-radius:8px;background:var(--ivory2);border:1.5px solid var(--border);
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--cinza);
  flex-shrink:0;transition:background .18s,border-color .18s,color .18s;letter-spacing:.03em;
}
.opt-text{flex:1;min-width:0;font-size:13px;line-height:1.4;color:var(--fg2);font-weight:400}
.opt.selected{border-color:var(--vinho);background:rgba(122,31,38,.04)}
.opt.selected .opt-key{background:var(--vinho);border-color:var(--vinho);color:#fff}
.opt.selected .opt-text{color:var(--fg);font-weight:500}
.opt.correct{border-color:var(--correct);background:var(--correct-bg);animation:correctPulse .4s ease}
.opt.correct .opt-key{background:var(--correct);border-color:var(--correct);color:#fff}
.opt.correct .opt-text{color:var(--correct);font-weight:600}
.opt.wrong{border-color:var(--wrong);background:var(--wrong-bg);animation:wrongShake .35s ease}
.opt.wrong .opt-key{background:var(--wrong);border-color:var(--wrong);color:#fff}
.opt.wrong .opt-text{color:var(--wrong)}
.opt.reveal{border-color:var(--correct);background:var(--correct-bg);opacity:.75}
.opt.reveal .opt-key{background:var(--correct);border-color:var(--correct);color:#fff}
.opt:disabled{pointer-events:none}
@keyframes correctPulse{0%{transform:scale(1)}40%{transform:scale(1.012)}100%{transform:scale(1)}}
@keyframes wrongShake{0%{transform:translateX(0)}25%{transform:translateX(-5px)}50%{transform:translateX(4px)}75%{transform:translateX(-3px)}100%{transform:translateX(0)}}

/* ══ STATUS BAR ══ */
.status-bar{
  position:relative;z-index:2;padding-top:6px;
  padding-bottom:max(env(safe-area-inset-bottom,0px),12px);
  display:flex;flex-direction:column;gap:8px;
}
.xp-row{display:flex;align-items:center;justify-content:space-between}
.xp-total{font-size:11px;color:var(--fg3);font-weight:500;display:flex;align-items:center;gap:5px}
.xp-total strong{color:var(--ouro2);font-weight:700}
.feedback{
  border-radius:10px;padding:10px 12px;font-size:12px;line-height:1.5;
  color:var(--fg2);border:1px solid var(--border);background:var(--surface);display:none;
}
.feedback.show{display:block;animation:fadeSlideUp .25s ease}
.feedback .fb-title{font-family:var(--ff-display);font-size:13px;font-weight:700;margin-bottom:3px;display:flex;align-items:center;gap:6px}
.feedback.correct-fb{border-color:rgba(30,107,58,.3);background:var(--correct-bg)}
.feedback.correct-fb .fb-title{color:var(--correct)}
.feedback.wrong-fb{border-color:rgba(122,31,38,.2);background:var(--wrong-bg)}
.feedback.wrong-fb .fb-title{color:var(--wrong)}
.feedback.timeout-fb{border-color:rgba(212,175,55,.3);background:rgba(212,175,55,.06)}
.feedback.timeout-fb .fb-title{color:var(--ouro2)}
@keyframes fadeSlideUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.btn-next{
  width:100%;padding:13px;border-radius:12px;border:none;
  background:linear-gradient(135deg,var(--vinho),var(--vinho2));color:#fff;
  font-family:var(--ff-body);font-size:13px;font-weight:600;letter-spacing:.05em;
  cursor:pointer;display:none;align-items:center;justify-content:center;gap:8px;
  box-shadow:0 4px 16px rgba(122,31,38,.28);transition:opacity .2s,transform .12s;
}
.btn-next.show{display:flex;animation:fadeSlideUp .2s ease}
.btn-next:hover{opacity:.9}
.btn-next:active{transform:scale(.98)}

/* ══ XP POP ══ */
.xp-pop{position:fixed;pointer-events:none;font-weight:800;font-size:18px;color:var(--ouro);text-shadow:0 1px 6px rgba(0,0,0,.12);z-index:100;animation:xpFloat .9s ease forwards;font-family:var(--ff-display)}
@keyframes xpFloat{0%{opacity:0;transform:translateY(0) scale(.7)}20%{opacity:1;transform:translateY(-8px) scale(1.1)}70%{opacity:1;transform:translateY(-30px) scale(1)}100%{opacity:0;transform:translateY(-50px) scale(.9)}}

/* ══ END SCREEN ══ */
.end-screen{
  display:none;position:fixed;inset:0;background:var(--ivory);z-index:50;
  flex-direction:column;align-items:center;justify-content:center;
  padding:32px max(20px,env(safe-area-inset-left,0px));text-align:center;gap:20px;
}
.end-screen.show{display:flex}
.end-brand{font-family:var(--ff-display);font-size:28px;color:var(--vinho);font-weight:700;letter-spacing:-.01em}
.end-brand span{color:var(--ouro2)}
.end-divider{width:80px;height:1px;background:linear-gradient(90deg,transparent,var(--ouro),transparent)}
.end-title{font-family:var(--ff-display);font-size:22px;color:var(--fg);line-height:1.2}
.end-title em{color:var(--vinho);font-style:italic}
.end-stats{
  display:flex;gap:0;border:1px solid var(--border);border-radius:14px;overflow:hidden;
  width:100%;max-width:340px;background:var(--surface);box-shadow:0 4px 20px var(--shadow-md);
}
.end-stat{flex:1;padding:16px 8px;border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;gap:4px}
.end-stat:last-child{border-right:none}
.end-stat-num{font-family:var(--ff-display);font-size:32px;font-weight:700;color:var(--vinho);line-height:1}
.end-stat-lbl{font-size:8px;letter-spacing:.1em;text-transform:uppercase;color:var(--cinza);font-weight:600;text-align:center}
.end-msg{font-size:14px;line-height:1.6;color:var(--fg2);max-width:320px}
.btn-restart{
  padding:14px 32px;border-radius:12px;border:none;
  background:linear-gradient(135deg,var(--vinho),var(--vinho2));color:#fff;
  font-family:var(--ff-body);font-size:13px;font-weight:700;letter-spacing:.08em;
  cursor:pointer;box-shadow:0 6px 20px rgba(122,31,38,.28);transition:opacity .2s,transform .12s;
  display:flex;align-items:center;gap:8px;
}
.btn-restart:hover{opacity:.9}
.btn-restart:active{transform:scale(.97)}
.ornament{font-size:11px;color:var(--cinza3);letter-spacing:.12em;font-weight:500}

/* ══ END SCREEN GLASS ══ */
.end-glass-wrap{position:relative;width:90px;height:auto}
.end-glass-wrap svg{display:block}
</style>
</head>
<body>

<div class="shell" id="shell">

  <!-- ══ LOGO GLASS SVG WATERMARK — fiel ao logo real ══ -->
  <svg class="glass-watermark" id="glassWm" viewBox="0 0 200 248" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <!-- clip to bowl interior -->
      <clipPath id="bowlClip">
        <path d="M58,36 C50,92 60,132 66,144 Q80,168 100,176 Q120,168 134,144 C140,132 150,92 142,36 Z"/>
      </clipPath>
      <!-- animated wine fill clip -->
      <clipPath id="wineClip">
        <rect id="wineFillRect" x="0" y="176" width="200" height="0"/>
      </clipPath>
    </defs>

    <!-- ── WINE FILL (inside bowl) ── -->
    <path d="M58,36 C50,92 60,132 66,144 Q80,168 100,176 Q120,168 134,144 C140,132 150,92 142,36 Z"
          fill="#7A1F26" clip-path="url(#wineClip)" opacity=".55"/>
    <!-- wine surface shimmer -->
    <line id="wineSurface" x1="58" y1="176" x2="142" y2="176"
          stroke="rgba(212,175,55,.6)" stroke-width="1.5" opacity="0"/>

    <!-- ── VINEYARD ROWS (clipped inside bowl) ── -->
    <g clip-path="url(#bowlClip)" stroke="#7A1F26" fill="none" stroke-width="1.1" opacity=".85">
      <!-- 8 perspective rows converging to bottom-center (100,172) -->
      <!-- each row: arc at height y, width proportional to distance from VP -->
      <path d="M54,82  Q100,77  146,82"/>
      <path d="M52,96  Q100,91  148,96"/>
      <path d="M53,109 Q100,104 147,109"/>
      <path d="M55,121 Q100,116 145,121"/>
      <path d="M59,132 Q100,127 141,132"/>
      <path d="M65,141 Q100,136 135,141"/>
      <path d="M72,150 Q100,145 128,150"/>
      <!-- vanishing perspective lines from VP to each row end -->
      <line x1="100" y1="172" x2="52"  y2="82"  stroke-width=".7" opacity=".4"/>
      <line x1="100" y1="172" x2="148" y2="82"  stroke-width=".7" opacity=".4"/>
      <line x1="100" y1="172" x2="50"  y2="92"  stroke-width=".6" opacity=".3"/>
      <line x1="100" y1="172" x2="150" y2="92"  stroke-width=".6" opacity=".3"/>
      <line x1="100" y1="172" x2="56"  y2="108" stroke-width=".5" opacity=".25"/>
      <line x1="100" y1="172" x2="144" y2="108" stroke-width=".5" opacity=".25"/>
    </g>

    <!-- ── CYPRESS TREES (clipped inside bowl) ── -->
    <g clip-path="url(#bowlClip)" fill="#7A1F26" opacity=".85">
      <!-- Left cypress: narrow pointed shape at x≈76 -->
      <path d="M76,105 L68,150 Q72,158 76,159 Q80,158 84,150 Z"/>
      <!-- inner trunk line -->
      <line x1="76" y1="152" x2="76" y2="159" stroke="#7A1F26" stroke-width=".8" fill="none"/>
      <!-- Right cypress: x≈124 -->
      <path d="M124,105 L116,150 Q120,158 124,159 Q128,158 132,150 Z"/>
      <line x1="124" y1="152" x2="124" y2="159" stroke="#7A1F26" stroke-width=".8" fill="none"/>
    </g>

    <!-- ── STAR / ESTRELA (top of bowl) ── -->
    <g transform="translate(100,58)" fill="none" stroke="#7A1F26" stroke-linecap="round">
      <!-- 8-pointed asterisk, faithful to logo -->
      <line x1="0" y1="-9"   x2="0"    y2="9"    stroke-width="1.4"/>
      <line x1="-9"  y1="0"  x2="9"    y2="0"    stroke-width="1.4"/>
      <line x1="-6.4" y1="-6.4" x2="6.4" y2="6.4"  stroke-width="1.2"/>
      <line x1="6.4"  y1="-6.4" x2="-6.4" y2="6.4"  stroke-width="1.2"/>
      <circle r="2.8" fill="#7A1F26" stroke="none"/>
    </g>

    <!-- ── BOWL OUTLINE ── -->
    <path d="M58,36 C50,92 60,132 66,144 Q80,168 100,176 Q120,168 134,144 C140,132 150,92 142,36"
          stroke="#7A1F26" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <!-- rim -->
    <path d="M58,36 Q100,30 142,36" stroke="#7A1F26" stroke-width="1.8" fill="none"/>

    <!-- ── STEM ── -->
    <path d="M100,176 L98,200 L102,200" stroke="#7A1F26" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- ── BASE ── -->
    <path d="M98,200 Q94,214 74,222" stroke="#7A1F26" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    <path d="M102,200 Q106,214 126,222" stroke="#7A1F26" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    <path d="M74,222 Q100,228 126,222" stroke="#7A1F26" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  </svg>

  <!-- HEADER -->
  <header class="hdr">
    <div class="brand-mark">
      <!-- Mini versão da taça no brand mark -->
      <svg width="18" height="22" viewBox="0 0 200 248" fill="none">
        <path d="M58,36 C50,92 60,132 66,144 Q80,168 100,176 Q120,168 134,144 C140,132 150,92 142,36" stroke="#F8F6EF" stroke-width="14" fill="none" stroke-linecap="round"/>
        <path d="M58,36 Q100,30 142,36" stroke="#F8F6EF" stroke-width="14" fill="none"/>
        <path d="M100,176 L98,200 L102,200" stroke="#F8F6EF" stroke-width="13" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M74,222 Q100,228 126,222" stroke="#F8F6EF" stroke-width="12" fill="none" stroke-linecap="round"/>
        <!-- star -->
        <g transform="translate(100,70)" stroke="#D4AF37" stroke-linecap="round">
          <line x1="0" y1="-12" x2="0" y2="12" stroke-width="12"/>
          <line x1="-12" y1="0" x2="12" y2="0" stroke-width="12"/>
          <line x1="-8" y1="-8" x2="8" y2="8" stroke-width="10"/>
          <line x1="8" y1="-8" x2="-8" y2="8" stroke-width="10"/>
          <circle r="6" fill="#D4AF37" stroke="none"/>
        </g>
      </svg>
    </div>
    <div class="hdr-mode">
      <div class="hdr-mode-label">Atlas do Vinho</div>
      <div class="hdr-mode-name">Quiz de Conhecimento</div>
    </div>
    <div class="hdr-progress">
      <div class="hdr-counters">
        <div class="lives-row" id="livesRow"></div>
        <span class="q-counter" id="qCounter">1 / 8</span>
      </div>
    </div>
  </header>
  <div class="q-progress-track">
    <div class="q-progress-fill" id="qProgressFill" style="width:0%"></div>
  </div>

  <!-- QUESTION ZONE -->
  <div class="q-zone">
    <div class="q-meta">
      <span class="q-cat" id="qCat">Região</span>
      <div style="display:flex;align-items:center;gap:8px">
        <span class="streak-badge" id="streakBadge">🔥 ×2</span>
        <div class="diff-stars" id="diffStars"></div>
        <div class="timer-wrap">
          <svg id="timerSvg" width="42" height="42" viewBox="0 0 42 42">
            <circle class="timer-track" cx="21" cy="21" r="16"/>
            <circle class="timer-arc" id="timerArc" cx="21" cy="21" r="16" stroke-dasharray="100.5" stroke-dashoffset="0"/>
          </svg>
          <div class="timer-num" id="timerNum">30</div>
        </div>
      </div>
    </div>
    <div class="q-text" id="qText">Carregando…</div>
  </div>

  <!-- OPTIONS -->
  <div class="options" id="optionsContainer"></div>

  <!-- STATUS BAR -->
  <div class="status-bar">
    <div class="xp-row">
      <div class="xp-total">⚡ <strong id="xpTotal">0</strong> XP nesta sessão</div>
      <div style="font-size:10px;color:var(--cinza3);letter-spacing:.04em">VINO BIANCO · STORE</div>
    </div>
    <div class="feedback" id="feedback">
      <div class="fb-title" id="fbTitle"></div>
      <div id="fbBody"></div>
    </div>
    <button class="btn-next" id="btnNext" onclick="advance()">Próxima Pergunta →</button>
  </div>
</div>

<!-- END SCREEN -->
<div class="end-screen" id="endScreen">
  <!-- End screen glass with fill -->
  <div class="end-glass-wrap">
    <svg width="90" height="112" viewBox="0 0 200 248" fill="none" id="endGlass">
      <defs>
        <clipPath id="endBowlClip">
          <path d="M58,36 C50,92 60,132 66,144 Q80,168 100,176 Q120,168 134,144 C140,132 150,92 142,36 Z"/>
        </clipPath>
      </defs>

/* ════════════════════════════════════════════
   WINE FILL — SVG clip animation
   bowlTop=36, bowlBot=176 (in viewBox 0 0 200 248)
════════════════════════════════════════════ */
let wineLevel = 0.55; /* 0=full top, 1=empty */

function setWineLevel(level){
  wineLevel = Math.min(1, Math.max(0, level));
  const VB_TOP  = 36;
  const VB_BOT  = 176;
  const VB_H    = VB_BOT - VB_TOP; /* 140 */
  const fillTop = VB_TOP + wineLevel * VB_H;
  const fillH   = VB_BOT - fillTop;

  const rect = document.getElementById('wineFillRect');
  const surf = document.getElementById('wineSurface');
  if(rect){
    rect.setAttribute('y', fillTop);
    rect.setAttribute('height', Math.max(0, fillH));
  }
  if(surf){
    surf.setAttribute('y1', fillTop);
    surf.setAttribute('y2', fillTop);
    surf.style.opacity = fillH > 2 ? '1' : '0';
    surf.setAttribute('x1', 58 + wineLevel * 44);   /* approximate glass width at y */
    surf.setAttribute('x2', 142 - wineLevel * 44);
  }
}

window.wm = {
  addWine(){ setWineLevel(wineLevel - .16); },
  loseWine(){ setWineLevel(wineLevel + .10); }
};

/* ════════════════════════════════════════════
   GAME STATE
════════════════════════════════════════════ */
let qi=0, lives=3, xp=0, streak=0, maxStreak=0, acertos=0, currentCorrectIdx=0;
let state='idle';
let timerVal=30, timerInterval=null;
const CIRC=100.5;

function buildLives(){
  const row=document.getElementById('livesRow');
  row.innerHTML='';
  for(let i=0;i<3;i++){
    const s=document.createElementNS('http://www.w3.org/2000/svg','svg');
    s.setAttribute('width','16');s.setAttribute('height','20');s.setAttribute('viewBox','0 0 200 248');
    s.classList.add('life');
    if(i>=lives)s.classList.add('lost');
    /* mini glass */
    s.innerHTML=`
      <path d="M58,36 C50,92 60,132 66,144 Q80,168 100,176 Q120,168 134,144 C140,132 150,92 142,36"
            stroke="${i<lives?'#7A1F26':'#C0BAB0'}" stroke-width="14" fill="none" stroke-linecap="round"/>
      <path d="M58,36 Q100,30 142,36" stroke="${i<lives?'#7A1F26':'#C0BAB0'}" stroke-width="14" fill="none"/>
      <line x1="100" y1="176" x2="100" y2="218" stroke="${i<lives?'#7A1F26':'#C0BAB0'}" stroke-width="12"/>
      <path d="M74,222 Q100,228 126,222" stroke="${i<lives?'#7A1F26':'#C0BAB0'}" stroke-width="12" fill="none" stroke-linecap="round"/>
      ${i<lives?`<path d="M58,36 C50,92 60,132 66,144 Q80,168 100,176 Q120,168 134,144 C140,132 150,92 142,36 Z" fill="rgba(122,31,38,.2)"/>`:''}`;
    row.appendChild(s);
  }
}

function loadQ(){
  if(qi>=PERGUNTAS.length){endGame();return}
  state='idle';
  const q=PERGUNTAS[qi];
  document.getElementById('qCat').textContent=q.cat;
  document.getElementById('qText').textContent=q.p;
  document.getElementById('qCounter').textContent=`${qi+1} / ${PERGUNTAS.length}`;
  document.getElementById('qProgressFill').style.width=`${(qi/PERGUNTAS.length)*100}%`;
  const ds=document.getElementById('diffStars');
  ds.innerHTML='';
  for(let i=1;i<=5;i++){const s=document.createElement('span');s.textContent='★';if(i<=q.dif)s.classList.add('on');ds.appendChild(s);}
  const sb=document.getElementById('streakBadge');
  if(streak>=3){sb.textContent='🔥 ×2';sb.classList.add('show')}
  else if(streak>=2){sb.textContent='🔥 ×1.5';sb.classList.add('show')}
  else{sb.classList.remove('show')}
  const oc=document.getElementById('optionsContainer');
  oc.innerHTML='';
  const shuffled=[...q.opts].map((text,i)=>({text,correct:i===q.ok}));
  for(let i=shuffled.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[shuffled[i],shuffled[j]]=[shuffled[j],shuffled[i]];}
  currentCorrectIdx=shuffled.findIndex(o=>o.correct);
  ['A','B','C','D'].forEach((k,i)=>{
    const btn=document.createElement('button');
    btn.className='opt';
    btn.innerHTML=`<span class="opt-key">${k}</span><span class="opt-text">${shuffled[i].text}</span>`;
    btn.onclick=()=>answer(i,btn);
    oc.appendChild(btn);
  });
  document.getElementById('feedback').className='feedback';
  document.getElementById('feedback').style.display='none';
  document.getElementById('btnNext').className='btn-next';
  startTimer();
  buildLives();
}

function startTimer(){
  clearInterval(timerInterval);
  timerVal=30;updateTimerUI();
  timerInterval=setInterval(()=>{timerVal--;updateTimerUI();if(timerVal<=0){clearInterval(timerInterval);onTimeout();}},1000);
}

function updateTimerUI(){
  const arc=document.getElementById('timerArc'),num=document.getElementById('timerNum');
  arc.style.strokeDashoffset=CIRC*(1-timerVal/30);
  num.textContent=timerVal;
  const low=timerVal<=8;
  arc.classList.toggle('low',low);num.classList.toggle('low',low);
}

function onTimeout(){
  if(state!=='idle')return;
  state='answered';streak=0;
  if(lives>0)lives--;
  buildLives();revealAnswer();
  showFeedback('timeout','⏱ Tempo esgotado!',PERGUNTAS[qi].fb.body);
  showNext();
}

function answer(idx,btn){
  if(state!=='idle')return;
  state='answered';
  clearInterval(timerInterval);
  const q=PERGUNTAS[qi];
  document.querySelectorAll('.opt').forEach(o=>o.disabled=true);
  btn.classList.add('selected');
  if(idx===currentCorrectIdx){
    setTimeout(()=>{btn.classList.remove('selected');btn.classList.add('correct');},120);
    const mult=streak>=3?2:streak>=2?1.5:1;
    const earned=Math.round(q.xp*mult);
    xp+=earned;acertos++;streak++;maxStreak=Math.max(maxStreak,streak);
    document.getElementById('xpTotal').textContent=xp;
    spawnXP(btn,`+${earned}`);
    window.wm.addWine();
    showFeedback('correct',q.fb.title,q.fb.body);
  } else {
    setTimeout(()=>{btn.classList.remove('selected');btn.classList.add('wrong');},80);
    streak=0;lives--;buildLives();revealAnswer();
    window.wm.loseWine();
    showFeedback('wrong','✗ Não foi desta vez.',q.fb.body);
    if(lives<=0){setTimeout(()=>endGame(),1800);return;}
  }
  showNext();
}

function revealAnswer(){document.querySelectorAll('.opt')[currentCorrectIdx].classList.add('reveal');}

function showFeedback(type,title,body){
  const fb=document.getElementById('feedback');
  fb.className=`feedback ${type}-fb show`;fb.style.display='block';
  document.getElementById('fbTitle').innerHTML=title;
  document.getElementById('fbBody').textContent=body;
}

function showNext(){
  const btn=document.getElementById('btnNext');
  btn.textContent=qi<PERGUNTAS.length-1?'Próxima Pergunta →':'Ver Resultado →';
  btn.className='btn-next show';
}

function advance(){qi++;loadQ();}

function spawnXP(ref,txt){
  const r=ref.getBoundingClientRect();
  const el=document.createElement('div');
  el.className='xp-pop';el.textContent=txt;
  el.style.left=(r.left+r.width/2-18)+'px';
  el.style.top=(r.top-10)+'px';
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),950);
}

function endGame(){
  clearInterval(timerInterval);state='end';
  document.getElementById('endAcertos').textContent=`${acertos}/8`;
  document.getElementById('endXP').textContent=xp;
  document.getElementById('endStreak').textContent=maxStreak;
  const msgs=[[7,'Impressionante! Você tem o palato de um Grand Maître. O vinho revela seus segredos para quem sabe observar.'],[5,'Muito bom! Seu conhecimento está acima da média. Continue explorando as regiões do mundo.'],[3,'Bom início! Cada pergunta é uma oportunidade de aprendizado. Tente novamente — você vai evoluir.'],[0,'O vinho é uma jornada sem fim. Explore o Atlas, leia os perfis das castas e tente novamente!']];
  document.getElementById('endMsg').textContent=msgs.find(([m])=>acertos>=m)[1];
  document.getElementById('qProgressFill').style.width='100%';
  document.getElementById('endScreen').classList.add('show');
}

function restart(){
  qi=0;lives=3;xp=0;streak=0;maxStreak=0;acertos=0;
  setWineLevel(0.55);
  document.getElementById('endScreen').classList.remove('show');
  document.getElementById('xpTotal').textContent='0';
  loadQ();
}

loadQ();
</script>
