<title>VinoBianco · Explore a Casta</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@300;400;500;600;700&display=swap">

<style>
/* ─── TOKENS ─────────────────────────────────────────────── */
:root {
  --bg:       #0D0608;
  --bg2:      #130A0E;
  --bg3:      #1E0F15;
  --fg:       #F8F6EF;
  --fg2:      #C8C0B4;
  --fg3:      #8A7D72;
  --gold:     #D4AF37;
  --gold2:    #B8941F;
  --bordo:    #7A1F26;
  --bordo2:   #5A1520;
  --bordo3:   #3A0D12;
  --tinto:    #8B2635;
  --branco:   #C9A227;
  --card-bg:  #1A0C10;
  --card-br:  #2E1820;
  --modal-bg: #160B0F;
  --sep:      rgba(212,175,55,.18);
  color-scheme: dark;
}

* { box-sizing: border-box; margin: 0; padding: 0 }

body {
  background: var(--bg);
  color: var(--fg);
  font-family: 'Montserrat', sans-serif;
  font-size: 14px;
  min-height: 100dvh;
  overflow-x: hidden;
  padding-left:  max(16px, env(safe-area-inset-left,  0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
}

/* ─── HEADER ──────────────────────────────────────────────── */
.header {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 40;
  background: linear-gradient(180deg, #0D0608 80%, transparent);
  padding: 14px 0 10px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.header-top {
  display: flex;
  align-items: center;
  gap: 10px;
}

.btn-back {
  width: 34px; height: 34px;
  border: 1px solid var(--sep);
  border-radius: 50%;
  background: var(--bg3);
  color: var(--fg2);
  font-size: 16px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  transition: border-color .2s, color .2s;
}
.btn-back:hover { border-color: var(--gold); color: var(--gold); }

.header-title {
  flex: 1;
  min-width: 0;
}
.header-title h1 {
  font-family: 'Playfair Display', serif;
  font-size: 17px;
  color: var(--gold);
  line-height: 1.2;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.header-title p {
  font-size: 11px;
  color: var(--fg3);
  letter-spacing: .04em;
  margin-top: 1px;
}

.xp-pill {
  background: var(--bordo3);
  border: 1px solid var(--bordo);
  border-radius: 20px;
  padding: 4px 10px;
  font-size: 11px;
  color: var(--gold);
  font-weight: 600;
  white-space: nowrap;
}

/* ─── FILTER TABS ─────────────────────────────────────────── */
.filter-row {
  display: flex;
  gap: 8px;
}
.filter-btn {
  flex: 1;
  padding: 7px 0;
  border: 1px solid var(--card-br);
  border-radius: 20px;
  background: var(--card-bg);
  color: var(--fg3);
  font-family: 'Montserrat', sans-serif;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  transition: all .2s;
  letter-spacing: .03em;
}
.filter-btn.active {
  background: var(--bordo2);
  border-color: var(--bordo);
  color: var(--fg);
}
.filter-btn[data-filter="tinto"].active {
  background: linear-gradient(135deg, var(--bordo2), #2D0D14);
  border-color: var(--tinto);
}
.filter-btn[data-filter="branco"].active {
  background: linear-gradient(135deg, #2A1E00, #1A1200);
  border-color: var(--branco);
  color: var(--branco);
}

/* ─── SEARCH ──────────────────────────────────────────────── */
.search-wrap {
  position: relative;
}
.search-input {
  width: 100%;
  background: var(--card-bg);
  border: 1px solid var(--card-br);
  border-radius: 20px;
  padding: 8px 14px 8px 36px;
  color: var(--fg);
  font-family: 'Montserrat', sans-serif;
  font-size: 13px;
  outline: none;
  transition: border-color .2s;
}
.search-input:focus { border-color: var(--gold); }
.search-input::placeholder { color: var(--fg3); }
.search-icon {
  position: absolute;
  left: 12px; top: 50%;
  transform: translateY(-50%);
  color: var(--fg3);
  font-size: 14px;
  pointer-events: none;
}

/* ─── PROGRESS BAR ────────────────────────────────────────── */
.progress-bar-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 4px 0 2px;
}
.progress-label { font-size: 10px; color: var(--fg3); letter-spacing: .05em; }
.progress-track {
  flex: 1;
  height: 3px;
  background: var(--card-br);
  border-radius: 2px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--bordo), var(--gold));
  border-radius: 2px;
  transition: width .6s ease;
}
.progress-count { font-size: 10px; color: var(--gold); font-weight: 600; }

/* ─── CARD GRID ───────────────────────────────────────────── */
.grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  padding: 4px 0 120px;
}

@media (min-width: 540px) {
  .grid { grid-template-columns: repeat(3, 1fr); }
}

.casta-card {
  background: var(--card-bg);
  border: 1px solid var(--card-br);
  border-radius: 14px;
  padding: 14px 12px 12px;
  cursor: pointer;
  transition: transform .18s, border-color .18s, box-shadow .18s;
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.casta-card::before {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse at top left, rgba(212,175,55,.04), transparent 70%);
  pointer-events: none;
}
.casta-card:hover, .casta-card:active {
  transform: translateY(-2px);
  border-color: rgba(212,175,55,.35);
  box-shadow: 0 6px 24px rgba(0,0,0,.45);
}
.casta-card.estudada {
  border-color: rgba(212,175,55,.3);
}
.casta-card.estudada::after {
  content: '✓';
  position: absolute;
  top: 8px; right: 8px;
  width: 18px; height: 18px;
  background: var(--gold);
  color: #0D0608;
  border-radius: 50%;
  font-size: 10px;
  font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  line-height: 18px;
  text-align: center;
}

.card-cor-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .06em;
  text-transform: uppercase;
  padding: 2px 8px;
  border-radius: 10px;
  align-self: flex-start;
}
.card-cor-badge.tinto {
  background: rgba(122,31,38,.35);
  color: #E8909A;
  border: 1px solid rgba(122,31,38,.5);
}
.card-cor-badge.branco {
  background: rgba(201,162,39,.18);
  color: #D4AF37;
  border: 1px solid rgba(201,162,39,.3);
}

.card-nome {
  font-family: 'Playfair Display', serif;
  font-size: 15px;
  line-height: 1.2;
  color: var(--fg);
  text-wrap: balance;
}

.card-origem {
  font-size: 10px;
  color: var(--fg3);
  line-height: 1.3;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.card-aromas {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  margin-top: auto;
}
.aroma-chip {
  font-size: 9px;
  padding: 2px 6px;
  border-radius: 8px;
  background: rgba(255,255,255,.06);
  color: var(--fg2);
  border: 1px solid rgba(255,255,255,.08);
  white-space: nowrap;
}

/* ─── MODAL ───────────────────────────────────────────────── */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.75);
  backdrop-filter: blur(4px);
  z-index: 100;
  display: flex;
  align-items: flex-end;
  opacity: 0;
  pointer-events: none;
  transition: opacity .25s;
}
.modal-overlay.open {
  opacity: 1;
  pointer-events: all;
}
.modal {
  width: 100%;
  max-width: 540px;
  margin: 0 auto;
  background: var(--modal-bg);
  border: 1px solid var(--card-br);
  border-top-left-radius: 22px;
  border-top-right-radius: 22px;
  max-height: 92dvh;
  overflow-y: auto;
  transform: translateY(60px);
  transition: transform .3s cubic-bezier(.34,1.56,.64,1);
  padding-bottom: max(24px, env(safe-area-inset-bottom, 0px));
}
.modal-overlay.open .modal {
  transform: translateY(0);
}

.modal-handle {
  width: 36px; height: 4px;
  background: var(--card-br);
  border-radius: 2px;
  margin: 10px auto 0;
}

.modal-header {
  padding: 14px 18px 0;
  display: flex;
  align-items: flex-start;
  gap: 12px;
}

.modal-grape-icon {
  width: 52px; height: 52px;
  border-radius: 14px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 26px;
}
.modal-grape-icon.tinto {
  background: linear-gradient(135deg, var(--bordo2), var(--bordo3));
  border: 1px solid var(--bordo);
  box-shadow: 0 4px 16px rgba(122,31,38,.4);
}
.modal-grape-icon.branco {
  background: linear-gradient(135deg, #2A1E00, #1A1200);
  border: 1px solid var(--branco);
  box-shadow: 0 4px 16px rgba(201,162,39,.25);
}

.modal-title-block { flex: 1; min-width: 0; }
.modal-nome {
  font-family: 'Playfair Display', serif;
  font-size: 22px;
  color: var(--fg);
  line-height: 1.1;
}
.modal-sinonimos {
  font-size: 11px;
  color: var(--fg3);
  font-style: italic;
  margin-top: 3px;
}
.modal-origem {
  font-size: 12px;
  color: var(--fg2);
  margin-top: 4px;
  display: flex;
  align-items: center;
  gap: 5px;
}

.modal-body {
  padding: 16px 18px;
  display: flex;
  flex-direction: column;
  gap: 18px;
}

.modal-section h3 {
  font-size: 10px;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--gold);
  font-weight: 600;
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.modal-section h3::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--sep);
}

/* Aroma cloud */
.aroma-cloud {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.aroma-tag {
  font-size: 12px;
  padding: 5px 10px;
  border-radius: 20px;
  border: 1px solid rgba(212,175,55,.2);
  background: rgba(212,175,55,.06);
  color: var(--fg2);
  transition: background .15s;
}
.aroma-tag:hover { background: rgba(212,175,55,.12); }

/* Sensory meters */
.meter-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.meter-item { display: flex; flex-direction: column; gap: 4px; }
.meter-label {
  font-size: 10px;
  color: var(--fg3);
  letter-spacing: .04em;
}
.meter-track {
  height: 6px;
  background: rgba(255,255,255,.06);
  border-radius: 3px;
  overflow: hidden;
  position: relative;
}
.meter-fill {
  height: 100%;
  border-radius: 3px;
  transition: width .8s ease;
}
.meter-fill.taninos { background: linear-gradient(90deg, #8B2635, #D4AF37); }
.meter-fill.acidez  { background: linear-gradient(90deg, #1A6B3C, #4CAF50); }
.meter-fill.corpo   { background: linear-gradient(90deg, #3A1D6B, #8B63C4); }
.meter-fill.guarda  { background: linear-gradient(90deg, #0D4A5E, #2196F3); }

/* Regions list */
.regions-list {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.region-tag {
  font-size: 11px;
  padding: 4px 10px;
  border-radius: 20px;
  background: rgba(122,31,38,.2);
  border: 1px solid rgba(122,31,38,.4);
  color: #E8909A;
}

/* Estilos */
.estilos-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.estilo-item {
  font-size: 12px;
  color: var(--fg2);
  padding: 6px 10px;
  background: rgba(255,255,255,.03);
  border-left: 2px solid var(--gold);
  border-radius: 0 6px 6px 0;
  line-height: 1.3;
}

/* Educational content */
.edu-block {
  font-size: 13px;
  line-height: 1.65;
  color: var(--fg2);
  background: rgba(212,175,55,.04);
  border: 1px solid var(--sep);
  border-radius: 10px;
  padding: 12px 14px;
}

/* Extra facts row */
.facts-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
.fact-card {
  background: rgba(255,255,255,.03);
  border: 1px solid var(--card-br);
  border-radius: 10px;
  padding: 10px 12px;
}
.fact-label {
  font-size: 9px;
  color: var(--fg3);
  letter-spacing: .08em;
  text-transform: uppercase;
  margin-bottom: 4px;
}
.fact-value {
  font-size: 12px;
  color: var(--fg);
  line-height: 1.3;
}

/* CTA button */
.btn-estudada {
  width: calc(100% - 36px);
  margin: 0 18px;
  padding: 13px;
  border-radius: 12px;
  border: none;
  font-family: 'Montserrat', sans-serif;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  letter-spacing: .04em;
  transition: all .2s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.btn-estudada.unmarked {
  background: linear-gradient(135deg, var(--bordo), var(--bordo2));
  color: var(--fg);
  border: 1px solid var(--bordo);
}
.btn-estudada.marked {
  background: transparent;
  color: var(--gold);
  border: 1px solid rgba(212,175,55,.3);
}
.btn-estudada:hover { opacity: .85; }

/* ─── EMPTY STATE ─────────────────────────────────────────── */
.empty-state {
  grid-column: 1/-1;
  text-align: center;
  padding: 48px 16px;
  color: var(--fg3);
}
.empty-state .icon { font-size: 40px; margin-bottom: 12px; }
.empty-state p { font-size: 13px; line-height: 1.5; }

/* ─── BOTTOM NAV ──────────────────────────────────────────── */
.bottom-nav {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  background: linear-gradient(0deg, var(--bg) 70%, transparent);
  padding: 12px max(16px, env(safe-area-inset-left,0px))
           max(16px, env(safe-area-inset-bottom,0px))
           max(16px, env(safe-area-inset-right,0px));
  display: flex;
  gap: 8px;
  z-index: 30;
}
.nav-btn {
  flex: 1;
  padding: 10px;
  border-radius: 10px;
  border: 1px solid var(--card-br);
  background: var(--card-bg);
  color: var(--fg3);
  font-family: 'Montserrat', sans-serif;
  font-size: 11px;
  font-weight: 500;
  cursor: pointer;
  text-align: center;
  transition: all .2s;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
}
.nav-btn .icon { font-size: 18px; }
.nav-btn.active {
  background: var(--bordo2);
  border-color: var(--bordo);
  color: var(--fg);
}
.nav-btn:hover:not(.active) { border-color: var(--sep); color: var(--fg2); }

/* ─── CANVAS BG ───────────────────────────────────────────── */
#bgCanvas {
  position: fixed;
  inset: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  z-index: 0;
  opacity: .045;
}

/* wrap all above canvas */
.page-content { position: relative; z-index: 1; }

/* ─── XP TOAST ────────────────────────────────────────────── */
.xp-toast {
  position: fixed;
  bottom: 80px;
  left: 50%;
  transform: translateX(-50%) translateY(10px);
  background: var(--gold);
  color: #0D0608;
  font-weight: 700;
  font-size: 13px;
  padding: 8px 18px;
  border-radius: 20px;
  pointer-events: none;
  opacity: 0;
  z-index: 200;
  transition: opacity .2s, transform .2s;
  white-space: nowrap;
}
.xp-toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

/* ─── SCROLLBAR ───────────────────────────────────────────── */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--card-br); border-radius: 2px; }
</style>

<!-- Background canvas glass -->
<canvas id="bgCanvas"></canvas>

<div class="page-content">
  <!-- Header -->
  <div class="header">
    <div class="header-top">
      <button class="btn-back" onclick="goHome()" aria-label="Voltar">←</button>
      <div class="header-title">

      <span class="progress-count" id="progressCount">0 / 20</span>
    </div>
  </div>

  <!-- Card grid -->
  <div class="grid" id="castasGrid"></div>
</div>

<!-- Detail modal -->
<div class="modal-overlay" id="modalOverlay" onclick="handleOverlayClick(event)">
  <div class="modal" id="modal">
    <div class="modal-handle"></div>
    <div class="modal-header" id="modalHeader"></div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<!-- Bottom nav -->
<div class="bottom-nav">
  <button class="nav-btn" onclick="goHome()">
    <span class="icon">🏠</span>
    <span>Início</span>
  </button>
  <button class="nav-btn active">
    <span class="icon">🍇</span>
    <span>Castas</span>

  <button class="nav-btn">
    <span class="icon">🗺️</span>
    <span>Regiões</span>
  </button>
  <button class="nav-btn">
    <span class="icon">🏆</span>
    <span>Quiz</span>
  </button>
</div>

<!-- XP Toast -->
<div class="xp-toast" id="xpToast"></div>

let estudadas = new Set();
let sessionXP  = 0;
let activeFilter = 'todas';
let activeCasta  = null;

/* persist */
try {
  const s = JSON.parse(localStorage.getItem('vb_estudadas') || '[]');
  s.forEach(id => estudadas.add(id));
  sessionXP = parseInt(localStorage.getItem('vb_xp') || '0');
} catch(e){}

function saveState() {
  try {
    localStorage.setItem('vb_estudadas', JSON.stringify([...estudadas]));
    localStorage.setItem('vb_xp', sessionXP);
  } catch(e){}
}

/* ═══════════════════════════════════════════════════
   BG CANVAS (glass watermark)
═══════════════════════════════════════════════════ */
(function initBg(){
  const canvas = document.getElementById('bgCanvas');
  const ctx = canvas.getContext('2d');
  let W, H, dpr;

  function resize(){
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width  = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width  = W + 'px';
    canvas.style.height = H + 'px';
    ctx.scale(dpr, dpr);
    draw();
  }

  function draw(){
    ctx.clearRect(0,0,W,H);

    /* scale glass to fill ~55% of the screen height, centered */
    const BASE_H = 260;
    const scale  = (H * .55) / BASE_H;
    const ox = W/2 - 110*scale;
    const oy = H/2 - 140*scale;

    ctx.save();
    ctx.translate(ox, oy);
    ctx.scale(scale, scale);

    /* bowl */
    ctx.beginPath();
    ctx.moveTo(62,42);
    ctx.bezierCurveTo(54,100,68,138,68,138);
    ctx.quadraticCurveTo(82,165,110,177);
    ctx.quadraticCurveTo(138,165,152,138);
    ctx.bezierCurveTo(152,138,166,100,158,42);
    ctx.closePath();
    ctx.strokeStyle = '#D4AF37';
    ctx.lineWidth = 1.4;
    ctx.stroke();

    /* stem */
    ctx.beginPath();
    ctx.moveTo(110,177); ctx.lineTo(107,200); ctx.lineTo(113,200);
    ctx.strokeStyle = '#D4AF37'; ctx.lineWidth = 1.2; ctx.stroke();

    /* base */
    ctx.beginPath();
    ctx.moveTo(80,232);
    ctx.quadraticCurveTo(110,224,140,232);
    ctx.strokeStyle='#D4AF37'; ctx.lineWidth=1.2; ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(107,200);
    ctx.quadraticCurveTo(103,215,80,232);
    ctx.strokeStyle='#D4AF37'; ctx.lineWidth=1.2; ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(113,200);
    ctx.quadraticCurveTo(117,215,140,232);
    ctx.strokeStyle='#D4AF37'; ctx.lineWidth=1.2; ctx.stroke();

    ctx.restore();
  }

  window.addEventListener('resize', resize);
  resize();
})();

/* ═══════════════════════════════════════════════════
   RENDER GRID
═══════════════════════════════════════════════════ */
function setFilter(f, btn){
  activeFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderGrid();
}

function renderGrid(){
  const q = document.getElementById('searchInput').value.toLowerCase().trim();
  const grid = document.getElementById('castasGrid');

  const filtered = CASTAS.filter(c => {
    const matchFilter = activeFilter === 'todas' || c.cor === activeFilter;
    if(!matchFilter) return false;
    if(!q) return true;
    return c.nome.toLowerCase().includes(q)
      || c.sinonimos.some(s => s.toLowerCase().includes(q))
      || c.aromas.some(a => a.toLowerCase().includes(q))
      || c.regioes.some(r => r.toLowerCase().includes(q))
      || c.origem.toLowerCase().includes(q);
  });

  if(filtered.length === 0){
    grid.innerHTML = `<div class="empty-state">
      <div class="icon">🍷</div>
      <p>Nenhuma casta encontrada.<br>Tente outro termo de busca.</p>
    </div>`;
    return;
  }

  grid.innerHTML = filtered.map(c => {
    const est = estudadas.has(c.id);
    const chips = c.aromas.slice(0,3).map(a => `<span class="aroma-chip">${a}</span>`).join('');
    return `<div class="casta-card${est?' estudada':''}" onclick="openModal('${c.id}')">
      <span class="card-cor-badge ${c.cor}">${c.cor === 'tinto' ? '🔴' : '🟡'} ${c.cor}</span>
      <div class="card-nome">${c.nome}</div>
      <div class="card-origem">${c.origem}</div>
      <div class="card-aromas">${chips}</div>
    </div>`;
  }).join('');

  updateProgress();
}

function updateProgress(){
  const total = CASTAS.length;
  const done  = estudadas.size;
  const pct   = (done/total)*100;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressCount').textContent = `${done} / ${total}`;
  document.getElementById('xpPill').textContent = `⚡ ${sessionXP} XP`;
}

/* ═══════════════════════════════════════════════════
   MODAL
═══════════════════════════════════════════════════ */
function openModal(id){
  activeCasta = CASTAS.find(c => c.id === id);
  if(!activeCasta) return;
  const c = activeCasta;

  /* header */
  document.getElementById('modalHeader').innerHTML = `
    <div class="modal-grape-icon ${c.cor}">${c.emoji}</div>
    <div class="modal-title-block">
      <div class="modal-nome">${c.nome}</div>
      ${c.sinonimos.length ? `<div class="modal-sinonimos">também: ${c.sinonimos.join(', ')}</div>` : ''}
      <div class="modal-origem">📍 ${c.origem}</div>
    </div>`;

  /* body */
  const aromaTags = c.aromas.map(a => `<span class="aroma-tag">${a}</span>`).join('');
  const regionTags= c.regioes.map(r => `<span class="region-tag">${regionLabel(r)}</span>`).join('');
  const estilosHtml= c.estilos.map(e => `<div class="estilo-item">${e}</div>`).join('');

  document.getElementById('modalBody').innerHTML = `
    <div class="modal-section">
      <h3>Perfil de Aromas</h3>
      <div class="aroma-cloud">${aromaTags}</div>
    </div>

    <div class="modal-section">
      <h3>Perfil Sensorial</h3>
      <div class="meter-grid">
        ${meter('Taninos',c.taninos,'taninos')}
        ${meter('Acidez',c.acidez,'acidez')}
        ${meter('Corpo',c.corpo,'corpo')}
        ${meter('Potencial de Guarda',c.guarda,'guarda')}
      </div>
    </div>

    <div class="modal-section">
      <h3>Gustativa</h3>
      <div class="edu-block" style="font-size:12px;padding:10px 12px;">${c.gustativa}</div>
    </div>

    <div class="modal-section">
      <h3>Regiões Associadas</h3>
      <div class="regions-list">${regionTags}</div>
    </div>

    <div class="modal-section">
      <h3>Estilos Típicos</h3>
      <div class="estilos-list">${estilosHtml}</div>
    </div>

    <div class="modal-section">
      <h3>Dados da Casta</h3>
      <div class="facts-row">
        <div class="fact-card">
          <div class="fact-label">Espessura da Casca</div>
          <div class="fact-value">${c.casca}</div>
        </div>
        <div class="fact-card">
          <div class="fact-label">Maturação</div>
          <div class="fact-value">${c.maturacao}</div>
        </div>
      </div>
    </div>

    <div class="modal-section">
      <h3>Conteúdo Educativo</h3>
      <div class="edu-block">${c.educativo}</div>
    </div>

    <button class="btn-estudada ${estudadas.has(c.id)?'marked':'unmarked'}"
            id="btnEstudada" onclick="toggleEstudada('${c.id}')">
      ${estudadas.has(c.id) ? '✓ Marcada como Estudada' : '📚 Marcar como Estudada (+20 XP)'}
    </button>
    <div style="height:8px"></div>`;

  document.getElementById('modalOverlay').classList.add('open');

  /* animate meters after open */
  requestAnimationFrame(()=>{
    document.querySelectorAll('.meter-fill').forEach(el=>{
      el.style.width = el.dataset.pct + '%';
    });
  });
}

function meter(label, pct, cls){
  return `<div class="meter-item">
    <div class="meter-label">${label}</div>
    <div class="meter-track">
      <div class="meter-fill ${cls}" data-pct="${pct}" style="width:0%"></div>
    </div>
  </div>`;
}

function regionLabel(id){
  const map = {
    bordeaux:'Bordeaux', borgonha:'Borgonha', champagne:'Champagne',
    rhone:'Côtes du Rhône', toscana:'Toscana', piemonte:'Piemonte',
    rioja:'Rioja', 'ribera-del-duero':'Ribera del Duero',
    maipo:'Vale do Maipo', mendoza:'Mendoza', 'lujan-de-cuyo':'Luján de Cuyo',
    casablanca:'Valle de Casablanca', 'salta-cafayate':'Cafayate (Salta)',
    'porto-doc':'Porto DOC', 'douro-doc':'Douro DOC',
    'vinho-verde-doc':'Vinho Verde DOC'
  };
  return map[id] || id;
}

function closeModal(){
  document.getElementById('modalOverlay').classList.remove('open');
  activeCasta = null;
}

function handleOverlayClick(e){
  if(e.target === document.getElementById('modalOverlay')) closeModal();
}

/* ═══════════════════════════════════════════════════
   MARK AS STUDIED
═══════════════════════════════════════════════════ */
function toggleEstudada(id){
  const btn = document.getElementById('btnEstudada');
  if(estudadas.has(id)){
    estudadas.delete(id);
    btn.className = 'btn-estudada unmarked';
    btn.textContent = '📚 Marcar como Estudada (+20 XP)';
  } else {
    estudadas.add(id);
    sessionXP += 20;
    btn.className = 'btn-estudada marked';
    btn.textContent = '✓ Marcada como Estudada';
    showToast('+20 XP · Casta estudada!');
  }
  saveState();
  renderGrid();
  updateProgress();
}

function showToast(msg){
  const t = document.getElementById('xpToast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=> t.classList.remove('show'), 2200);
}

   NAV
═══════════════════════════════════════════════════ */
function goHome(){
  /* In a real app: navigate to home screen */
  /* For demo, just close modal if open */
  if(document.getElementById('modalOverlay').classList.contains('open')){
    closeModal();
  }
}

renderGrid();

</script>
