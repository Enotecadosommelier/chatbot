<title>VinoBianco · Explore a Casta</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@300;400;500;600;700&display=swap">

<style>
/* ─── TOKENS — Paleta real VinoBianco (Avório + Vinho + Ouro + Cinza)
   Neuromarketing: fundo ivory = sofisticação e confiança;
   bordô = autoridade do conhecimento; ouro = recompensa e exclusividade ─── */
:root {
  --ivory:       #F8F6EF;
  --ivory2:      #F0EDE3;
  --ivory3:      #E6E0D0;
  --vinho:       #7A1F26;
  --vinho2:      #5A1520;
  --vinho3:      #3A0D12;
  --vinho-soft:  rgba(122,31,38,.08);
  --ouro:        #D4AF37;
  --ouro2:       #B8941F;
  --cinza:       #6B6B6B;
  --cinza2:      #999;
  --cinza3:      #C4BDAF;

  --bg:       var(--ivory);
  --surface:  #FFFFFF;
  --surface2: var(--ivory2);
  --fg:       #2C1810;
  --fg2:      #5A4035;
  --fg3:      var(--cinza);
  --border:   rgba(122,31,38,.12);
  --border-hi:rgba(122,31,38,.30);
  --shadow:   rgba(44,24,16,.08);
  --shadow-md:rgba(44,24,16,.14);
  --correct:  #1E6B3A;
  --correct-bg:#E8F5EE;

  color-scheme: light;
}

* { box-sizing: border-box; margin: 0; padding: 0 }

body {
  background: var(--bg);
  color: var(--fg);
  font-family: 'Montserrat', sans-serif;
  font-size: 14px;
  min-height: 100dvh;
  overflow-x: hidden;
  padding-left:  max(16px, env(safe-area-inset-left,  0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
}

/* ─── HEADER ─── */
.header {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 40;
  background: var(--ivory);
  border-bottom: 1px solid rgba(212,175,55,.22);
  padding: 14px 0 10px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.header-top {
  display: flex;
  align-items: center;
  gap: 10px;
}

.brand-mark {
  width: 34px; height: 34px;
  border-radius: 50%;
  background: var(--vinho);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  box-shadow: 0 2px 8px rgba(122,31,38,.25);
}
.brand-mark svg { width: 18px; height: 18px; }

.header-title { flex: 1; min-width: 0; }
.header-title h1 {
  font-family: 'Playfair Display', serif;
  font-size: 17px;
  color: var(--vinho);
  line-height: 1.2;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.header-title p {
  font-size: 9px;
  color: var(--ouro2);
  letter-spacing: .1em;
  font-weight: 600;
  text-transform: uppercase;
  margin-top: 1px;
}

.xp-pill {
  background: rgba(212,175,55,.12);
  border: 1px solid rgba(212,175,55,.3);
  border-radius: 20px;
  padding: 4px 10px;
  font-size: 11px;
  color: var(--ouro2);
  font-weight: 700;
  white-space: nowrap;
}

/* ─── FILTER TABS ─── */
.filter-row { display: flex; gap: 8px; }
.filter-btn {
  flex: 1;
  padding: 7px 0;
  border: 1.5px solid var(--border);
  border-radius: 20px;
  background: var(--surface);
  color: var(--fg3);
  font-family: 'Montserrat', sans-serif;
  font-size: 12px; font-weight: 500;
  cursor: pointer;
  transition: all .2s;
  letter-spacing: .03em;
  box-shadow: 0 1px 3px var(--shadow);
}
.filter-btn.active {
  background: var(--vinho);
  border-color: var(--vinho);
  color: #fff;
  box-shadow: 0 3px 10px rgba(122,31,38,.25);
}
.filter-btn[data-filter="branco"].active {
  background: linear-gradient(135deg, var(--ouro2), #8A6B14);
  border-color: var(--ouro2);
  color: #fff;
}

/* ─── SEARCH ─── */
.search-wrap { position: relative; }
.search-input {
  width: 100%;
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: 20px;
  padding: 8px 14px 8px 36px;
  color: var(--fg);
  font-family: 'Montserrat', sans-serif;
  font-size: 13px;
  outline: none;
  transition: border-color .2s;
  box-shadow: 0 1px 4px var(--shadow);
}
.search-input:focus { border-color: var(--vinho); }
.search-input::placeholder { color: var(--cinza2); }
.search-icon {
  position: absolute; left: 12px; top: 50%;
  transform: translateY(-50%);
  color: var(--cinza2); font-size: 14px; pointer-events: none;
}

/* ─── PROGRESS BAR ─── */
.progress-bar-row {
  display: flex; align-items: center; gap: 8px; padding: 2px 0;
}
.progress-label { font-size: 9px; color: var(--cinza); letter-spacing: .08em; text-transform: uppercase; font-weight: 600; }
.progress-track {
  flex: 1; height: 4px; background: var(--ivory3); border-radius: 2px; overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--vinho), var(--ouro));
  border-radius: 2px; transition: width .6s ease;
}
.progress-count { font-size: 10px; color: var(--ouro2); font-weight: 700; }

/* ─── CARD GRID ─── */
.grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  padding: 10px 0 120px;
}
@media (min-width: 540px) { .grid { grid-template-columns: repeat(3, 1fr); } }

.casta-card {
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: 14px;
  padding: 14px 12px 12px;
  cursor: pointer;
  transition: transform .18s, border-color .18s, box-shadow .18s;
  position: relative; overflow: hidden;
  display: flex; flex-direction: column; gap: 8px;
  box-shadow: 0 2px 8px var(--shadow);
}
/* Neuromarketing: subtle warm gradient edge = handcrafted artisanal feel */
.casta-card::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 3px;
  background: linear-gradient(90deg, var(--vinho), var(--ouro));
  opacity: 0; transition: opacity .2s;
}
.casta-card:hover { border-color: var(--border-hi); box-shadow: 0 6px 20px var(--shadow-md); transform: translateY(-2px); }
.casta-card:hover::before { opacity: 1; }
.casta-card:active { transform: translateY(-1px) scale(.997); }
.casta-card.estudada { border-color: rgba(212,175,55,.4); }
.casta-card.estudada::before { opacity: 1; }
.casta-card.estudada::after {
  content: '✓';
  position: absolute; top: 8px; right: 8px;
  width: 18px; height: 18px;
  background: var(--ouro);
  color: #fff;
  border-radius: 50%;
  font-size: 10px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  line-height: 18px; text-align: center;
  box-shadow: 0 2px 6px rgba(212,175,55,.35);
}

.card-cor-badge {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 9px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
  padding: 2px 8px; border-radius: 10px; align-self: flex-start;
}
.card-cor-badge.tinto  { background: rgba(122,31,38,.09); color: var(--vinho); border: 1px solid rgba(122,31,38,.2); }
.card-cor-badge.branco { background: rgba(212,175,55,.12); color: var(--ouro2); border: 1px solid rgba(212,175,55,.25); }

.card-nome {
  font-family: 'Playfair Display', serif;
  font-size: 15px; line-height: 1.2; color: var(--fg);
  text-wrap: balance;
}
.card-origem {
  font-size: 10px; color: var(--fg3); line-height: 1.3;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.card-aromas {
  display: flex; flex-wrap: wrap; gap: 4px; margin-top: auto;
}
.aroma-chip {
  font-size: 9px; padding: 2px 7px; border-radius: 8px;
  background: var(--ivory2); color: var(--fg3);
  border: 1px solid var(--ivory3);
  white-space: nowrap;
}

/* ─── MODAL ─── */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(44,24,16,.45);
  backdrop-filter: blur(4px);
  z-index: 100;
  display: flex; align-items: flex-end;
  opacity: 0; pointer-events: none; transition: opacity .25s;
}
.modal-overlay.open { opacity: 1; pointer-events: all; }

.modal {
  width: 100%; max-width: 540px; margin: 0 auto;
  background: var(--surface);
  border: 1px solid var(--border);
  border-top-left-radius: 22px; border-top-right-radius: 22px;
  max-height: 93dvh; overflow-y: auto;
  transform: translateY(60px);
  transition: transform .3s cubic-bezier(.34,1.56,.64,1);
  padding-bottom: max(24px, env(safe-area-inset-bottom, 0px));
  box-shadow: 0 -8px 40px rgba(44,24,16,.18);
}
.modal-overlay.open .modal { transform: translateY(0); }

.modal-handle {
  width: 36px; height: 4px;
  background: var(--ivory3);
  border-radius: 2px; margin: 10px auto 0;
}

/* Gold accent bar at top of modal */
.modal-accent-bar {
  height: 3px;
  background: linear-gradient(90deg, var(--vinho), var(--ouro), var(--vinho));
  margin: 8px 18px 0;
  border-radius: 2px;
  opacity: .6;
}

.modal-header {
  padding: 14px 18px 0;
  display: flex; align-items: flex-start; gap: 12px;
}

.modal-grape-icon {
  width: 54px; height: 54px;
  border-radius: 14px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 28px;
}
.modal-grape-icon.tinto  { background: rgba(122,31,38,.09); border: 1.5px solid rgba(122,31,38,.22); box-shadow: 0 3px 12px rgba(122,31,38,.15); }
.modal-grape-icon.branco { background: rgba(212,175,55,.1);  border: 1.5px solid rgba(212,175,55,.28); box-shadow: 0 3px 12px rgba(212,175,55,.15); }

.modal-title-block { flex: 1; min-width: 0; }
.modal-nome { font-family: 'Playfair Display', serif; font-size: 24px; color: var(--fg); line-height: 1.1; }
.modal-sinonimos { font-size: 11px; color: var(--cinza); font-style: italic; margin-top: 3px; }
.modal-origem { font-size: 12px; color: var(--vinho); margin-top: 5px; font-weight: 500; }

.modal-body { padding: 16px 18px; display: flex; flex-direction: column; gap: 18px; }

.modal-section h3 {
  font-size: 9px; letter-spacing: .12em; text-transform: uppercase;
  color: var(--ouro2); font-weight: 700;
  margin-bottom: 8px;
  display: flex; align-items: center; gap: 6px;
}
.modal-section h3::after { content:''; flex:1; height:1px; background: rgba(212,175,55,.2); }

/* Aroma cloud */
.aroma-cloud { display: flex; flex-wrap: wrap; gap: 6px; }
.aroma-tag {
  font-size: 12px; padding: 5px 11px; border-radius: 20px;
  border: 1px solid var(--border);
  background: var(--ivory2); color: var(--fg2);
  transition: background .15s, border-color .15s;
}
.aroma-tag:hover { background: var(--ivory3); border-color: var(--border-hi); }

/* Sensory meters */
.meter-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.meter-item { display: flex; flex-direction: column; gap: 5px; }
.meter-label { font-size: 10px; color: var(--fg3); letter-spacing: .04em; font-weight: 500; }
.meter-track {
  height: 7px; background: var(--ivory3); border-radius: 4px; overflow: hidden;
}
.meter-fill { height: 100%; border-radius: 4px; transition: width .9s cubic-bezier(.2,0,.4,1); }
.meter-fill.taninos { background: linear-gradient(90deg, var(--vinho2), var(--vinho)); }
.meter-fill.acidez  { background: linear-gradient(90deg, #156B3A, #2FAF6B); }
.meter-fill.corpo   { background: linear-gradient(90deg, #3A1D6B, #7B5EC4); }
.meter-fill.guarda  { background: linear-gradient(90deg, var(--ouro2), var(--ouro)); }

/* Region tags */
.regions-list { display: flex; flex-wrap: wrap; gap: 6px; }
.region-tag {
  font-size: 11px; padding: 4px 11px; border-radius: 20px;
  background: var(--vinho-soft); border: 1px solid rgba(122,31,38,.2); color: var(--vinho);
  font-weight: 500;
}

/* Estilos */
.estilos-list { display: flex; flex-direction: column; gap: 6px; }
.estilo-item {
  font-size: 12px; color: var(--fg2); padding: 7px 11px;
  background: var(--ivory2); border-left: 3px solid var(--ouro);
  border-radius: 0 8px 8px 0; line-height: 1.3;
}

/* Educational content */
.edu-block {
  font-size: 13px; line-height: 1.7; color: var(--fg2);
  background: rgba(122,31,38,.04);
  border: 1px solid rgba(122,31,38,.1);
  border-radius: 10px; padding: 13px 15px;
}

/* Fact cards */
.facts-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.fact-card {
  background: var(--ivory2); border: 1px solid var(--border);
  border-radius: 10px; padding: 10px 12px;
}
.fact-label { font-size: 9px; color: var(--fg3); letter-spacing: .08em; text-transform: uppercase; margin-bottom: 4px; font-weight: 600; }
.fact-value { font-size: 12px; color: var(--fg); line-height: 1.3; font-weight: 500; }

/* CTA */
.btn-estudada {
  width: calc(100% - 36px); margin: 0 18px; padding: 13px;
  border-radius: 12px; border: none;
  font-family: 'Montserrat', sans-serif; font-size: 13px; font-weight: 600;
  cursor: pointer; letter-spacing: .04em; transition: all .2s;
  display: flex; align-items: center; justify-content: center; gap: 8px;
}
.btn-estudada.unmarked {
  background: linear-gradient(135deg, var(--vinho), var(--vinho2));
  color: #fff;
  box-shadow: 0 4px 16px rgba(122,31,38,.25);
}
.btn-estudada.marked {
  background: rgba(212,175,55,.1); color: var(--ouro2);
  border: 1.5px solid rgba(212,175,55,.35);
}
.btn-estudada:hover { opacity: .88; }
.btn-estudada:active { transform: scale(.98); }

/* ─── EMPTY STATE ─── */
.empty-state { grid-column:1/-1; text-align:center; padding:48px 16px; color:var(--cinza); }
.empty-state .icon { font-size:40px; margin-bottom:12px; }
.empty-state p { font-size:13px; line-height:1.5; }

/* ─── BOTTOM NAV ─── */
.bottom-nav {
  position: fixed; bottom:0; left:0; right:0;
  background: linear-gradient(0deg, var(--ivory) 70%, rgba(248,246,239,0));
  padding: 10px max(16px,env(safe-area-inset-left,0px))
           max(14px,env(safe-area-inset-bottom,0px))
           max(16px,env(safe-area-inset-right,0px));
  display: flex; gap: 8px; z-index: 30;
}
.nav-btn {
  flex: 1; padding: 9px; border-radius: 10px;
  border: 1.5px solid var(--border);
  background: var(--surface); color: var(--fg3);
  font-family: 'Montserrat', sans-serif; font-size: 11px; font-weight: 500;
  cursor: pointer; text-align: center; transition: all .2s;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  box-shadow: 0 1px 4px var(--shadow);
}
.nav-btn .icon { font-size: 18px; }
.nav-btn.active {
  background: var(--vinho); border-color: var(--vinho); color: #fff;
  box-shadow: 0 3px 12px rgba(122,31,38,.22);
}
.nav-btn:hover:not(.active) { border-color: var(--border-hi); color: var(--vinho); }

/* ─── XP TOAST ─── */
.xp-toast {
  position: fixed; bottom: 80px; left: 50%;
  transform: translateX(-50%) translateY(10px);
  background: var(--vinho); color: #fff;
  font-weight: 700; font-size: 13px; padding: 9px 18px;
  border-radius: 20px; pointer-events: none; opacity: 0; z-index: 200;
  transition: opacity .2s, transform .2s; white-space: nowrap;
  box-shadow: 0 4px 16px rgba(122,31,38,.3);
}
.xp-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ─── SCROLLBAR ─── */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: var(--ivory2); }
::-webkit-scrollbar-thumb { background: var(--ivory3); border-radius: 2px; }
.modal::-webkit-scrollbar-thumb { background: var(--border); }
</style>

/* ─── STATE ─── */
let estudadas = new Set();
let sessionXP  = 0;
let activeFilter = 'todas';

try {
  const s = JSON.parse(localStorage.getItem('vb_estudadas') || '[]');
  s.forEach(id => estudadas.add(id));
  sessionXP = parseInt(localStorage.getItem('vb_xp') || '0');
} catch(e){}

function saveState(){
  try {
    localStorage.setItem('vb_estudadas', JSON.stringify([...estudadas]));
    localStorage.setItem('vb_xp', sessionXP);
  } catch(e){}
}

/* ─── GRID ─── */
function setFilter(f, btn){
  activeFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderGrid();
}

function renderGrid(){
  const q    = document.getElementById('searchInput').value.toLowerCase().trim();
  const grid = document.getElementById('castasGrid');
  const filtered = CASTAS.filter(c => {
    if(activeFilter !== 'todas' && c.cor !== activeFilter) return false;
    if(!q) return true;
    return c.nome.toLowerCase().includes(q) ||
           c.sinonimos.some(s => s.toLowerCase().includes(q)) ||
           c.aromas.some(a => a.toLowerCase().includes(q)) ||
           c.regioes.some(r => r.toLowerCase().includes(q)) ||
           c.origem.toLowerCase().includes(q);
  });

  if(!filtered.length){
    grid.innerHTML = `<div class="empty-state"><div class="icon">🍷</div><p>Nenhuma casta encontrada.<br>Tente outro termo de busca.</p></div>`;
    return;
  }

  grid.innerHTML = filtered.map(c => {
    const est   = estudadas.has(c.id);
    const chips = c.aromas.slice(0,3).map(a => `<span class="aroma-chip">${a}</span>`).join('');
    return `<div class="casta-card${est?' estudada':''}" onclick="openModal('${c.id}')">
      <span class="card-cor-badge ${c.cor}">${c.cor==='tinto'?'🔴':'🟡'} ${c.cor}</span>
      <div class="card-nome">${c.nome}</div>
      <div class="card-origem">${c.origem}</div>
      <div class="card-aromas">${chips}</div>
    </div>`;
  }).join('');

  updateProgress();
}

function updateProgress(){
  const pct = (estudadas.size / CASTAS.length) * 100;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressCount').textContent = `${estudadas.size} / ${CASTAS.length}`;
  document.getElementById('xpPill').textContent = `⚡ ${sessionXP} XP`;
}

/* ─── MODAL ─── */
function openModal(id){
  const c = CASTAS.find(x => x.id === id);
  if(!c) return;

  document.getElementById('modalHeader').innerHTML = `
    <div class="modal-grape-icon ${c.cor}">${c.emoji}</div>
    <div class="modal-title-block">
      <div class="modal-nome">${c.nome}</div>
      ${c.sinonimos.length ? `<div class="modal-sinonimos">também: ${c.sinonimos.join(', ')}</div>` : ''}
      <div class="modal-origem">📍 ${c.origem}</div>
    </div>`;

  const aromaTags  = c.aromas.map(a  => `<span class="aroma-tag">${a}</span>`).join('');
  const regionTags = c.regioes.map(r => `<span class="region-tag">${regionLabel(r)}</span>`).join('');
  const estilosHtml= c.estilos.map(e => `<div class="estilo-item">${e}</div>`).join('');

  document.getElementById('modalBody').innerHTML = `
    <div class="modal-section"><h3>Perfil de Aromas</h3><div class="aroma-cloud">${aromaTags}</div></div>
    <div class="modal-section"><h3>Perfil Sensorial</h3>
      <div class="meter-grid">
        ${meter('Taninos', c.taninos, 'taninos')}
        ${meter('Acidez',  c.acidez,  'acidez')}
        ${meter('Corpo',   c.corpo,   'corpo')}
        ${meter('Potencial de Guarda', c.guarda, 'guarda')}
      </div>
    </div>
    <div class="modal-section"><h3>Gustativa</h3>
      <div class="edu-block" style="font-size:12px;padding:10px 12px;">${c.gustativa}</div>
    </div>
    <div class="modal-section"><h3>Regiões Associadas</h3><div class="regions-list">${regionTags}</div></div>
    <div class="modal-section"><h3>Estilos Típicos</h3><div class="estilos-list">${estilosHtml}</div></div>
    <div class="modal-section"><h3>Dados da Casta</h3>
      <div class="facts-row">
        <div class="fact-card"><div class="fact-label">Casca</div><div class="fact-value">${c.casca}</div></div>
        <div class="fact-card"><div class="fact-label">Maturação</div><div class="fact-value">${c.maturacao}</div></div>
      </div>
    </div>
    <div class="modal-section"><h3>Conteúdo Educativo</h3><div class="edu-block">${c.educativo}</div></div>
    <button class="btn-estudada ${estudadas.has(c.id)?'marked':'unmarked'}"
            id="btnEstudada" onclick="toggleEstudada('${c.id}')">
      ${estudadas.has(c.id) ? '✓ Marcada como Estudada' : '📚 Marcar como Estudada (+20 XP)'}
    </button>
    <div style="height:8px"></div>`;

  document.getElementById('modalOverlay').classList.add('open');

  requestAnimationFrame(()=>{
    document.querySelectorAll('.meter-fill').forEach(el => {
      el.style.width = el.dataset.pct + '%';
    });
  });
}

function meter(label, pct, cls){
  return `<div class="meter-item">
    <div class="meter-label">${label}</div>
    <div class="meter-track">
      <div class="meter-fill ${cls}" data-pct="${pct}" style="width:0%"></div>
    </div>
  </div>`;
}

function regionLabel(id){
  const map = {bordeaux:'Bordeaux',borgonha:'Borgonha',champagne:'Champagne',rhone:'Côtes du Rhône',
    toscana:'Toscana',piemonte:'Piemonte',rioja:'Rioja','ribera-del-duero':'Ribera del Duero',
    maipo:'Vale do Maipo',mendoza:'Mendoza','lujan-de-cuyo':'Luján de Cuyo',
    casablanca:'Valle de Casablanca','salta-cafayate':'Cafayate (Salta)',
    'porto-doc':'Porto DOC','douro-doc':'Douro DOC','vinho-verde-doc':'Vinho Verde DOC'};
  return map[id] || id;
}

function closeModal(){ document.getElementById('modalOverlay').classList.remove('open'); }
function handleOverlayClick(e){ if(e.target===document.getElementById('modalOverlay')) closeModal(); }

function toggleEstudada(id){
  const btn = document.getElementById('btnEstudada');
  if(estudadas.has(id)){
    estudadas.delete(id);
    btn.className = 'btn-estudada unmarked';
    btn.textContent = '📚 Marcar como Estudada (+20 XP)';
  } else {
    estudadas.add(id);
    sessionXP += 20;
    btn.className = 'btn-estudada marked';
    btn.textContent = '✓ Marcada como Estudada';
    showToast('+20 XP · Casta estudada!');
  }
  saveState();
  renderGrid();
  updateProgress();
}

function showToast(msg){
  const t = document.getElementById('xpToast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=> t.classList.remove('show'), 2200);
}

function goHome(){}

document.addEventListener('keydown', e => { if(e.key==='Escape') closeModal(); });
renderGrid();
updateProgress();
</script>
