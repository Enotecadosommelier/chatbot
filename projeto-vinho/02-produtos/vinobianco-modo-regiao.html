<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
<meta name="claude:viewport-fit-sides" content="cover"/>
<title>VinoBianco · Regiões</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Montserrat:wght@300;400;500;600;700&display=swap"/>
<style>
:root{
  --ivory:#F8F6EF;--ivory2:#F0EDE3;--ivory3:#E8E3D6;
  --vinho:#7A1F26;--vinho2:#5A1520;
  --ouro:#D4AF37;--ouro2:#B8941F;
  --cinza:#6B6B6B;--cinza2:#999;--cinza3:#C0BAB0;
  --bg:var(--ivory);--surface:#FFFFFF;
  --fg:#2C1810;--fg2:#5A4035;--fg3:var(--cinza);
  --border:rgba(122,31,38,.13);--border-hi:rgba(122,31,38,.32);
  --correct:#1E6B3A;--correct-bg:#E8F5EE;
  --wrong:var(--vinho);
  --shadow:rgba(44,24,16,.09);--shadow-md:rgba(44,24,16,.15);
  --ff-d:'Playfair Display',Georgia,serif;
  --ff-b:'Montserrat',system-ui,sans-serif;
  /* Country colours */
  --col-fr:#2A5A90;--col-es:#8C3A3A;--col-pt:#7A4022;
  --col-it:#3A6828;--col-ar:#2A4878;--col-cl:#6A2A78;--col-br:#287840;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:var(--ivory);color:var(--fg);font-family:var(--ff-b);overflow:hidden}

.shell{
  display:grid;grid-template-rows:auto auto 1fr auto;
  width:100vw;height:100dvh;max-width:760px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  position:relative;overflow:hidden;
}

/* ══ HEADER ══ */
.header{display:flex;align-items:center;gap:10px;padding:10px 0 8px;border-bottom:1px solid var(--border);}
.brand-mark{width:36px;height:36px;border-radius:50%;background:var(--vinho);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.brand-mark svg{width:20px;height:22px}
.game-title{font-family:var(--ff-d);font-size:.95rem;color:var(--vinho);font-weight:600;letter-spacing:.02em}
.game-sub{font-size:.68rem;color:var(--fg3);margin-top:1px;letter-spacing:.04em;text-transform:uppercase}
.spacer{flex:1}
.xp-pill{background:var(--ouro);color:#fff;border-radius:20px;padding:3px 10px;font-size:.72rem;font-weight:700;letter-spacing:.04em;box-shadow:0 1px 4px rgba(212,175,55,.3);}
.lives{display:flex;gap:4px;align-items:center}
.life-svg{width:14px;height:17px;transition:all .3s}
.life-svg.lost{opacity:.22;transform:scale(.8)}

/* ══ TABS ══ */
.tabs{display:flex;gap:8px;padding:10px 0 0;}
.tab{flex:1;padding:8px 0;border-radius:10px 10px 0 0;border:1px solid var(--border);border-bottom:none;background:var(--ivory2);color:var(--fg3);font-family:var(--ff-b);font-size:.78rem;font-weight:600;cursor:pointer;transition:all .2s;letter-spacing:.03em;}
.tab.active{background:var(--surface);color:var(--vinho);border-color:var(--border-hi);}
.tab:hover:not(.active){background:var(--ivory3)}
.continent-flag{margin-right:4px}

/* ══ MAP WRAP ══ */
.map-wrap{position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--border);border-top:none;border-radius:0 0 14px 14px;}
.map-svg{width:100%;height:100%;display:block;position:relative;z-index:1}
.map-svg.hidden{display:none}

/* ══ GLASS WATERMARK ══ */
.glass-watermark{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(200px,52vw);opacity:.08;pointer-events:none;z-index:0;filter:drop-shadow(0 2px 8px rgba(122,31,38,.05));}

/* ══ MAP: OCEAN ══ */
.ocean{fill:#B8CDD8}

/* ══ MAP: COUNTRY FILLS ══ */
.land{stroke:#FFFFFF;stroke-width:1.2;stroke-linejoin:round;transition:fill .3s}
.land-pt{fill:#DFC5B2}
.land-es{fill:#EDE4CC}
.land-fr{fill:#C8DCE8}
.land-it{fill:#C8DDB8}
.land-de{fill:#DDDBD0}
.land-cl{fill:#D8C0DC}
.land-ar{fill:#C4D5EC}
.land-br{fill:#C0DCBA}
.land-pe{fill:#D8D2C0}
/* Active (country highlight) */
.land-fr.active{fill:#A0C0D8}
.land-es.active{fill:#D8CC9C}
.land-pt.active{fill:#CCA080}
.land-it.active{fill:#A0C490}
.land-ar.active{fill:#A0B8DC}
.land-cl.active{fill:#B898C8}
.land-br.active{fill:#90C090}

/* ══ MAP: RIVERS ══ */
.river{fill:none;stroke:#80AAC4;stroke-width:.9;stroke-linecap:round;opacity:.7}

/* ══ MAP: LABELS ══ */
.country-label{font-family:var(--ff-b);font-size:8px;fill:#5A5450;text-anchor:middle;font-weight:600;letter-spacing:.07em;text-transform:uppercase;}
.sea-label{font-family:var(--ff-d);font-size:7.5px;fill:#70909C;text-anchor:middle;font-style:italic;letter-spacing:.04em;}

/* ══ REGION ZONES — pin + badge ══ */
.rzone{cursor:pointer}
.rzone .rhit{fill:transparent}
.rzone .rglow{fill:none;stroke:none;pointer-events:none;r:0;transition:all .2s}
.rzone .rpin{fill:#fff;stroke-width:1.6;transition:all .22s;r:5}
.rzone .rbadge{fill:rgba(255,255,255,.92);stroke-width:.9;transition:all .22s}
.rzone .rtxt{font-family:var(--ff-b);font-size:6.5px;text-anchor:middle;font-weight:700;letter-spacing:.05em;pointer-events:none;dominant-baseline:middle}

/* Country-specific pin/badge colours */
.rzone[data-country="fr"] .rpin{stroke:var(--col-fr)}
.rzone[data-country="fr"] .rbadge{stroke:rgba(42,90,144,.28)}
.rzone[data-country="fr"] .rtxt{fill:var(--col-fr)}
.rzone[data-country="es"] .rpin{stroke:var(--col-es)}
.rzone[data-country="es"] .rbadge{stroke:rgba(140,58,58,.28)}
.rzone[data-country="es"] .rtxt{fill:var(--col-es)}
.rzone[data-country="pt"] .rpin{stroke:var(--col-pt)}
.rzone[data-country="pt"] .rbadge{stroke:rgba(122,64,34,.28)}
.rzone[data-country="pt"] .rtxt{fill:var(--col-pt)}
.rzone[data-country="it"] .rpin{stroke:var(--col-it)}
.rzone[data-country="it"] .rbadge{stroke:rgba(58,104,40,.28)}
.rzone[data-country="it"] .rtxt{fill:var(--col-it)}
.rzone[data-country="ar"] .rpin{stroke:var(--col-ar)}
.rzone[data-country="ar"] .rbadge{stroke:rgba(42,72,120,.28)}
.rzone[data-country="ar"] .rtxt{fill:var(--col-ar)}
.rzone[data-country="cl"] .rpin{stroke:var(--col-cl)}
.rzone[data-country="cl"] .rbadge{stroke:rgba(106,42,120,.28)}
.rzone[data-country="cl"] .rtxt{fill:var(--col-cl)}
.rzone[data-country="br"] .rpin{stroke:var(--col-br)}
.rzone[data-country="br"] .rbadge{stroke:rgba(40,120,64,.28)}
.rzone[data-country="br"] .rtxt{fill:var(--col-br)}

/* Hover */
.rzone:hover .rpin{r:7;filter:drop-shadow(0 1px 3px rgba(0,0,0,.18))}
.rzone:hover .rbadge{fill:rgba(255,255,255,1);filter:drop-shadow(0 1px 3px rgba(0,0,0,.12))}

/* Target — pulsing glow + gold badge */
.rzone.target .rglow{stroke:var(--ouro);stroke-width:1.5;animation:pulse-glow 1.6s ease-in-out infinite}
.rzone.target .rpin{fill:rgba(212,175,55,.2);stroke:var(--ouro)!important;filter:drop-shadow(0 0 4px rgba(212,175,55,.5))}
.rzone.target .rbadge{stroke:var(--ouro)!important;fill:rgba(255,251,235,.95);filter:drop-shadow(0 0 3px rgba(212,175,55,.3))}
.rzone.target .rtxt{fill:var(--ouro2)!important}
@keyframes pulse-glow{
  0%,100%{r:10;opacity:.9}
  50%{r:16;opacity:.35}
}

/* Correct */
.rzone.correct .rpin{fill:rgba(30,107,58,.2);stroke:#1E6B3A!important;animation:none}
.rzone.correct .rbadge{stroke:#1E6B3A!important;fill:rgba(230,248,236,.95)}
.rzone.correct .rtxt{fill:#1E6B3A!important}
.rzone.correct .rglow{animation:none}

/* Wrong */
.rzone.wrong .rpin{fill:rgba(122,31,38,.2);stroke:var(--vinho)!important;animation:none}
.rzone.wrong .rbadge{stroke:var(--vinho)!important;fill:rgba(253,240,240,.95)}
.rzone.wrong .rtxt{fill:var(--vinho)!important}
.rzone.wrong .rglow{animation:none}

/* Disabled */
.rzone.disabled{pointer-events:none}

/* Compass rose */
.compass{opacity:.4;pointer-events:none}

/* ══ QUESTION CARD ══ */
.q-card{padding:12px 0 max(14px,env(safe-area-inset-bottom,0px));border-top:1px solid var(--border);}
.q-instruction{font-size:.67rem;text-transform:uppercase;letter-spacing:.1em;color:var(--fg3);margin-bottom:3px;}
.q-region{font-family:var(--ff-d);font-size:1.4rem;color:var(--vinho);font-weight:700;line-height:1.2}
.q-hint{font-size:.72rem;color:var(--fg3);margin-top:3px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.q-hint-chip{background:var(--ivory2);border:1px solid var(--border);border-radius:20px;padding:2px 8px;font-size:.66rem;color:var(--fg2);font-weight:500;}
.q-progress{margin-top:8px;height:3px;background:var(--ivory3);border-radius:2px;overflow:hidden;}
.q-progress-bar{height:100%;background:var(--ouro);transition:width .4s ease;border-radius:2px}
.q-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.round-badge{flex-shrink:0;background:var(--ivory2);border:1px solid var(--border);border-radius:10px;padding:4px 10px;text-align:center;}
.round-num{font-size:1rem;font-weight:700;color:var(--vinho);font-family:var(--ff-d)}
.round-lbl{font-size:.6rem;text-transform:uppercase;letter-spacing:.08em;color:var(--fg3)}

/* ══ TOAST ══ */
.toast{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(.8);background:var(--surface);border-radius:16px;padding:18px 28px;text-align:center;box-shadow:0 8px 32px var(--shadow-md);border:1.5px solid var(--border);opacity:0;pointer-events:none;z-index:20;transition:all .25s;min-width:220px;}
.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1);pointer-events:auto}
.toast-icon{font-size:2.4rem;margin-bottom:6px}
.toast-title{font-family:var(--ff-d);font-size:1.1rem;font-weight:700;margin-bottom:4px}
.toast-title.ok{color:var(--correct)}
.toast-title.no{color:var(--vinho)}
.toast-fact{font-size:.73rem;color:var(--fg2);line-height:1.5;max-width:220px}
.toast-btn{margin-top:12px;background:var(--vinho);color:#fff;border:none;border-radius:20px;padding:8px 24px;font-family:var(--ff-b);font-size:.8rem;font-weight:600;cursor:pointer;letter-spacing:.04em;}
.toast-btn:hover{background:var(--vinho2)}

/* ══ OVERLAY ══ */
.overlay{position:absolute;inset:0;background:rgba(248,246,239,.96);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:30;gap:16px;padding:24px;text-align:center;backdrop-filter:blur(4px);}
.overlay.hidden{display:none}
.ov-glass{margin-bottom:4px}
.ov-title{font-family:var(--ff-d);font-size:1.7rem;color:var(--vinho);font-weight:700;line-height:1.2}
.ov-sub{font-size:.82rem;color:var(--fg2);max-width:300px;line-height:1.6;margin-top:4px}
.ov-chips{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;max-width:320px}
.ov-chip{background:var(--ivory2);border:1px solid var(--border);border-radius:20px;padding:4px 12px;font-size:.7rem;color:var(--fg2);}
.ov-btn{background:var(--vinho);color:#fff;border:none;border-radius:24px;padding:13px 36px;font-family:var(--ff-b);font-size:.9rem;font-weight:700;cursor:pointer;letter-spacing:.06em;box-shadow:0 4px 12px rgba(122,31,38,.3);transition:all .2s;margin-top:4px;}
.ov-btn:hover{background:var(--vinho2);transform:translateY(-1px)}
.ov-stat{text-align:center}
.ov-stat-num{font-family:var(--ff-d);font-size:2.2rem;font-weight:700;color:var(--vinho)}
.ov-stat-lbl{font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;color:var(--fg3)}
.ov-stats-row{display:flex;gap:28px;justify-content:center}
.ov-result-title{font-family:var(--ff-d);font-size:1.1rem;color:var(--ouro2);font-weight:700}
</style>
</head>

const ROUNDS_TOTAL=10, MAX_LIVES=3;
let state={lives:MAX_LIVES,xp:0,round:0,correct:0,queue:[],current:null,answered:false,score:0};

function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

window.addEventListener('DOMContentLoaded',()=>{
  buildLives(); updateXP();
  const chips=document.getElementById('startChips');
  ['10 regiões','3 continentes','3 vidas','Mapa interativo'].forEach(t=>{
    const c=document.createElement('span');c.className='ov-chip';c.textContent=t;chips.appendChild(c);
  });
});

function buildLives(){
  const el=document.getElementById('livesDisplay');
  el.innerHTML='';
  for(let i=0;i<MAX_LIVES;i++){
    const alive=i<state.lives;
    const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
    svg.setAttribute('viewBox','0 0 200 248');
    svg.classList.add('life-svg');
    if(!alive)svg.classList.add('lost');
    const col=alive?'#7A1F26':'#C0BAB0';
    svg.innerHTML=`
      ${alive?`<path d="M58,36 C50,92 60,132 66,144 Q80,168 100,176 Q120,168 134,144 C140,132 150,92 142,36 Z" fill="rgba(122,31,38,.2)"/>`:''}
      <path d="M58,36 C50,92 60,132 66,144 Q80,168 100,176 Q120,168 134,144 C140,132 150,92 142,36" stroke="${col}" stroke-width="14" fill="none" stroke-linecap="round"/>
      <path d="M58,36 Q100,30 142,36" stroke="${col}" stroke-width="14" fill="none"/>
      <path d="M100,176 L98,200 L102,200" stroke="${col}" stroke-width="13" fill="none" stroke-linecap="round"/>
      <path d="M74,222 Q100,228 126,222" stroke="${col}" stroke-width="12" fill="none" stroke-linecap="round"/>`;
    el.appendChild(svg);
  }
}

function updateXP(){document.getElementById('xpDisplay').textContent=state.xp+' XP';}

function switchContinent(c){
  document.getElementById('mapEuropa').classList.toggle('hidden',c!=='europa');
  document.getElementById('mapSA').classList.toggle('hidden',c!=='sa');
  document.getElementById('tabEuropa').classList.toggle('active',c==='europa');
  document.getElementById('tabSA').classList.toggle('active',c==='sa');
}

function startGame(){
  document.getElementById('startOverlay').classList.add('hidden');
  state.lives=MAX_LIVES;state.xp=0;state.round=0;state.correct=0;state.score=0;state.answered=false;
  state.queue=shuffle(REGIOES).slice(0,ROUNDS_TOTAL);
  buildLives();updateXP();clearAllZones();nextRound();
}

function restartGame(){document.getElementById('endOverlay').classList.add('hidden');startGame();}

function nextRound(){
  hideToast();clearAllZones();
  if(state.round>=ROUNDS_TOTAL||state.lives<=0){endGame();return;}
  state.answered=false;state.current=state.queue[state.round];state.round++;
  switchContinent(state.current.continente);
  document.getElementById('qRegion').textContent=state.current.nome;
  document.getElementById('roundNum').textContent=state.round;
  document.getElementById('qBar').style.width=((state.round-1)/ROUNDS_TOTAL*100)+'%';
  const hintEl=document.getElementById('qHint');hintEl.innerHTML='';
  const chips=[state.current.pais,...state.current.dicas.slice(0,2)];
  chips.forEach(t=>{const c=document.createElement('span');c.className='q-hint-chip';c.textContent=t;hintEl.appendChild(c);});
  highlightCountry(state.current.pais,true);
  const gz=document.querySelector(`.rzone[data-id="${state.current.id}"]`);
  if(gz){gz.classList.add('target');}
}

function highlightCountry(pais,on){
  const map={'França':['land-fr'],'Espanha':['land-es'],'Itália':['land-it'],'Portugal':['land-pt'],'Argentina':['land-ar'],'Chile':['land-cl'],'Brasil':['land-br']};
  (map[pais]||[]).forEach(id=>{const el=document.getElementById(id);if(el)el.classList.toggle('active',on);});
}

function clearAllZones(){
  document.querySelectorAll('.rzone').forEach(z=>z.classList.remove('target','correct','wrong','disabled'));
  document.querySelectorAll('.country-hi').forEach(e=>e.classList.remove('active'));
}

function clickRegion(id){
  if(state.answered||!state.current)return;
  state.answered=true;
  const correct=(id===state.current.id);
  const gz=document.querySelector(`.rzone[data-id="${id}"]`);
  const correctGz=document.querySelector(`.rzone[data-id="${state.current.id}"]`);
  document.querySelectorAll('.rzone').forEach(z=>z.classList.add('disabled'));
  if(correct){
    gz.classList.remove('target');gz.classList.add('correct');
    state.correct++;state.score+=100;state.xp+=15;
    showToast(true,state.current);
  }else{
    gz.classList.add('wrong');
    if(correctGz){correctGz.classList.remove('target');correctGz.classList.add('correct');}
    state.lives--;buildLives();
    showToast(false,state.current);
  }
  updateXP();
  document.getElementById('qBar').style.width=(state.round/ROUNDS_TOTAL*100)+'%';
}

function showToast(ok,regiao){
  document.getElementById('toastIcon').textContent=ok?'🍷':'🗺️';
  const titleEl=document.getElementById('toastTitle');
  titleEl.textContent=ok?'Região encontrada!':'Que pena…';
  titleEl.className='toast-title '+(ok?'ok':'no');
  document.getElementById('toastFact').textContent=(ok?'':'A região correta era '+regiao.nome+'. ')+regiao.fato;
  const toast=document.getElementById('toast');toast.classList.add('show');
  document.getElementById('toastBtn').textContent=(state.lives<=0||state.round>=ROUNDS_TOTAL)?(state.lives<=0?'Ver resultado →':'Finalizar →'):'Próxima →';
}

function hideToast(){document.getElementById('toast').classList.remove('show');}

function endGame(){
  hideToast();
  const pct=state.correct/ROUNDS_TOTAL;
  let emoji='🍷',title='',msg='';
  if(pct>=.9){emoji='🏆';title='Sommelier Experiente!';msg='Conhecimento geográfico impecável. Você domina o mapa do vinho mundial!';}
  else if(pct>=.7){emoji='🥇';title='Muito bem!';msg='Você conhece bem as regiões. Continue explorando o mapa para chegar à perfeição.';}
  else if(pct>=.5){emoji='📍';title='Bom começo!';msg='Você acertou mais da metade. Estude os países e as castas de cada região.';}
  else{emoji='🌏';title='Continue praticando!';msg='Cada região tem uma história. Explore as dicas e tente novamente!';}
  document.getElementById('endEmoji').textContent=emoji;
  document.getElementById('endTitle').textContent=title;
  document.getElementById('endScore').textContent=state.score;
  document.getElementById('endCorrect').textContent=state.correct+'/'+ROUNDS_TOTAL;
  document.getElementById('endXP').textContent='+'+state.xp;
  document.getElementById('endMsg').textContent=msg;
  document.getElementById('endOverlay').classList.remove('hidden');
}
</script>
