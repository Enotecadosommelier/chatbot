<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
<meta name="claude:viewport-fit-sides" content="cover"/>
<title>VinoBianco · Regiões</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Montserrat:wght@300;400;500;600;700&display=swap"/>
<style>
:root{
  --ivory:#F8F6EF;--ivory2:#F0EDE3;--ivory3:#E8E3D6;
  --vinho:#7A1F26;--vinho2:#5A1520;
  --ouro:#D4AF37;--ouro2:#B8941F;
  --cinza:#6B6B6B;--cinza2:#999;--cinza3:#C0BAB0;
  --bg:var(--ivory);--surface:#FFFFFF;
  --fg:#2C1810;--fg2:#5A4035;--fg3:var(--cinza);
  --border:rgba(122,31,38,.13);--border-hi:rgba(122,31,38,.32);
  --correct:#1E6B3A;--correct-bg:#E8F5EE;
  --wrong:var(--vinho);--wrong-bg:#FAEAEA;
  --shadow:rgba(44,24,16,.09);--shadow-md:rgba(44,24,16,.15);
  --ff-d:'Playfair Display',Georgia,serif;
  --ff-b:'Montserrat',system-ui,sans-serif;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:var(--ivory);color:var(--fg);font-family:var(--ff-b);overflow:hidden}

.shell{
  display:grid;grid-template-rows:auto auto 1fr auto;
  width:100vw;height:100dvh;max-width:760px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  position:relative;overflow:hidden;
}

/* ══ HEADER ══ */
.header{
  display:flex;align-items:center;gap:10px;
  padding:10px 0 8px;
  border-bottom:1px solid var(--border);
}
.brand-mark{
  width:36px;height:36px;border-radius:50%;
  background:var(--vinho);display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.brand-mark svg{width:20px;height:22px}
.game-title{font-family:var(--ff-d);font-size:.95rem;color:var(--vinho);font-weight:600;letter-spacing:.02em}
.game-sub{font-size:.68rem;color:var(--fg3);margin-top:1px;letter-spacing:.04em;text-transform:uppercase}
.spacer{flex:1}
.xp-pill{
  background:var(--ouro);color:#fff;border-radius:20px;
  padding:3px 10px;font-size:.72rem;font-weight:700;letter-spacing:.04em;
  box-shadow:0 1px 4px rgba(212,175,55,.3);
}
.lives{display:flex;gap:4px;align-items:center}
.life-svg{width:14px;height:17px;transition:all .3s}
.life-svg.lost{opacity:.22;transform:scale(.8)}

/* ══ TABS ══ */
.tabs{
  display:flex;gap:8px;padding:10px 0 0;
}
.tab{
  flex:1;padding:8px 0;border-radius:10px 10px 0 0;
  border:1px solid var(--border);border-bottom:none;
  background:var(--ivory2);color:var(--fg3);
  font-family:var(--ff-b);font-size:.78rem;font-weight:600;cursor:pointer;
  transition:all .2s;letter-spacing:.03em;
}
.tab.active{background:var(--surface);color:var(--vinho);border-color:var(--border-hi);}
.tab:hover:not(.active){background:var(--ivory3)}
.continent-flag{margin-right:4px}

/* ══ MAP WRAP ══ */
.map-wrap{
  position:relative;overflow:hidden;
  background:var(--surface);
  border:1px solid var(--border);border-top:none;
  border-radius:0 0 14px 14px;
}
.map-svg{width:100%;height:100%;display:block;position:relative;z-index:1}
.map-svg.hidden{display:none}

/* ══ GLASS WATERMARK ══ */
.glass-watermark{
  position:absolute;left:50%;top:50%;
  transform:translate(-50%,-50%);
  width:min(200px,52vw);
  opacity:.13;pointer-events:none;z-index:0;
  filter:drop-shadow(0 2px 8px rgba(122,31,38,.08));
}

/* ══ COUNTRY SHAPES ══ */
.land{stroke:var(--ivory3);stroke-width:1.5;stroke-linejoin:round}
.land-pt{fill:#EDE9E0}
.land-es{fill:#EDE9E0}
.land-fr{fill:#EDE9E0}
.land-it{fill:#EDE9E0}
.land-de{fill:#EDE9E0}
.land-cl{fill:#EDE9E0}
.land-ar{fill:#EDE9E0}
.land-br{fill:#EDE9E0}
.ocean{fill:#E8F0F5}
.country-label{
  font-family:var(--ff-b);font-size:8px;fill:#9C9490;
  text-anchor:middle;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
}

/* ══ REGION ZONES ══ */
.rzone{cursor:pointer;transition:all .25s}
.rzone circle{
  fill:rgba(122,31,38,.08);stroke:var(--vinho);stroke-width:1.4;
  transition:all .25s;
}
.rzone text{
  font-family:var(--ff-b);font-size:6.5px;fill:var(--vinho);
  text-anchor:middle;dominant-baseline:middle;
  font-weight:700;letter-spacing:.03em;pointer-events:none;
  transition:all .25s;
}
.rzone:hover circle{fill:rgba(122,31,38,.15);stroke-width:2}
.rzone.target circle{
  fill:rgba(122,31,38,.12);stroke:var(--ouro);stroke-width:2;
  animation:pulse-target 1.8s ease-in-out infinite;
}
.rzone.target text{fill:var(--ouro2)}
.rzone.correct circle{fill:rgba(30,107,58,.25);stroke:#1E6B3A;stroke-width:2.5;animation:none}
.rzone.correct text{fill:#1E6B3A}
.rzone.wrong circle{fill:rgba(122,31,38,.25);stroke:var(--vinho);stroke-width:2.5;animation:none}
.rzone.disabled{pointer-events:none}

.country-hi{transition:fill .3s}
.country-hi.active{fill:#E5DDD4}

@keyframes pulse-target{
  0%,100%{r:18;opacity:1}
  50%{r:21;opacity:.8}
}

/* ══ QUESTION CARD ══ */
.q-card{
  padding:12px 0 max(14px,env(safe-area-inset-bottom,0px));
  border-top:1px solid var(--border);
}
.q-instruction{
  font-size:.67rem;text-transform:uppercase;letter-spacing:.1em;color:var(--fg3);
  margin-bottom:3px;
}
.q-region{
  font-family:var(--ff-d);font-size:1.4rem;color:var(--vinho);font-weight:700;
  line-height:1.2;
}
.q-hint{
  font-size:.72rem;color:var(--fg3);margin-top:3px;
  display:flex;align-items:center;gap:6px;flex-wrap:wrap;
}
.q-hint-chip{
  background:var(--ivory2);border:1px solid var(--border);
  border-radius:20px;padding:2px 8px;font-size:.66rem;color:var(--fg2);font-weight:500;
}
.q-progress{
  margin-top:8px;height:3px;background:var(--ivory3);border-radius:2px;overflow:hidden;
}
.q-progress-bar{height:100%;background:var(--ouro);transition:width .4s ease;border-radius:2px}
.q-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}

/* ══ ROUND COUNTER ══ */
.round-badge{
  flex-shrink:0;background:var(--ivory2);border:1px solid var(--border);
  border-radius:10px;padding:4px 10px;text-align:center;
}
.round-num{font-size:1rem;font-weight:700;color:var(--vinho);font-family:var(--ff-d)}
.round-lbl{font-size:.6rem;text-transform:uppercase;letter-spacing:.08em;color:var(--fg3)}

/* ══ FEEDBACK TOAST ══ */
.toast{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(.8);
  background:var(--surface);border-radius:16px;padding:18px 28px;text-align:center;
  box-shadow:0 8px 32px var(--shadow-md);border:1.5px solid var(--border);
  opacity:0;pointer-events:none;z-index:20;transition:all .25s;
  min-width:220px;
}
.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1);pointer-events:auto}
.toast-icon{font-size:2.4rem;margin-bottom:6px}
.toast-title{font-family:var(--ff-d);font-size:1.1rem;font-weight:700;margin-bottom:4px}
.toast-title.ok{color:var(--correct)}
.toast-title.no{color:var(--vinho)}
.toast-fact{font-size:.73rem;color:var(--fg2);line-height:1.5;max-width:220px}
.toast-btn{
  margin-top:12px;background:var(--vinho);color:#fff;border:none;
  border-radius:20px;padding:8px 24px;font-family:var(--ff-b);font-size:.8rem;
  font-weight:600;cursor:pointer;letter-spacing:.04em;
}
.toast-btn:hover{background:var(--vinho2)}

/* ══ OVERLAY (start / end) ══ */
.overlay{
  position:absolute;inset:0;background:rgba(248,246,239,.96);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  z-index:30;gap:16px;padding:24px;text-align:center;
  backdrop-filter:blur(4px);
}
.overlay.hidden{display:none}
.ov-glass{margin-bottom:4px}
.ov-title{font-family:var(--ff-d);font-size:1.7rem;color:var(--vinho);font-weight:700;line-height:1.2}
.ov-sub{font-size:.82rem;color:var(--fg2);max-width:300px;line-height:1.6;margin-top:4px}
.ov-chips{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;max-width:320px}
.ov-chip{
  background:var(--ivory2);border:1px solid var(--border);
  border-radius:20px;padding:4px 12px;font-size:.7rem;color:var(--fg2);
}
.ov-btn{
  background:var(--vinho);color:#fff;border:none;border-radius:24px;
  padding:13px 36px;font-family:var(--ff-b);font-size:.9rem;font-weight:700;
  cursor:pointer;letter-spacing:.06em;box-shadow:0 4px 12px rgba(122,31,38,.3);
  transition:all .2s;margin-top:4px;
}
.ov-btn:hover{background:var(--vinho2);transform:translateY(-1px)}
.ov-stat{text-align:center}
.ov-stat-num{font-family:var(--ff-d);font-size:2.2rem;font-weight:700;color:var(--vinho)}
.ov-stat-lbl{font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;color:var(--fg3)}
.ov-stats-row{display:flex;gap:28px;justify-content:center}
.ov-result-title{font-family:var(--ff-d);font-size:1.1rem;color:var(--ouro2);font-weight:700}
</style>
</head>
<body>
<div class="shell">

  <!-- HEADER -->
  <header class="header">
    <div class="brand-mark">
      <svg viewBox="0 0 200 248" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <clipPath id="hbC"><path d="M58,36 C50,92 60,132 66,144 Q80,168 100,176 Q120,168 134,144 C140,132 150,92 142,36 Z"/></clipPath>
        </defs>
        <g clip-path="url(#hbC)" stroke="#F8F6EF" fill="none" stroke-width="10" opacity=".7">
          <path d="M54,82 Q100,77 146,82"/><path d="M52,96 Q100,91 148,96"/>
          <path d="M50,110 Q100,105 150,110"/><path d="M50,124 Q100,119 150,124"/>
        </g>
        <g transform="translate(100,58)" stroke="#F8F6EF" stroke-linecap="round">
          <line x1="0" y1="-7" x2="0" y2="7" stroke-width="10"/><line x1="-7" y1="0" x2="7" y2="0" stroke-width="10"/>
          <line x1="-5" y1="-5" x2="5" y2="5" stroke-width="9"/><line x1="5" y1="-5" x2="-5" y2="5" stroke-width="9"/>
          <circle r="22" fill="#F8F6EF" stroke="none" opacity=".25"/>
        </g>
        <path d="M58,36 C50,92 60,132 66,144 Q80,168 100,176 Q120,168 134,144 C140,132 150,92 142,36" stroke="#F8F6EF" stroke-width="12" fill="none" stroke-linecap="round"/>
        <path d="M58,36 Q100,30 142,36" stroke="#F8F6EF" stroke-width="12" fill="none"/>
        <path d="M100,176 L98,200 L102,200" stroke="#F8F6EF" stroke-width="11" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M74,222 Q100,228 126,222" stroke="#F8F6EF" stroke-width="11" fill="none" stroke-linecap="round"/>
      </svg>
    </div>
    <div>
      <div class="game-title">VinoBianco</div>
      <div class="game-sub">Modo C · Regiões</div>
    </div>
    <div class="spacer"></div>
    <div class="xp-pill" id="xpDisplay">0 XP</div>
    <div class="lives" id="livesDisplay"></div>
  </header>

  <!-- TABS -->
  <div class="tabs">
    <button class="tab active" id="tabEuropa" onclick="switchContinent('europa')">
      <span class="continent-flag">🌍</span>Europa
    </button>
    <button class="tab" id="tabSA" onclick="switchContinent('sa')">
      <span class="continent-flag">🌎</span>América do Sul
    </button>
  </div>

  <!-- MAP WRAP -->
  <div class="map-wrap" id="mapWrap">

    <!-- TAÇA LOGO VINOBIANCO — marca d'água -->
    <div class="glass-watermark" aria-hidden="true">
      <svg viewBox="0 0 200 248" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <clipPath id="wmBowlClip">
            <path d="M58,36 C50,92 60,132 66,144 Q80,168 100,176 Q120,168 134,144 C140,132 150,92 142,36 Z"/>
          </clipPath>
          <clipPath id="wmWineClip">
            <rect id="wmWineRect" x="0" y="96" width="200" height="80"/>
          </clipPath>
        </defs>
        <!-- Preenchimento de vinho (40% cheio) -->
        <path d="M58,36 C50,92 60,132 66,144 Q80,168 100,176 Q120,168 134,144 C140,132 150,92 142,36 Z"
              fill="#7A1F26" clip-path="url(#wmWineClip)" opacity=".55"/>
        <!-- Linhas de vinhedo (8 arcos + linhas de fuga) -->
        <g clip-path="url(#wmBowlClip)" stroke="#7A1F26" fill="none" stroke-width="1.1" opacity=".85">
          <path d="M54,82 Q100,77 146,82"/>
          <path d="M52,96 Q100,91 148,96"/>
          <path d="M50,110 Q100,105 150,110"/>
          <path d="M50,124 Q100,119 150,124"/>
          <path d="M50,138 Q100,133 150,138"/>
          <path d="M52,152 Q100,147 148,152"/>
          <path d="M54,166 Q100,161 146,166"/>
          <line x1="100" y1="172" x2="50" y2="78"  stroke-width=".7" opacity=".4"/>
          <line x1="100" y1="172" x2="150" y2="78" stroke-width=".7" opacity=".4"/>
          <line x1="100" y1="172" x2="72"  y2="74" stroke-width=".5" opacity=".3"/>
          <line x1="100" y1="172" x2="128" y2="74" stroke-width=".5" opacity=".3"/>
        </g>
        <!-- Ciprestes (dois triângulos clippados na taça) -->
        <g clip-path="url(#wmBowlClip)" fill="#7A1F26" opacity=".85">
          <path d="M76,105 L68,152 Q72,160 76,161 Q80,160 84,152 Z"/>
          <path d="M124,105 L116,152 Q120,160 124,161 Q128,160 132,152 Z"/>
        </g>
        <!-- Estrela de 8 pontas (asterisco) no topo da taça -->
        <g transform="translate(100,56)" fill="none" stroke="#7A1F26" stroke-linecap="round">
          <line x1="0"    y1="-10" x2="0"    y2="10"  stroke-width="1.5"/>
          <line x1="-10"  y1="0"   x2="10"   y2="0"   stroke-width="1.5"/>
          <line x1="-7.1" y1="-7.1" x2="7.1" y2="7.1" stroke-width="1.3"/>
          <line x1="7.1"  y1="-7.1" x2="-7.1" y2="7.1" stroke-width="1.3"/>
          <circle r="3" fill="#7A1F26" stroke="none"/>
        </g>
        <!-- Contorno da taça (bowl) -->
        <path d="M58,36 C50,92 60,132 66,144 Q80,168 100,176 Q120,168 134,144 C140,132 150,92 142,36"
              stroke="#7A1F26" stroke-width="1.8" fill="none" stroke-linecap="round"/>
        <!-- Boca da taça -->
        <path d="M58,36 Q100,30 142,36" stroke="#7A1F26" stroke-width="1.8" fill="none"/>
        <!-- Haste -->
        <path d="M100,176 L98,200 L102,200"
              stroke="#7A1F26" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <!-- Base -->
        <path d="M74,222 Q100,228 126,222"
              stroke="#7A1F26" stroke-width="1.6" fill="none" stroke-linecap="round"/>
        <!-- Pequeno pé da haste -->
        <path d="M98,200 Q99,212 100,222 Q101,212 102,200"
              stroke="#7A1F26" stroke-width="1.4" fill="none" stroke-linecap="round"/>
      </svg>
    </div>

    <!-- EUROPA SVG -->
    <svg id="mapEuropa" class="map-svg" viewBox="0 0 400 340" xmlns="http://www.w3.org/2000/svg">
      <!-- Ocean -->
      <rect width="400" height="340" fill="#E8F0F5"/>
      <!-- Portugal -->
      <polygon id="land-pt" class="land land-pt country-hi"
        points="38,253 68,250 72,264 70,298 58,330 38,335 25,318 24,280"/>
      <!-- Spain -->
      <polygon id="land-es" class="land land-es country-hi"
        points="38,253 68,250 78,215 110,196 160,188 210,190 235,210 240,250 228,290 195,310 150,318 100,316 70,298 72,264"/>
      <!-- France -->
      <polygon id="land-fr" class="land land-fr country-hi"
        points="88,68 155,48 240,58 285,92 276,160 235,192 200,195 170,198 128,192 100,170 80,140 76,100"/>
      <!-- Italy (boot) -->
      <path id="land-it" class="land land-it country-hi"
        d="M248,112 L288,118 L310,138 L324,172 L318,215 L306,250 L316,282 L298,308 L282,295 L285,268 L270,242 L258,210 L252,170 L252,140 Z"/>
      <!-- Germany/Austria rough -->
      <polygon id="land-de" class="land land-de"
        points="155,48 240,58 265,72 285,92 250,112 220,102 185,94 155,88 140,68"/>

      <!-- Country labels -->
      <text class="country-label" x="52" y="295">PORT.</text>
      <text class="country-label" x="155" y="262">ESPANHA</text>
      <text class="country-label" x="185" y="130">FRANÇA</text>
      <text class="country-label" x="285" y="190">ITÁLIA</text>

      <!-- REGION ZONES — Europa -->
      <!-- Bordeaux: SW France -->
      <g class="rzone" data-id="bordeaux" data-cont="europa" onclick="clickRegion('bordeaux')">
        <circle cx="134" cy="178" r="18"/>
        <text x="134" y="175">BOR</text><text x="134" y="183">DEAUX</text>
      </g>
      <!-- Borgonha: E France -->
      <g class="rzone" data-id="borgonha" data-cont="europa" onclick="clickRegion('borgonha')">
        <circle cx="210" cy="130" r="18"/>
        <text x="210" y="127">BOR</text><text x="210" y="135">GONHA</text>
      </g>
      <!-- Champagne: NE France -->
      <g class="rzone" data-id="champagne" data-cont="europa" onclick="clickRegion('champagne')">
        <circle cx="202" cy="84" r="18"/>
        <text x="202" y="81">CHAM</text><text x="202" y="89">PAGNE</text>
      </g>
      <!-- Rhône: SE France -->
      <g class="rzone" data-id="rhone" data-cont="europa" onclick="clickRegion('rhone')">

        <text x="224" y="167">RHÔNE</text>
      </g>
      <!-- Alsácia: E France border -->
      <g class="rzone" data-id="alsacia" data-cont="europa" onclick="clickRegion('alsacia')">
        <circle cx="258" cy="96" r="18"/>
        <text x="258" y="93">AL</text><text x="258" y="101">SÁCIA</text>
      </g>
      <!-- Toscana: central Italy -->
      <g class="rzone" data-id="toscana" data-cont="europa" onclick="clickRegion('toscana')">
        <circle cx="290" cy="210" r="18"/>
        <text x="290" y="207">TOS</text><text x="290" y="215">CANA</text>
      </g>
      <!-- Piemonte: NW Italy -->
      <g class="rzone" data-id="piemonte" data-cont="europa" onclick="clickRegion('piemonte')">
        <circle cx="258" cy="152" r="18"/>
        <text x="258" y="149">PIE</text><text x="258" y="157">MONTE</text>
      </g>
      <!-- Rioja: N Spain -->
      <g class="rzone" data-id="rioja" data-cont="europa" onclick="clickRegion('rioja')">
        <circle cx="132" cy="224" r="18"/>
        <text x="132" y="221">RIO</text><text x="132" y="229">JA</text>
      </g>
      <!-- Douro: N Portugal -->
      <g class="rzone" data-id="douro" data-cont="europa" onclick="clickRegion('douro')">
        <circle cx="58" cy="266" r="18"/>
        <text x="58" y="263">DOU</text><text x="58" y="271">RO</text>
      </g>
      <!-- Vinho Verde: NW Portugal -->
      <g class="rzone" data-id="vinho-verde" data-cont="europa" onclick="clickRegion('vinho-verde')">
        <circle cx="44" cy="246" r="18"/>
        <text x="44" y="243">VINHO</text><text x="44" y="251">VERDE</text>
      </g>
    </svg>

    <!-- SOUTH AMERICA SVG -->
    <svg id="mapSA" class="map-svg hidden" viewBox="0 0 400 380" xmlns="http://www.w3.org/2000/svg">
      <!-- Ocean -->
      <rect width="400" height="380" fill="#E8F0F5"/>
      <!-- Brazil (simplified blob) -->
      <path id="land-br" class="land land-br country-hi"
        d="M 155,28 L 230,22 L 310,38 L 360,72 L 375,118 L 370,165 L 342,195 L 308,210 L 280,225 L 262,255 L 248,262 L 230,248 L 202,240 L 185,228 L 172,205 L 148,185 L 138,162 L 132,132 L 140,95 L 148,58 Z"/>
      <!-- Argentina (long, tapered S) -->
      <path id="land-ar" class="land land-ar country-hi"
        d="M 110,175 L 148,162 L 185,165 L 202,185 L 202,210 L 195,238 L 182,260 L 172,298 L 162,328 L 148,352 L 128,362 L 115,352 L 112,325 L 118,295 L 120,262 L 115,235 L 108,210 L 105,188 Z"/>
      <!-- Chile (coastal strip) -->

<!-- FEEDBACK TOAST -->

<script>
/* ═══════════════════════════════════════════════
   DADOS — 15 regiões vinícolas
═══════════════════════════════════════════════ */
const REGIOES = [
  {

  },{
    id:'toscana', nome:'Toscana', pais:'Itália', continente:'europa',
    castas:'Sangiovese · Cabernet Sauvignon',
    fato:'Lar do Chianti Classico e Brunello di Montalcino. O "Super Toscano" revolucionou a enologia italiana nos anos 1970.',
    dicas:['Centro da Itália','Sangiovese','Chianti & Brunello']
  },{
    id:'piemonte', nome:'Piemonte', pais:'Itália', continente:'europa',
    castas:'Nebbiolo · Barbera · Dolcetto',
    fato:'Nebbiolo produz os "vinhos dos reis": Barolo e Barbaresco. Alta acidez, taninos firmes e longa guarda.',

  },{

    fato:'Classificação única: Crianza (2 anos), Reserva (3 anos) e Gran Reserva (5 anos) regulam o envelhecimento.',
    dicas:['Norte da Espanha','Rio Ebro','Tempranillo · envelhecimento em carvalho']
  },{
    id:'douro', nome:'Vale do Douro', pais:'Portugal', continente:'europa',
    castas:'Touriga Nacional · Tinta Roriz · Touriga Franca',
    fato:'Produz o Vinho do Porto e vinhos tintos de mesa de alto padrão. Xisto e topografia em terraços são marcas do terroir.',
    dicas:['Norte de Portugal','Rio Douro','Vinho do Porto & tintos de guarda']
  },{
    id:'vinho-verde', nome:'Vinho Verde', pais:'Portugal', continente:'europa',
    castas:'Alvarinho · Loureiro · Arinto',
    fato:'Clima atlântico húmido gera vinhos leves, frescos e com acidez vibrante. Alvarinho de Monção e Melgaço são referência mundial.',

  },{

    fato:'A 800–1.000 m de altitude, a amplitude térmica entre dia e noite preserva aromas e acidez. Capital mundial do Malbec.',

  },{
    id:'salta', nome:'Salta', pais:'Argentina', continente:'sa',
    castas:'Malbec · Torrontés · Cabernet Sauvignon',
    fato:'Vinhedos a 1.700–3.300 m de altitude — entre os mais altos do mundo. Sol intenso e noites frias dão estrutura única.',
    dicas:['NW da Argentina','Valles Calchaquíes','Altitude até 3.300 m']
  },{
    id:'maipo', nome:'Vale do Maipo', pais:'Chile', continente:'sa',
    castas:'Cabernet Sauvignon · Carmenère · Merlot',
    fato:'Próximo a Santiago, é o "Bordeaux Chileno". Drenagem dos Andes e clima mediterrâneo produzem Cabernet de alta qualidade.',
    dicas:['Central Chile, próximo a Santiago','Cabernet Sauvignon','Bordeaux chileno']
  },{
    id:'casablanca', nome:'Vale de Casablanca', pais:'Chile', continente:'sa',
    castas:'Sauvignon Blanc · Chardonnay · Pinot Noir',
    fato:'Influência direta do Oceano Pacífico e da Corrente de Humboldt. Clima fresco e neblina matinal preservam acidez e aromas frutados.',
    dicas:['Costeiro Chile, ao norte de Valparaíso','Influência do Oceano Pacífico','Brancos frescos']
  },{
    id:'serra-gaucha', nome:'Serra Gaúcha', pais:'Brasil', continente:'sa',
    castas:'Moscato Giallo · Chardonnay · Merlot',
    fato:'Colonizada por imigrantes italianos. Caxias do Sul e Bento Gonçalves são polo do espumante nacional brasileiro.',
    dicas:['Sul do Brasil','Descendentes de imigrantes italianos','Espumantes e Moscato']
  }
];

/* ═══════════════════════════════════════════════
   ESTADO DO JOGO
═══════════════════════════════════════════════ */
const ROUNDS_TOTAL = 10;
const MAX_LIVES = 3;
let state = {
  lives:MAX_LIVES, xp:0, round:0, correct:0,
  queue:[], current:null, answered:false, score:0
};

function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}

/* ═══════════════════════════════════════════════
   INIT
═══════════════════════════════════════════════ */
window.addEventListener('DOMContentLoaded',()=>{
  buildLives();
  updateXP();
  // fill start chips
  const chips = document.getElementById('startChips');
  ['10 regiões','3 continentes','3 vidas','Mapa interativo'].forEach(t=>{
    const c=document.createElement('span');c.className='ov-chip';c.textContent=t;chips.appendChild(c);
  });
});

/* ═══════════════════════════════════════════════
   LIVES SVG
═══════════════════════════════════════════════ */
function buildLives(){
  const el=document.getElementById('livesDisplay');
  el.innerHTML='';
  for(let i=0;i<MAX_LIVES;i++){
    const alive=i<state.lives;
    const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
    svg.setAttribute('viewBox','0 0 200 248');
    svg.classList.add('life-svg');
    if(!alive)svg.classList.add('lost');
    const col=alive?'#7A1F26':'#C0BAB0';
    svg.innerHTML=`
      ${alive?`<path d="M58,36 C50,92 60,132 66,144 Q80,168 100,176 Q120,168 134,144 C140,132 150,92 142,36 Z" fill="rgba(122,31,38,.2)"/>`:''}
      <path d="M58,36 C50,92 60,132 66,144 Q80,168 100,176 Q120,168 134,144 C140,132 150,92 142,36" stroke="${col}" stroke-width="14" fill="none" stroke-linecap="round"/>
      <path d="M58,36 Q100,30 142,36" stroke="${col}" stroke-width="14" fill="none"/>
      <path d="M100,176 L98,200 L102,200" stroke="${col}" stroke-width="13" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M74,222 Q100,228 126,222" stroke="${col}" stroke-width="12" fill="none" stroke-linecap="round"/>`;
    el.appendChild(svg);
  }
}

function updateXP(){
  document.getElementById('xpDisplay').textContent=state.xp+' XP';
}

/* ═══════════════════════════════════════════════
   CONTINENT SWITCH
═══════════════════════════════════════════════ */
function switchContinent(c){
  document.getElementById('mapEuropa').classList.toggle('hidden',c!=='europa');
  document.getElementById('mapSA').classList.toggle('hidden',c!=='sa');
  document.getElementById('tabEuropa').classList.toggle('active',c==='europa');
  document.getElementById('tabSA').classList.toggle('active',c==='sa');
}

/* ═══════════════════════════════════════════════
   GAME FLOW
═══════════════════════════════════════════════ */
function startGame(){
  document.getElementById('startOverlay').classList.add('hidden');
  state.lives=MAX_LIVES; state.xp=0; state.round=0;
  state.correct=0; state.score=0; state.answered=false;
  state.queue=shuffle(REGIOES).slice(0,ROUNDS_TOTAL);
  buildLives(); updateXP();
  clearAllZones();
  nextRound();
}

function restartGame(){
  document.getElementById('endOverlay').classList.add('hidden');
  startGame();
}

function nextRound(){
  hideToast();
  clearAllZones();
  if(state.round>=ROUNDS_TOTAL||state.lives<=0){endGame();return;}
  state.answered=false;
  state.current=state.queue[state.round];
  state.round++;

  // show correct continent
  switchContinent(state.current.continente);

  // update question card
  document.getElementById('qRegion').textContent=state.current.nome;
  document.getElementById('roundNum').textContent=state.round;
  document.getElementById('qBar').style.width=((state.round-1)/ROUNDS_TOTAL*100)+'%';

  // hints chips
  const hintEl=document.getElementById('qHint');
  hintEl.innerHTML='';
  const chips=[state.current.pais,...state.current.dicas.slice(0,2)];
  chips.forEach(t=>{
    const c=document.createElement('span');c.className='q-hint-chip';c.textContent=t;hintEl.appendChild(c);
  });

  // highlight country
  highlightCountry(state.current.pais, true);

  // pulse target zone
  const gz=document.querySelector(`.rzone[data-id="${state.current.id}"]`);
  if(gz){gz.classList.add('target');}
  // but keep it subtle — don't give it away, remove target class
  // Actually keep pulsing to guide them — educational mode
}

function highlightCountry(pais, on){
  const map={'França':['land-fr'],'Espanha':['land-es'],'Itália':['land-it'],
    'Portugal':['land-pt'],'Argentina':['land-ar'],'Chile':['land-cl'],'Brasil':['land-br']};
  const ids=map[pais]||[];
  ids.forEach(id=>{
    const el=document.getElementById(id);
    if(el){el.classList.toggle('active',on);}
  });
}

function clearAllZones(){
  document.querySelectorAll('.rzone').forEach(z=>{
    z.classList.remove('target','correct','wrong','disabled');
  });
  // clear country highlights
  document.querySelectorAll('.country-hi').forEach(e=>e.classList.remove('active'));
}

/* ═══════════════════════════════════════════════
   CLICK HANDLER
═══════════════════════════════════════════════ */
function clickRegion(id){
  if(state.answered)return;
  if(!state.current)return;
  state.answered=true;

  const correct=(id===state.current.id);
  const gz=document.querySelector(`.rzone[data-id="${id}"]`);
  const correctGz=document.querySelector(`.rzone[data-id="${state.current.id}"]`);

  // disable all zones
  document.querySelectorAll('.rzone').forEach(z=>z.classList.add('disabled'));

  if(correct){
    gz.classList.remove('target');
    gz.classList.add('correct');
    state.correct++;
    state.score+=100;
    state.xp+=15;
    showToast(true, state.current);
  } else {
    gz.classList.add('wrong');
    if(correctGz){correctGz.classList.remove('target');correctGz.classList.add('correct');}
    state.lives--;
    buildLives();
    showToast(false, state.current);
  }
  updateXP();
  document.getElementById('qBar').style.width=(state.round/ROUNDS_TOTAL*100)+'%';
}

/* ═══════════════════════════════════════════════
   TOAST
═══════════════════════════════════════════════ */
function showToast(ok, regiao){
  document.getElementById('toastIcon').textContent=ok?'🍷':'🗺️';
  const titleEl=document.getElementById('toastTitle');
  titleEl.textContent=ok?'Região encontrada!':'Que pena…';
  titleEl.className='toast-title '+(ok?'ok':'no');
  document.getElementById('toastFact').textContent=
    (ok?'':'A região correta era '+regiao.nome+'. ')+regiao.fato;
  const toast=document.getElementById('toast');
  toast.classList.add('show');

  if(state.lives<=0||state.round>=ROUNDS_TOTAL){
    document.getElementById('toastBtn').textContent=
      state.lives<=0?'Ver resultado →':'Finalizar →';
  } else {
    document.getElementById('toastBtn').textContent='Próxima →';
  }
}

function hideToast(){
  document.getElementById('toast').classList.remove('show');
}

/* ═══════════════════════════════════════════════
   END GAME
═══════════════════════════════════════════════ */
function endGame(){
  hideToast();
  const pct=state.correct/ROUNDS_TOTAL;
  let emoji='🍷',title='',msg='';
  if(pct>=0.9){emoji='🏆';title='Sommelier Experiente!';msg='Conhecimento geográfico impecável. Você domina o mapa do vinho mundial!';}
  else if(pct>=0.7){emoji='🥇';title='Muito bem!';msg='Você conhece bem as regiões. Continue explorando o mapa para chegar à perfeição.';}
  else if(pct>=0.5){emoji='📍';title='Bom começo!';msg='Você acertou mais da metade. Estude os países e as castas de cada região.';}
  else{emoji='🌏';title='Continue praticando!';msg='Cada região tem uma história. Explore as dicas e tente novamente!';}
  document.getElementById('endEmoji').textContent=emoji;
  document.getElementById('endTitle').textContent=title;
  document.getElementById('endScore').textContent=state.score;
  document.getElementById('endCorrect').textContent=state.correct+'/'+ROUNDS_TOTAL;
  document.getElementById('endXP').textContent='+'+state.xp;
  document.getElementById('endMsg').textContent=msg;
  document.getElementById('endOverlay').classList.remove('hidden');
}
</script>
