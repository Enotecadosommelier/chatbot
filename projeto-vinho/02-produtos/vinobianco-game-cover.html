<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>VinoBianco Wine Master — Capa</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,900;1,400;1,700&family=Montserrat:wght@200;300;400;500;600;700&display=swap');

*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden}

body{
  font-family:'Montserrat',sans-serif;
  background:#0D0608;
  display:flex;align-items:center;justify-content:center;
  min-height:100vh;
}

/* ── CAPA ── */
.cover{
  width:100vw;height:100vh;
  position:relative;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  overflow:hidden;
}

/* FUNDO — vinhedo noturno em gradiente */
.bg-gradient{
  position:absolute;inset:0;
  background:
    radial-gradient(ellipse 80% 60% at 50% 0%, rgba(122,31,38,.55) 0%, transparent 70%),
    radial-gradient(ellipse 60% 40% at 50% 100%, rgba(80,15,20,.8) 0%, transparent 65%),
    radial-gradient(ellipse 100% 80% at 50% 50%, rgba(18,5,7,1) 30%, #0D0608 100%);
}

/* Partículas douradas flutuantes */
.particles{position:absolute;inset:0;pointer-events:none}
.particle{
  position:absolute;border-radius:50%;
  background:radial-gradient(circle,rgba(212,175,55,.9),rgba(212,175,55,0));
  animation:float linear infinite;
}

/* Linhas decorativas laterais */
.deco-line{
  position:absolute;top:0;bottom:0;width:1px;
  background:linear-gradient(to bottom,transparent,rgba(212,175,55,.25) 30%,rgba(212,175,55,.25) 70%,transparent);
}
.deco-line.left{left:clamp(30px,8vw,100px)}
.deco-line.right{right:clamp(30px,8vw,100px)}
.deco-line::after{
  content:'◆';position:absolute;left:50%;transform:translateX(-50%);top:50%;
  color:rgba(212,175,55,.4);font-size:.5rem;margin-top:-.5rem;
}

/* Ornamento superior */
.top-ornament{
  position:absolute;top:clamp(20px,5vh,50px);
  display:flex;align-items:center;gap:12px;
  opacity:.6;
}
.ornament-line{width:clamp(40px,8vw,80px);height:1px;background:rgba(212,175,55,.5)}
.ornament-text{font-size:.6rem;letter-spacing:.25em;color:rgba(212,175,55,.7);font-weight:500}

/* Logo container */
.logo-wrap{
  position:relative;z-index:10;
  display:flex;flex-direction:column;align-items:center;
  gap:0;
}

/* TAÇA SVG */
.glass-wrap{
  position:relative;
  margin-bottom:clamp(12px,3vh,28px);
  filter:drop-shadow(0 0 40px rgba(212,175,55,.18)) drop-shadow(0 0 80px rgba(122,31,38,.25));
}
.glass-svg{
  width:clamp(90px,18vw,160px);
  height:auto;
}

/* Halo brilhante atrás da taça */
.glass-halo{
  position:absolute;inset:-40%;
  border-radius:50%;
  background:radial-gradient(circle,rgba(212,175,55,.07) 0%,transparent 65%);
  animation:pulse 4s ease-in-out infinite;
}

/* Nome principal */
.brand-name{
  font-family:'Playfair Display',Georgia,serif;
  font-size:clamp(2.8rem,10vw,7.5rem);
  font-weight:700;
  line-height:.95;
  letter-spacing:-.02em;
  text-align:center;
  margin-bottom:clamp(4px,1vh,12px);
}
.brand-vino{
  color:#F8F6EF;
  display:block;
}
.brand-bianco{
  color:#7A1F26;
  display:block;
  font-style:italic;
}

/* Linha dourada */
.gold-rule{
  width:clamp(160px,40vw,320px);
  height:1px;
  background:linear-gradient(to right,transparent,#D4AF37,transparent);
  margin:clamp(8px,2vh,18px) 0;
}

/* Sub-título WINE MASTER */
.game-title{
  font-family:'Playfair Display',serif;
  font-size:clamp(.7rem,2.2vw,1.3rem);
  font-weight:400;
  letter-spacing:clamp(.2em,.5vw,.5em);
  color:#D4AF37;
  text-transform:uppercase;
  text-align:center;
  margin-bottom:clamp(6px,1.5vh,16px);
}

/* Tag "O JOGO" */
.game-tag{
  font-size:clamp(.55rem,1.2vw,.7rem);
  letter-spacing:.3em;
  color:rgba(248,246,239,.35);
  font-weight:500;
  text-transform:uppercase;
  text-align:center;
}

/* CTA / botão play */
.play-btn{
  margin-top:clamp(28px,6vh,56px);
  position:relative;z-index:10;
  background:none;
  border:1px solid rgba(212,175,55,.5);
  color:#D4AF37;
  font-family:'Montserrat',sans-serif;
  font-size:clamp(.7rem,1.5vw,.85rem);
  font-weight:600;
  letter-spacing:.2em;
  padding:clamp(.7rem,2vh,1rem) clamp(2rem,5vw,3.5rem);
  border-radius:2px;
  cursor:pointer;
  text-transform:uppercase;
  transition:all .4s ease;
  overflow:hidden;
}
.play-btn::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(212,175,55,.12),rgba(122,31,38,.12));
  transform:scaleX(0);transform-origin:left;
  transition:transform .4s ease;
}
.play-btn:hover{
  border-color:rgba(212,175,55,.9);
  box-shadow:0 0 30px rgba(212,175,55,.15),inset 0 0 20px rgba(212,175,55,.05);
  letter-spacing:.25em;
}
.play-btn:hover::before{transform:scaleX(1)}

/* Rodapé */
.bottom-bar{
  position:absolute;bottom:clamp(16px,4vh,36px);
  display:flex;align-items:center;gap:clamp(16px,4vw,40px);
  opacity:.4;
}
.bottom-item{
  font-size:clamp(.55rem,1vw,.65rem);
  letter-spacing:.18em;
  color:#F8F6EF;
  font-weight:300;
  text-transform:uppercase;
}
.bottom-dot{width:3px;height:3px;border-radius:50%;background:#D4AF37}

/* Versão mobile — estreitamento lateral */
.side-ornament{
  position:absolute;
  font-size:clamp(4rem,12vw,11rem);
  opacity:.025;
  font-family:'Playfair Display',serif;
  color:#F8F6EF;
  user-select:none;pointer-events:none;
  writing-mode:vertical-rl;
  letter-spacing:.15em;
}
.side-ornament.l{left:clamp(10px,3vw,50px);top:50%;transform:translateY(-50%)}
.side-ornament.r{right:clamp(10px,3vw,50px);top:50%;transform:translateY(-50%) rotate(180deg)}

/* ── ANIMAÇÕES ── */
@keyframes float{
  0%{transform:translateY(0) scale(1);opacity:0}
  10%{opacity:1}
  90%{opacity:.6}
  100%{transform:translateY(-100vh) scale(.3);opacity:0}
}
@keyframes pulse{
  0%,100%{transform:scale(1);opacity:.5}
  50%{transform:scale(1.1);opacity:1}
}
@keyframes fadeUp{
  from{opacity:0;transform:translateY(24px)}
  to{opacity:1;transform:translateY(0)}
}
@keyframes shimmer{
  0%,100%{opacity:.7}50%{opacity:1}
}

/* Entrada sequencial */
.logo-wrap,.play-btn{animation:fadeUp .9s ease both}
.glass-wrap{animation:fadeUp .9s .1s ease both}
.brand-name{animation:fadeUp .9s .2s ease both}
.gold-rule{animation:fadeUp .9s .35s ease both}
.game-title{animation:fadeUp .9s .45s ease both}
.play-btn{animation:fadeUp .9s .7s ease both}

/* Shimmer na linha dourada */
.gold-rule{animation:fadeUp .9s .35s ease both, shimmer 3s 1.5s ease-in-out infinite}
</style>
</head>
<body>
<div class="cover">

  <!-- Fundo -->
  <div class="bg-gradient"></div>

  <!-- Partículas douradas (geradas por JS) -->
  <div class="particles" id="particles"></div>

  <!-- Linhas laterais decorativas -->
  <div class="deco-line left"></div>
  <div class="deco-line right"></div>

  <!-- Texto fantasma lateral -->
  <div class="side-ornament l">VINHO</div>
  <div class="side-ornament r">VINHO</div>

  <!-- Ornamento superior -->
  <div class="top-ornament">
    <div class="ornament-line"></div>
    <div class="ornament-text">VinoBianco · Seleção Especial</div>
    <div class="ornament-line"></div>
  </div>

  <!-- LOGO PRINCIPAL -->
  <div class="logo-wrap">

    <!-- Taça SVG — fiel ao logo original -->
    <div class="glass-wrap">
      <div class="glass-halo"></div>
      <svg class="glass-svg" viewBox="0 0 200 240" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- Caule e base da taça -->
        <path d="M100 170 L100 215" stroke="#7A1F26" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M72 215 L128 215" stroke="#7A1F26" stroke-width="2.5" stroke-linecap="round"/>
        <!-- Corpo da taça -->
        <path d="M55 40 Q48 95 62 130 Q76 158 100 170 Q124 158 138 130 Q152 95 145 40 Z"
              fill="rgba(122,31,38,.08)" stroke="#7A1F26" stroke-width="2.2" stroke-linejoin="round"/>
        <!-- Vinhedos dentro da taça -->
        <g opacity=".85">
          <!-- Colinas -->
          <path d="M65 145 Q80 130 100 128 Q120 130 135 145" stroke="#7A1F26" stroke-width="1.5" fill="none"/>
          <path d="M68 155 Q85 138 100 136 Q115 138 132 155" stroke="#7A1F26" stroke-width="1.2" fill="none" opacity=".6"/>
          <!-- Linhas de vinhedo (fileiras) -->
          <line x1="75" y1="148" x2="75" y2="162" stroke="#7A1F26" stroke-width="1" opacity=".5"/>
          <line x1="82" y1="143" x2="82" y2="160" stroke="#7A1F26" stroke-width="1" opacity=".5"/>
          <line x1="89" y1="140" x2="89" y2="158" stroke="#7A1F26" stroke-width="1" opacity=".5"/>
          <line x1="96" y1="138" x2="96" y2="157" stroke="#7A1F26" stroke-width="1" opacity=".5"/>
          <line x1="103" y1="138" x2="103" y2="157" stroke="#7A1F26" stroke-width="1" opacity=".5"/>
          <line x1="110" y1="140" x2="110" y2="158" stroke="#7A1F26" stroke-width="1" opacity=".5"/>
          <line x1="117" y1="143" x2="117" y2="160" stroke="#7A1F26" stroke-width="1" opacity=".5"/>
          <line x1="124" y1="148" x2="124" y2="162" stroke="#7A1F26" stroke-width="1" opacity=".5"/>
          <!-- Ciprestes -->
          <line x1="85" y1="128" x2="85" y2="115" stroke="#7A1F26" stroke-width="2" opacity=".7"/>
          <ellipse cx="85" cy="112" rx="4" ry="7" fill="#7A1F26" opacity=".6"/>
          <line x1="95" y1="126" x2="95" y2="110" stroke="#7A1F26" stroke-width="2" opacity=".7"/>
          <ellipse cx="95" cy="107" rx="4" ry="8" fill="#7A1F26" opacity=".6"/>
          <line x1="105" y1="126" x2="105" y2="110" stroke="#7A1F26" stroke-width="2" opacity=".7"/>
          <ellipse cx="105" cy="107" rx="4" ry="8" fill="#7A1F26" opacity=".6"/>
          <line x1="115" y1="128" x2="115" y2="115" stroke="#7A1F26" stroke-width="2" opacity=".7"/>
          <ellipse cx="115" cy="112" rx="4" ry="7" fill="#7A1F26" opacity=".6"/>
        </g>
        <!-- Estrela/floco no topo interno -->
        <g transform="translate(100, 70)" opacity=".9">
          <!-- Estrela de 8 pontas -->
          <path d="M0,-14 L2,-4 L10,-8 L4,-1 L14,0 L4,1 L10,8 L2,4 L0,14 L-2,4 L-10,8 L-4,1 L-14,0 L-4,-1 L-10,-8 L-2,-4 Z"
                fill="#D4AF37" opacity=".85"/>
          <!-- Círculo central -->
          <circle r="3.5" fill="#D4AF37"/>
        </g>
        <!-- Brilho na borda da taça -->
        <path d="M57 42 Q51 90 64 125" stroke="rgba(212,175,55,.2)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      </svg>
    </div>

    <!-- Nome da marca -->
    <div class="brand-name">
      <span class="brand-vino">Vino</span>
      <span class="brand-bianco">Bianco</span>
    </div>

    <!-- Linha dourada -->
    <div class="gold-rule"></div>

    <!-- Subtítulo do jogo -->
    <div class="game-title">Wine Master</div>
    <div class="game-tag">O Jogo · Edição Especial</div>

  </div><!-- /logo-wrap -->

  <!-- Botão Play -->
  <button class="play-btn" onclick="document.querySelector('.play-btn').style.opacity='.5'">
    ▶ &nbsp; Iniciar Jogo
  </button>

  <!-- Rodapé -->
  <div class="bottom-bar">
    <span class="bottom-item">VinoBianco Store</span>
    <div class="bottom-dot"></div>
    <span class="bottom-item">Grandes Vinhos</span>
    <div class="bottom-dot"></div>
    <span class="bottom-item">Experiências Únicas</span>
  </div>

</div><!-- /cover -->

<script>
// Partículas douradas flutuantes
(function(){
  const container = document.getElementById('particles');
  const count = 28;
  for(let i=0;i<count;i++){
    const el = document.createElement('div');
    el.className = 'particle';
    const size = Math.random()*4+1.5;
    el.style.cssText = `
      width:${size}px;height:${size}px;
      left:${Math.random()*100}%;
      bottom:${Math.random()*-20}%;
      animation-duration:${Math.random()*12+8}s;
      animation-delay:${Math.random()*10}s;
      opacity:${Math.random()*.6+.1};
    `;
    container.appendChild(el);
  }
})();
</script>
</body>
</html>
