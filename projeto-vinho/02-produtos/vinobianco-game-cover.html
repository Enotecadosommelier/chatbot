<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>VinoBianco Wine Master — Capa</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,900;1,400;1,700&family=Montserrat:wght@200;300;400;500;600&display=swap');

*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden}

body{
  font-family:'Montserrat',sans-serif;
  background:#0D0608;
  display:flex;align-items:center;justify-content:center;
  min-height:100vh;
}

.cover{
  width:100vw;height:100vh;
  position:relative;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  overflow:hidden;
}

/* Background layers */
.bg-gradient{
  position:absolute;inset:0;
  background:
    radial-gradient(ellipse 80% 55% at 50% 0%, rgba(122,31,38,.6) 0%, transparent 70%),
    radial-gradient(ellipse 60% 40% at 50% 100%, rgba(80,15,20,.85) 0%, transparent 65%),
    radial-gradient(ellipse 100% 80% at 50% 50%, rgba(18,5,7,1) 30%, #0D0608 100%);
}

/* Vinhedo desfocado como textura de fundo */
.bg-vineyard{
  position:absolute;inset:0;
  background:
    repeating-linear-gradient(
      168deg,
      transparent 0px,
      transparent 18px,
      rgba(122,31,38,.025) 18px,
      rgba(122,31,38,.025) 19px
    );
  opacity:.6;
}

/* Canvas para partículas */
#particleCanvas{
  position:absolute;inset:0;
  pointer-events:none;
}

/* Linhas laterais decorativas */
.deco-line{
  position:absolute;top:0;bottom:0;width:1px;
  background:linear-gradient(to bottom,transparent,rgba(212,175,55,.2) 30%,rgba(212,175,55,.2) 70%,transparent);
}
.deco-line.left{left:clamp(24px,6vw,80px)}
.deco-line.right{right:clamp(24px,6vw,80px)}
.deco-line::after{
  content:'◆';position:absolute;left:50%;transform:translateX(-50%);top:50%;
  color:rgba(212,175,55,.35);font-size:.45rem;margin-top:-.45rem;
}

/* Ornamento superior */
.top-ornament{
  position:absolute;top:clamp(18px,4.5vh,44px);
  display:flex;align-items:center;gap:14px;
  opacity:0;
  animation:fadeUp .8s .1s ease forwards;
}
.ornament-line{width:clamp(36px,7vw,72px);height:1px;background:linear-gradient(to right,transparent,rgba(212,175,55,.45))}
.ornament-line.r{background:linear-gradient(to left,transparent,rgba(212,175,55,.45))}
.ornament-text{font-size:.58rem;letter-spacing:.28em;color:rgba(212,175,55,.65);font-weight:500}

/* Fantasma lateral */
.side-ornament{
  position:absolute;
  font-size:clamp(3.5rem,10vw,9rem);
  opacity:.018;
  font-family:'Playfair Display',serif;
  color:#F8F6EF;
  user-select:none;pointer-events:none;
  writing-mode:vertical-rl;
  letter-spacing:.18em;
}
.side-ornament.l{left:clamp(8px,2vw,40px);top:50%;transform:translateY(-50%)}
.side-ornament.r{right:clamp(8px,2vw,40px);top:50%;transform:translateY(-50%) rotate(180deg)}

/* Logo principal */
.logo-wrap{
  position:relative;z-index:10;
  display:flex;flex-direction:column;align-items:center;
  gap:0;
  opacity:0;
  animation:fadeUp 1s .3s ease forwards;
}

/* Taça container */
.glass-wrap{
  position:relative;
  margin-bottom:clamp(10px,2.5vh,24px);
}

/* Halo ao redor da taça */
.glass-halo{
  position:absolute;
  top:50%;left:50%;
  transform:translate(-50%,-50%);
  width:clamp(160px,36vw,300px);
  height:clamp(160px,36vw,300px);
  border-radius:50%;
  background:radial-gradient(circle,rgba(212,175,55,.06) 0%,transparent 65%);
  animation:haloBreath 5s ease-in-out infinite;
}

/* Ring de luz */
.glass-ring{
  position:absolute;
  top:50%;left:50%;
  transform:translate(-50%,-50%);
  width:clamp(140px,32vw,270px);
  height:clamp(140px,32vw,270px);
  border-radius:50%;
  border:1px solid rgba(212,175,55,.08);
  animation:ringPulse 4s ease-in-out infinite;
}

.glass-svg{
  width:clamp(100px,22vw,190px);
  height:auto;
  position:relative;z-index:2;
  filter:drop-shadow(0 0 20px rgba(212,175,55,.12)) drop-shadow(0 0 60px rgba(122,31,38,.3));
  animation:glassBreathe 6s ease-in-out infinite;
}

/* Nome da marca */
.brand-name{
  font-family:'Playfair Display',Georgia,serif;
  font-size:clamp(2.6rem,9.5vw,7rem);
  font-weight:700;
  line-height:.9;
  letter-spacing:-.02em;
  text-align:center;
  margin-bottom:clamp(4px,1vh,10px);
}
.brand-vino{color:#F8F6EF;display:block}
.brand-bianco{color:#7A1F26;display:block;font-style:italic}

/* Linha dourada */
.gold-rule{
  width:clamp(140px,36vw,300px);
  height:1px;
  background:linear-gradient(to right,transparent,#D4AF37,transparent);
  margin:clamp(7px,1.8vh,16px) 0;
  animation:shimmer 3s 1.8s ease-in-out infinite;
}

/* Subtítulo */
.game-title{
  font-family:'Playfair Display',serif;
  font-size:clamp(.65rem,2vw,1.2rem);
  font-weight:400;
  letter-spacing:clamp(.2em,.5vw,.5em);
  color:#D4AF37;
  text-transform:uppercase;
  text-align:center;
  margin-bottom:clamp(5px,1.2vh,14px);
}
.game-tag{
  font-size:clamp(.5rem,1.1vw,.65rem);
  letter-spacing:.3em;
  color:rgba(248,246,239,.3);
  font-weight:500;
  text-transform:uppercase;
  text-align:center;
}

/* Botão play */
.play-btn{
  margin-top:clamp(24px,5.5vh,52px);
  position:relative;z-index:10;
  background:none;
  border:1px solid rgba(212,175,55,.45);
  color:#D4AF37;
  font-family:'Montserrat',sans-serif;
  font-size:clamp(.65rem,1.4vw,.8rem);
  font-weight:600;
  letter-spacing:.22em;
  padding:clamp(.65rem,1.8vh,.95rem) clamp(1.8rem,4.5vw,3.2rem);
  border-radius:1px;
  cursor:pointer;
  text-transform:uppercase;
  transition:all .4s ease;
  overflow:hidden;
  opacity:0;
  animation:fadeUp .9s .75s ease forwards;
}
.play-btn::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(212,175,55,.1),rgba(122,31,38,.1));
  transform:scaleX(0);transform-origin:left;
  transition:transform .4s ease;
}
.play-btn:hover{
  border-color:rgba(212,175,55,.85);
  box-shadow:0 0 28px rgba(212,175,55,.12),inset 0 0 18px rgba(212,175,55,.04);
  letter-spacing:.27em;
}
.play-btn:hover::before{transform:scaleX(1)}

/* Rodapé */
.bottom-bar{
  position:absolute;bottom:clamp(14px,3.5vh,32px);
  display:flex;align-items:center;gap:clamp(14px,3.5vw,36px);
  opacity:0;
  animation:fadeUp .8s 1s ease forwards;
}
.bottom-item{
  font-size:clamp(.5rem,.9vw,.62rem);
  letter-spacing:.18em;
  color:rgba(248,246,239,.35);
  font-weight:300;
  text-transform:uppercase;
}
.bottom-dot{width:3px;height:3px;border-radius:50%;background:#D4AF37;opacity:.4}

/* ── ANIMAÇÕES ── */
@keyframes fadeUp{
  from{opacity:0;transform:translateY(22px)}
  to{opacity:1;transform:translateY(0)}
}
@keyframes shimmer{
  0%,100%{opacity:.7}50%{opacity:1}
}
@keyframes haloBreath{
  0%,100%{transform:translate(-50%,-50%) scale(1);opacity:.7}
  50%{transform:translate(-50%,-50%) scale(1.12);opacity:1}
}
@keyframes ringPulse{
  0%,100%{transform:translate(-50%,-50%) scale(.9);opacity:.3}
  50%{transform:translate(-50%,-50%) scale(1.05);opacity:.7}
}
@keyframes glassBreathe{
  0%,100%{filter:drop-shadow(0 0 20px rgba(212,175,55,.12)) drop-shadow(0 0 60px rgba(122,31,38,.3))}
  50%{filter:drop-shadow(0 0 28px rgba(212,175,55,.22)) drop-shadow(0 0 80px rgba(122,31,38,.45))}
}
/* Vinho preenchendo dentro da taça */
@keyframes wineFill{
  0%{clip-path:inset(100% 0 0 0)}
  100%{clip-path:inset(0% 0 0 0)}
}
/* Estrela girando */
@keyframes starSpin{
  from{transform:rotate(0deg)}
  to{transform:rotate(360deg)}
}
/* Cipreste balançando */
@keyframes sway{
  0%,100%{transform-origin:bottom center;transform:rotate(-1.5deg)}
  50%{transform-origin:bottom center;transform:rotate(1.5deg)}
}
</style>
</head>
<body>
<div class="cover">

  <div class="bg-gradient"></div>
  <div class="bg-vineyard"></div>

  <canvas id="particleCanvas"></canvas>

  <div class="deco-line left"></div>
  <div class="deco-line right"></div>
  <div class="side-ornament l">VINHO</div>
  <div class="side-ornament r">VINHO</div>

  <div class="top-ornament">
    <div class="ornament-line"></div>
    <div class="ornament-text">VinoBianco · Seleção Especial</div>
    <div class="ornament-line r"></div>
  </div>

  <!-- LOGO PRINCIPAL -->
  <div class="logo-wrap">

    <div class="glass-wrap">
      <div class="glass-halo"></div>
      <div class="glass-ring"></div>

      <!--
        SVG ultra-fiel ao logo real VinoBianco:
        - Taça estilo Borgonha (balão arredondado, caule fino, base larga)
        - Interior: colinas de vinhedo em perspectiva, fileiras, 4 ciprestes, estrela de 8 pontas
        - Paleta: #7A1F26 para traços principais, #D4AF37 para a estrela
        - Animação: vinho enchendo, estrela girando, ciprestes balançando suavemente
      -->
      <!-- TAÇA SVG REAL VINOBIANCO STORE — logo fiel -->
      <svg class="glass-svg" viewBox="0 0 200 248" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <clipPath id="cvBowlClip">
            <path d="M58,36 C50,92 60,132 66,144 Q80,168 100,176 Q120,168 134,144 C140,132 150,92 142,36 Z"/>
          </clipPath>
          <clipPath id="cvWineClip">
            <rect id="cvWineRect" x="0" y="176" width="200" height="0"/>
          </clipPath>
        </defs>

        <!-- Fundo vitreo suave -->
        <path d="M58,36 C50,92 60,132 66,144 Q80,168 100,176 Q120,168 134,144 C140,132 150,92 142,36 Z"
              fill="rgba(122,31,38,.06)"/>

        <!-- Vinho (enchimento animado via JS) -->
        <path d="M58,36 C50,92 60,132 66,144 Q80,168 100,176 Q120,168 134,144 C140,132 150,92 142,36 Z"
              fill="#7A1F26" clip-path="url(#cvWineClip)" opacity=".75"/>

        <!-- 8 fileiras de vinhedo em perspectiva (clippadas no bowl) -->
        <g clip-path="url(#cvBowlClip)" stroke="#D4AF37" fill="none" stroke-width="1.1" opacity=".65">
          <path d="M54,82  Q100,77  146,82"/>
          <path d="M52,96  Q100,91  148,96"/>
          <path d="M50,110 Q100,105 150,110"/>
          <path d="M50,124 Q100,119 150,124"/>
          <path d="M50,138 Q100,133 150,138"/>
          <path d="M52,152 Q100,147 148,152"/>
          <path d="M54,166 Q100,161 146,166"/>
          <!-- Linhas de fuga para o ponto de vanishing -->
          <line x1="100" y1="172" x2="50"  y2="78"  stroke-width=".65" opacity=".5"/>
          <line x1="100" y1="172" x2="150" y2="78"  stroke-width=".65" opacity=".5"/>
          <line x1="100" y1="172" x2="70"  y2="74"  stroke-width=".45" opacity=".35"/>
          <line x1="100" y1="172" x2="130" y2="74"  stroke-width=".45" opacity=".35"/>
          <line x1="100" y1="172" x2="86"  y2="72"  stroke-width=".35" opacity=".25"/>
          <line x1="100" y1="172" x2="114" y2="72"  stroke-width=".35" opacity=".25"/>
        </g>

        <!-- Ciprestes triangulares (2 — fiel ao logo real) -->
        <g clip-path="url(#cvBowlClip)" fill="#D4AF37" opacity=".7">
          <path d="M76,105 L68,152 Q72,160 76,161 Q80,160 84,152 Z"
                style="animation:sway 4s ease-in-out infinite"/>
          <path d="M124,105 L116,152 Q120,160 124,161 Q128,160 132,152 Z"
                style="animation:sway 4.5s .8s ease-in-out infinite"/>
        </g>

        <!-- Estrela de 8 pontas — asterisco (fiel ao logo) com giro lento -->
        <g transform="translate(100,56)">
          <g style="animation:starSpin 20s linear infinite;transform-origin:0px 0px">
            <!-- Halo dourado atrás -->
            <circle r="14" fill="rgba(212,175,55,.12)"/>
            <!-- 4 linhas do asterisco -->
            <line x1="0"    y1="-12" x2="0"    y2="12"  stroke="#D4AF37" stroke-width="1.8" stroke-linecap="round"/>
            <line x1="-12"  y1="0"   x2="12"   y2="0"   stroke="#D4AF37" stroke-width="1.8" stroke-linecap="round"/>
            <line x1="-8.5" y1="-8.5" x2="8.5" y2="8.5" stroke="#D4AF37" stroke-width="1.5" stroke-linecap="round"/>
            <line x1="8.5"  y1="-8.5" x2="-8.5" y2="8.5" stroke="#D4AF37" stroke-width="1.5" stroke-linecap="round"/>
            <!-- Ponto central -->
            <circle r="3.2" fill="#D4AF37"/>
            <circle r="1.5" fill="rgba(255,248,210,.85)"/>
          </g>
        </g>

        <!-- Contorno do bowl (traço principal ouro) -->
        <path d="M58,36 C50,92 60,132 66,144 Q80,168 100,176 Q120,168 134,144 C140,132 150,92 142,36"
              stroke="#D4AF37" stroke-width="2" fill="none" stroke-linecap="round" opacity=".9"/>
        <!-- Boca da taça -->
        <path d="M58,36 Q100,30 142,36"
              stroke="#D4AF37" stroke-width="2" fill="none" opacity=".9"/>

        <!-- Reflexo lateral esquerdo -->
        <path d="M64,48 C60,82 62,122 70,156"
              stroke="rgba(212,175,55,.28)" stroke-width="2.2" fill="none" stroke-linecap="round"/>

        <!-- Haste -->
        <path d="M100,176 L98,200 L102,200"
              stroke="#D4AF37" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/>
        <path d="M98,200 Q99,214 100,224 Q101,214 102,200"
              stroke="#D4AF37" stroke-width="1.5" fill="none" stroke-linecap="round" opacity=".7"/>

        <!-- Base -->
        <path d="M74,222 Q100,230 126,222"
              stroke="#D4AF37" stroke-width="1.8" fill="none" stroke-linecap="round" opacity=".85"/>

      </svg>
    </div><!-- /glass-wrap -->

    <!-- Nome da marca -->
    <div class="brand-name">
      <span class="brand-vino">Vino</span>
      <span class="brand-bianco">Bianco</span>
    </div>

    <div class="gold-rule"></div>
    <div class="game-title">Wine Master</div>
    <div class="game-tag">O Jogo · Edição Especial</div>

  </div><!-- /logo-wrap -->

  <button class="play-btn" id="playBtn">▶ &nbsp; Iniciar Jogo</button>

  <div class="bottom-bar">
    <span class="bottom-item">VinoBianco Store</span>
    <div class="bottom-dot"></div>
    <span class="bottom-item">Grandes Vinhos</span>
    <div class="bottom-dot"></div>
    <span class="bottom-item">Experiências Únicas</span>
  </div>

</div><!-- /cover -->

<script>
// ── SISTEMA DE PARTÍCULAS EM CANVAS ──
(function(){
  const canvas = document.getElementById('particleCanvas');
  const ctx = canvas.getContext('2d');
  let W, H, particles = [];

  function resize(){
    W = canvas.width  = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  // Duas classes de partículas: douradas (ouro) + vermelhas (vinho)
  function createParticle(){
    const isGold = Math.random() > .35;
    return {
      x: Math.random() * W,
      y: H + Math.random() * 120,
      size: Math.random() * 3.5 + 1.2,
      speed: Math.random() * .7 + .25,
      opacity: 0,
      maxOpacity: Math.random() * .55 + .15,
      drift: (Math.random() - .5) * .6,
      color: isGold ? [212, 175, 55] : [160, 40, 55],
      phase: Math.random() * Math.PI * 2,
      waveAmp: Math.random() * 1.2,
      waveFreq: Math.random() * .02 + .008,
    };
  }

  for(let i = 0; i < 40; i++){
    const p = createParticle();
    p.y = Math.random() * H; // scatter inicial
    particles.push(p);
  }

  let frame = 0;
  function animate(){
    ctx.clearRect(0, 0, W, H);
    frame++;

    particles.forEach((p, i) => {
      // Movimento
      p.y -= p.speed;
      p.x += p.drift + Math.sin(frame * p.waveFreq + p.phase) * p.waveAmp;

      // Fade in / out
      const lifeProgress = 1 - (p.y / H);
      if(lifeProgress < .12) p.opacity = (lifeProgress / .12) * p.maxOpacity;
      else if(lifeProgress > .85) p.opacity = ((1 - lifeProgress) / .15) * p.maxOpacity;
      else p.opacity = p.maxOpacity;

      // Desenho
      ctx.save();
      ctx.globalAlpha = p.opacity;
      const grd = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size * 1.8);
      grd.addColorStop(0, `rgba(${p.color[0]},${p.color[1]},${p.color[2]},1)`);
      grd.addColorStop(1, `rgba(${p.color[0]},${p.color[1]},${p.color[2]},0)`);
      ctx.fillStyle = grd;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * 1.8, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // Renova quando sai do topo
      if(p.y < -20) particles[i] = createParticle();
    });

    requestAnimationFrame(animate);
  }
  animate();
})();

// ── VINHO FILL ANIMATION ──
(function(){
  const rect = document.getElementById('cvWineRect');
  if(!rect) return;
  const VB_TOP=36, VB_BOT=176, VB_H=VB_BOT-VB_TOP;
  let level=1.0;
  const TARGET=0.35;
  function tick(){
    if(level>TARGET) level=Math.max(TARGET,level-.004);
    const fillTop=VB_TOP+level*VB_H;
    const fillH=VB_BOT-fillTop;
    rect.setAttribute('y',fillTop);
    rect.setAttribute('height',Math.max(0,fillH));
    requestAnimationFrame(tick);
  }
  tick();
})();

// ── BOTÃO PLAY ──
document.getElementById('playBtn').addEventListener('click', function(){
  this.style.opacity='.4';
  this.style.pointerEvents='none';
  setTimeout(function(){ window.location.href='vinobianco-game-home.html'; }, 350);
});
</script>
</body>
</html>
