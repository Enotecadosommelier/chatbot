<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>VinoBianco Wine Master — Capa</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,900;1,400;1,700&family=Montserrat:wght@200;300;400;500;600&display=swap');

*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden}

body{
  font-family:'Montserrat',sans-serif;
  background:#0D0608;
  display:flex;align-items:center;justify-content:center;
  min-height:100vh;
}

.cover{
  width:100vw;height:100vh;
  position:relative;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  overflow:hidden;
}

/* Background layers */
.bg-gradient{
  position:absolute;inset:0;
  background:
    radial-gradient(ellipse 80% 55% at 50% 0%, rgba(122,31,38,.6) 0%, transparent 70%),
    radial-gradient(ellipse 60% 40% at 50% 100%, rgba(80,15,20,.85) 0%, transparent 65%),
    radial-gradient(ellipse 100% 80% at 50% 50%, rgba(18,5,7,1) 30%, #0D0608 100%);
}

/* Vinhedo desfocado como textura de fundo */
.bg-vineyard{
  position:absolute;inset:0;
  background:
    repeating-linear-gradient(
      168deg,
      transparent 0px,
      transparent 18px,
      rgba(122,31,38,.025) 18px,
      rgba(122,31,38,.025) 19px
    );
  opacity:.6;
}

/* Canvas para partículas */
#particleCanvas{
  position:absolute;inset:0;
  pointer-events:none;
}

/* Linhas laterais decorativas */
.deco-line{
  position:absolute;top:0;bottom:0;width:1px;
  background:linear-gradient(to bottom,transparent,rgba(212,175,55,.2) 30%,rgba(212,175,55,.2) 70%,transparent);
}
.deco-line.left{left:clamp(24px,6vw,80px)}
.deco-line.right{right:clamp(24px,6vw,80px)}
.deco-line::after{
  content:'◆';position:absolute;left:50%;transform:translateX(-50%);top:50%;
  color:rgba(212,175,55,.35);font-size:.45rem;margin-top:-.45rem;
}

/* Ornamento superior */
.top-ornament{
  position:absolute;top:clamp(18px,4.5vh,44px);
  display:flex;align-items:center;gap:14px;
  opacity:0;
  animation:fadeUp .8s .1s ease forwards;
}
.ornament-line{width:clamp(36px,7vw,72px);height:1px;background:linear-gradient(to right,transparent,rgba(212,175,55,.45))}
.ornament-line.r{background:linear-gradient(to left,transparent,rgba(212,175,55,.45))}
.ornament-text{font-size:.58rem;letter-spacing:.28em;color:rgba(212,175,55,.65);font-weight:500}

/* Fantasma lateral */
.side-ornament{
  position:absolute;
  font-size:clamp(3.5rem,10vw,9rem);
  opacity:.018;
  font-family:'Playfair Display',serif;
  color:#F8F6EF;
  user-select:none;pointer-events:none;
  writing-mode:vertical-rl;
  letter-spacing:.18em;
}
.side-ornament.l{left:clamp(8px,2vw,40px);top:50%;transform:translateY(-50%)}
.side-ornament.r{right:clamp(8px,2vw,40px);top:50%;transform:translateY(-50%) rotate(180deg)}

/* Logo principal */
.logo-wrap{
  position:relative;z-index:10;
  display:flex;flex-direction:column;align-items:center;
  gap:0;
  opacity:0;
  animation:fadeUp 1s .3s ease forwards;
}

/* Taça container */
.glass-wrap{
  position:relative;
  margin-bottom:clamp(10px,2.5vh,24px);
}

/* Halo ao redor da taça */
.glass-halo{
  position:absolute;
  top:50%;left:50%;
  transform:translate(-50%,-50%);
  width:clamp(160px,36vw,300px);
  height:clamp(160px,36vw,300px);
  border-radius:50%;
  background:radial-gradient(circle,rgba(212,175,55,.06) 0%,transparent 65%);
  animation:haloBreath 5s ease-in-out infinite;
}

/* Ring de luz */
.glass-ring{
  position:absolute;
  top:50%;left:50%;
  transform:translate(-50%,-50%);
  width:clamp(140px,32vw,270px);
  height:clamp(140px,32vw,270px);
  border-radius:50%;
  border:1px solid rgba(212,175,55,.08);
  animation:ringPulse 4s ease-in-out infinite;
}

.glass-svg{
  width:clamp(100px,22vw,190px);
  height:auto;
  position:relative;z-index:2;
  filter:drop-shadow(0 0 20px rgba(212,175,55,.12)) drop-shadow(0 0 60px rgba(122,31,38,.3));
  animation:glassBreathe 6s ease-in-out infinite;
}

/* Nome da marca */
.brand-name{
  font-family:'Playfair Display',Georgia,serif;
  font-size:clamp(2.6rem,9.5vw,7rem);
  font-weight:700;
  line-height:.9;
  letter-spacing:-.02em;
  text-align:center;
  margin-bottom:clamp(4px,1vh,10px);
}
.brand-vino{color:#F8F6EF;display:block}
.brand-bianco{color:#7A1F26;display:block;font-style:italic}

/* Linha dourada */
.gold-rule{
  width:clamp(140px,36vw,300px);
  height:1px;
  background:linear-gradient(to right,transparent,#D4AF37,transparent);
  margin:clamp(7px,1.8vh,16px) 0;
  animation:shimmer 3s 1.8s ease-in-out infinite;
}

/* Subtítulo */
.game-title{
  font-family:'Playfair Display',serif;
  font-size:clamp(.65rem,2vw,1.2rem);
  font-weight:400;
  letter-spacing:clamp(.2em,.5vw,.5em);
  color:#D4AF37;
  text-transform:uppercase;
  text-align:center;
  margin-bottom:clamp(5px,1.2vh,14px);
}
.game-tag{
  font-size:clamp(.5rem,1.1vw,.65rem);
  letter-spacing:.3em;
  color:rgba(248,246,239,.3);
  font-weight:500;
  text-transform:uppercase;
  text-align:center;
}

/* Botão play */
.play-btn{
  margin-top:clamp(24px,5.5vh,52px);
  position:relative;z-index:10;
  background:none;
  border:1px solid rgba(212,175,55,.45);
  color:#D4AF37;
  font-family:'Montserrat',sans-serif;
  font-size:clamp(.65rem,1.4vw,.8rem);
  font-weight:600;
  letter-spacing:.22em;
  padding:clamp(.65rem,1.8vh,.95rem) clamp(1.8rem,4.5vw,3.2rem);
  border-radius:1px;
  cursor:pointer;
  text-transform:uppercase;
  transition:all .4s ease;
  overflow:hidden;
  opacity:0;
  animation:fadeUp .9s .75s ease forwards;
}
.play-btn::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(212,175,55,.1),rgba(122,31,38,.1));
  transform:scaleX(0);transform-origin:left;
  transition:transform .4s ease;
}
.play-btn:hover{
  border-color:rgba(212,175,55,.85);
  box-shadow:0 0 28px rgba(212,175,55,.12),inset 0 0 18px rgba(212,175,55,.04);
  letter-spacing:.27em;
}
.play-btn:hover::before{transform:scaleX(1)}

/* Rodapé */
.bottom-bar{
  position:absolute;bottom:clamp(14px,3.5vh,32px);
  display:flex;align-items:center;gap:clamp(14px,3.5vw,36px);
  opacity:0;
  animation:fadeUp .8s 1s ease forwards;
}
.bottom-item{
  font-size:clamp(.5rem,.9vw,.62rem);
  letter-spacing:.18em;
  color:rgba(248,246,239,.35);
  font-weight:300;
  text-transform:uppercase;
}
.bottom-dot{width:3px;height:3px;border-radius:50%;background:#D4AF37;opacity:.4}

/* ── ANIMAÇÕES ── */
@keyframes fadeUp{
  from{opacity:0;transform:translateY(22px)}
  to{opacity:1;transform:translateY(0)}
}
@keyframes shimmer{
  0%,100%{opacity:.7}50%{opacity:1}
}
@keyframes haloBreath{
  0%,100%{transform:translate(-50%,-50%) scale(1);opacity:.7}
  50%{transform:translate(-50%,-50%) scale(1.12);opacity:1}
}
@keyframes ringPulse{
  0%,100%{transform:translate(-50%,-50%) scale(.9);opacity:.3}
  50%{transform:translate(-50%,-50%) scale(1.05);opacity:.7}
}
@keyframes glassBreathe{
  0%,100%{filter:drop-shadow(0 0 20px rgba(212,175,55,.12)) drop-shadow(0 0 60px rgba(122,31,38,.3))}
  50%{filter:drop-shadow(0 0 28px rgba(212,175,55,.22)) drop-shadow(0 0 80px rgba(122,31,38,.45))}
}
/* Vinho preenchendo dentro da taça */
@keyframes wineFill{
  0%{clip-path:inset(100% 0 0 0)}
  100%{clip-path:inset(0% 0 0 0)}
}
/* Estrela girando */
@keyframes starSpin{
  from{transform:rotate(0deg)}
  to{transform:rotate(360deg)}
}
/* Cipreste balançando */
@keyframes sway{
  0%,100%{transform-origin:bottom center;transform:rotate(-1.5deg)}
  50%{transform-origin:bottom center;transform:rotate(1.5deg)}
}
</style>
</head>
<body>
<div class="cover">

  <div class="bg-gradient"></div>
  <div class="bg-vineyard"></div>

  <canvas id="particleCanvas"></canvas>

  <div class="deco-line left"></div>
  <div class="deco-line right"></div>
  <div class="side-ornament l">VINHO</div>
  <div class="side-ornament r">VINHO</div>

  <div class="top-ornament">
    <div class="ornament-line"></div>
    <div class="ornament-text">VinoBianco · Seleção Especial</div>
    <div class="ornament-line r"></div>
  </div>

  <!-- LOGO PRINCIPAL -->
  <div class="logo-wrap">

    <div class="glass-wrap">
      <div class="glass-halo"></div>
      <div class="glass-ring"></div>

      <!--
        SVG ultra-fiel ao logo real VinoBianco:
        - Taça estilo Borgonha (balão arredondado, caule fino, base larga)
        - Interior: colinas de vinhedo em perspectiva, fileiras, 4 ciprestes, estrela de 8 pontas
        - Paleta: #7A1F26 para traços principais, #D4AF37 para a estrela
        - Animação: vinho enchendo, estrela girando, ciprestes balançando suavemente
      -->
      <svg class="glass-svg" viewBox="0 0 220 260" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <!-- Gradiente do vinho dentro da taça -->
          <linearGradient id="wineGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="rgba(122,31,38,.55)"/>
            <stop offset="100%" stop-color="rgba(80,10,18,.75)"/>
          </linearGradient>
          <!-- Máscara para clipar o vinho dentro do corpo da taça -->
          <clipPath id="wineClip">
            <path d="M62 42 Q54 100 68 138 Q82 165 110 177 Q138 165 152 138 Q166 100 158 42 Z"/>
          </clipPath>
          <!-- Máscara para o conteúdo interior (cena do vinhedo) -->
          <clipPath id="interiorClip">
            <path d="M66 46 Q59 102 72 138 Q85 163 110 174 Q135 163 148 138 Q161 102 154 46 Z"/>
          </clipPath>
          <!-- Brilho suave da borda da taça -->
          <filter id="glassGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="2.5" result="blur"/>
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
          <!-- Sombra suave geral -->
          <filter id="softGlow">
            <feGaussianBlur stdDeviation="3" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>

        <!-- ── CAMADA DO VINHO (preenchimento animado) ── -->
        <g clip-path="url(#wineClip)" style="animation:wineFill 2.2s 0.4s cubic-bezier(.4,0,.2,1) forwards;clip-path:inset(100% 0 0 0)">
          <path d="M62 42 Q54 100 68 138 Q82 165 110 177 Q138 165 152 138 Q166 100 158 42 Z"
                fill="url(#wineGrad)"/>
          <!-- Superfície do vinho com ondulação sutil (linha horizontal) -->
          <ellipse cx="110" cy="75" rx="40" ry="3.5"
                   fill="rgba(212,175,55,.12)" opacity=".7"/>
        </g>

        <!-- ── CENA DO VINHEDO (interior, sobre o vinho) ── -->
        <g clip-path="url(#interiorClip)">

          <!-- Céu noturno degradê dentro da taça -->
          <rect x="50" y="42" width="120" height="140" fill="none"/>

          <!-- Colinas em perspectiva — 3 camadas -->
          <!-- Colina fundo (mais clara, horizonte) -->
          <path d="M66 128 Q78 112 95 108 Q110 105 125 108 Q142 112 154 128 L154 178 Q138 165 110 174 Q82 165 66 178 Z"
                fill="rgba(122,31,38,.10)"/>
          <!-- Colina média -->
          <path d="M66 140 Q82 124 100 120 Q110 118 120 120 Q138 124 154 140 L154 178 Q138 165 110 174 Q82 165 66 178 Z"
                fill="rgba(122,31,38,.18)"/>
          <!-- Colina frente -->
          <path d="M66 155 Q85 140 100 136 Q110 134 120 136 Q135 140 154 155 L154 178 Q138 165 110 174 Q82 165 66 178 Z"
                fill="rgba(122,31,38,.28)"/>

          <!-- Fileiras de vinhedo em perspectiva convergente para ponto de fuga central -->
          <g stroke="#7A1F26" stroke-linecap="round" opacity=".6">
            <!-- Linhas horizontais das fileiras -->
            <line x1="72" y1="152" x2="148" y2="152" stroke-width="1.1"/>
            <line x1="75" y1="158" x2="145" y2="158" stroke-width="1.0"/>
            <line x1="78" y1="164" x2="142" y2="164" stroke-width=".9"/>
            <line x1="82" y1="168" x2="138" y2="168" stroke-width=".8"/>
            <!-- Linhas verticais de convergência perspectiva -->
            <line x1="82"  y1="138" x2="78"  y2="172" stroke-width=".8" opacity=".4"/>
            <line x1="90"  y1="134" x2="88"  y2="172" stroke-width=".8" opacity=".4"/>
            <line x1="98"  y1="132" x2="98"  y2="172" stroke-width=".8" opacity=".4"/>
            <line x1="106" y1="131" x2="107" y2="172" stroke-width=".8" opacity=".4"/>
            <line x1="114" y1="131" x2="113" y2="172" stroke-width=".8" opacity=".4"/>
            <line x1="122" y1="132" x2="122" y2="172" stroke-width=".8" opacity=".4"/>
            <line x1="130" y1="134" x2="132" y2="172" stroke-width=".8" opacity=".4"/>
            <line x1="138" y1="138" x2="142" y2="172" stroke-width=".8" opacity=".4"/>
          </g>

          <!-- Ciprestes — 4 árvores com animação sway -->
          <!-- Cipreste esquerdo mais afastado -->
          <g style="animation:sway 4s 0.5s ease-in-out infinite">
            <line x1="88" y1="131" x2="88" y2="117" stroke="#7A1F26" stroke-width="2" stroke-linecap="round"/>
            <ellipse cx="88" cy="113" rx="4.5" ry="8" fill="#7A1F26" opacity=".72"/>
          </g>
          <!-- Cipreste esquerdo próximo -->
          <g style="animation:sway 3.5s 1.2s ease-in-out infinite">
            <line x1="98" y1="129" x2="98" y2="112" stroke="#7A1F26" stroke-width="2.2" stroke-linecap="round"/>
            <ellipse cx="98" cy="107" rx="5" ry="9" fill="#7A1F26" opacity=".80"/>
          </g>
          <!-- Cipreste direito próximo -->
          <g style="animation:sway 3.8s 0.8s ease-in-out infinite">
            <line x1="122" y1="129" x2="122" y2="112" stroke="#7A1F26" stroke-width="2.2" stroke-linecap="round"/>
            <ellipse cx="122" cy="107" rx="5" ry="9" fill="#7A1F26" opacity=".80"/>
          </g>
          <!-- Cipreste direito mais afastado -->
          <g style="animation:sway 4.2s 1.6s ease-in-out infinite">
            <line x1="132" y1="131" x2="132" y2="117" stroke="#7A1F26" stroke-width="2" stroke-linecap="round"/>
            <ellipse cx="132" cy="113" rx="4.5" ry="8" fill="#7A1F26" opacity=".72"/>
          </g>

        </g><!-- /interior clip -->

        <!-- ── ESTRELA / SNOWFLAKE (topo da taça, animada) ── -->
        <g transform="translate(110, 68)">
          <!-- Rotação lenta e suave -->
          <g style="animation:starSpin 18s linear infinite;transform-origin:0 0">
            <!-- Estrela de 8 pontas fiel ao logo -->
            <path d="M0,-13 L1.8,-4 L9,-7.5 L3.5,-1.2 L13,0 L3.5,1.2 L9,7.5 L1.8,4 L0,13 L-1.8,4 L-9,7.5 L-3.5,1.2 L-13,0 L-3.5,-1.2 L-9,-7.5 L-1.8,-4 Z"
                  fill="#D4AF37" opacity=".92"/>
            <!-- Círculo central -->
            <circle r="3" fill="#D4AF37"/>
            <!-- Brilho central -->
            <circle r="1.5" fill="rgba(255,245,200,.8)"/>
          </g>
        </g>

        <!-- ── CORPO DA TAÇA (stroke principal) ── -->
        <!-- Forma exterior da taça — estilo Borgonha arredondado, fiel ao logo -->
        <path d="M62 42
                 Q54 100 68 138
                 Q82 165 110 177
                 Q138 165 152 138
                 Q166 100 158 42
                 Z"
              stroke="#7A1F26" stroke-width="2.4" fill="none"
              stroke-linejoin="round" filter="url(#softGlow)"/>

        <!-- Brilho interno na borda esquerda da taça (reflexo de luz) -->
        <path d="M64 46 Q57 98 70 134"
              stroke="rgba(212,175,55,.18)" stroke-width="1.8" fill="none" stroke-linecap="round"/>
        <!-- Segundo reflexo mais suave -->
        <path d="M67 50 Q62 96 73 130"
              stroke="rgba(248,246,239,.08)" stroke-width="1" fill="none" stroke-linecap="round"/>

        <!-- ── CAULE (fino e elegante) ── -->
        <!-- Caule com ligeiro afunilamento -->
        <path d="M110 177 L107 200 M110 177 L113 200"
              stroke="#7A1F26" stroke-width="1.2" stroke-linecap="round" opacity=".8"/>
        <path d="M107 200 L113 200"
              stroke="#7A1F26" stroke-width="1.5" stroke-linecap="round" opacity=".8"/>

        <!-- ── BASE (larga e estável) ── -->
        <!-- Base da taça em arco elegante -->
        <path d="M80 232 Q110 224 140 232"
              stroke="#7A1F26" stroke-width="2.2" fill="none" stroke-linecap="round" filter="url(#softGlow)"/>
        <!-- Linha de conexão caule-base -->
        <path d="M107 200 Q103 215 80 232"
              stroke="#7A1F26" stroke-width="2" fill="none" stroke-linecap="round"/>
        <path d="M113 200 Q117 215 140 232"
              stroke="#7A1F26" stroke-width="2" fill="none" stroke-linecap="round"/>

      </svg>
    </div><!-- /glass-wrap -->

    <!-- Nome da marca -->
    <div class="brand-name">
      <span class="brand-vino">Vino</span>
      <span class="brand-bianco">Bianco</span>
    </div>

    <div class="gold-rule"></div>
    <div class="game-title">Wine Master</div>
    <div class="game-tag">O Jogo · Edição Especial</div>

  </div><!-- /logo-wrap -->

  <button class="play-btn" id="playBtn">▶ &nbsp; Iniciar Jogo</button>

  <div class="bottom-bar">
    <span class="bottom-item">VinoBianco Store</span>
    <div class="bottom-dot"></div>
    <span class="bottom-item">Grandes Vinhos</span>
    <div class="bottom-dot"></div>
    <span class="bottom-item">Experiências Únicas</span>
  </div>

</div><!-- /cover -->

<script>
// ── SISTEMA DE PARTÍCULAS EM CANVAS ──
(function(){
  const canvas = document.getElementById('particleCanvas');
  const ctx = canvas.getContext('2d');
  let W, H, particles = [];

  function resize(){
    W = canvas.width  = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  // Duas classes de partículas: douradas (ouro) + vermelhas (vinho)
  function createParticle(){
    const isGold = Math.random() > .35;
    return {
      x: Math.random() * W,
      y: H + Math.random() * 120,
      size: Math.random() * 3.5 + 1.2,
      speed: Math.random() * .7 + .25,
      opacity: 0,
      maxOpacity: Math.random() * .55 + .15,
      drift: (Math.random() - .5) * .6,
      color: isGold ? [212, 175, 55] : [160, 40, 55],
      phase: Math.random() * Math.PI * 2,
      waveAmp: Math.random() * 1.2,
      waveFreq: Math.random() * .02 + .008,
    };
  }

  for(let i = 0; i < 40; i++){
    const p = createParticle();
    p.y = Math.random() * H; // scatter inicial
    particles.push(p);
  }

  let frame = 0;
  function animate(){
    ctx.clearRect(0, 0, W, H);
    frame++;

    particles.forEach((p, i) => {
      // Movimento
      p.y -= p.speed;
      p.x += p.drift + Math.sin(frame * p.waveFreq + p.phase) * p.waveAmp;

      // Fade in / out
      const lifeProgress = 1 - (p.y / H);
      if(lifeProgress < .12) p.opacity = (lifeProgress / .12) * p.maxOpacity;
      else if(lifeProgress > .85) p.opacity = ((1 - lifeProgress) / .15) * p.maxOpacity;
      else p.opacity = p.maxOpacity;

      // Desenho
      ctx.save();
      ctx.globalAlpha = p.opacity;
      const grd = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size * 1.8);
      grd.addColorStop(0, `rgba(${p.color[0]},${p.color[1]},${p.color[2]},1)`);
      grd.addColorStop(1, `rgba(${p.color[0]},${p.color[1]},${p.color[2]},0)`);
      ctx.fillStyle = grd;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * 1.8, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // Renova quando sai do topo
      if(p.y < -20) particles[i] = createParticle();
    });

    requestAnimationFrame(animate);
  }
  animate();
})();

// ── BOTÃO PLAY ──
document.getElementById('playBtn').addEventListener('click', function(){
  this.style.opacity = '.4';
  this.style.pointerEvents = 'none';
});
</script>
</body>
</html>
