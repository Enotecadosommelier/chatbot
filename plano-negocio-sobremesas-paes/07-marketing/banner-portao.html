<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Banner Casa Recheada - Portão</title>
<style>
  @page { size: 200mm 100mm landscape; margin: 0; }
  html, body {
    margin: 0; padding: 0;
    width: 2000px; height: 1000px;
    font-family: 'Georgia', 'Times New Roman', serif;
    background: linear-gradient(135deg, #f7ead2 0%, #f0dcb8 100%);
  }
  .banner {
    box-sizing: border-box;
    width: 2000px; height: 1000px;
    padding: 60px 90px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    border: 14px solid #7a3b1e;
    outline: 4px solid #d9a441;
    outline-offset: -30px;
    position: relative;
  }
  .kicker {
    letter-spacing: 8px;
    text-transform: uppercase;
    font-size: 30px;
    color: #a8632c;
    font-family: 'Helvetica', Arial, sans-serif;
    font-weight: 600;
    margin-bottom: 10px;
  }
  .brand {
    font-size: 150px;
    color: #6b2c14;
    font-weight: bold;
    line-height: 1.0;
    margin: 0;
  }
  .brand span { color: #c2731c; }
  .subtitle {
    font-family: 'Helvetica', Arial, sans-serif;
    font-size: 42px;
    color: #4a2c1a;
    margin-top: 18px;
    margin-bottom: 30px;
    font-weight: 500;
  }
  .products {
    display: flex;
    gap: 60px;
    font-family: 'Helvetica', Arial, sans-serif;
    font-size: 40px;
    color: #5c3418;
    margin-bottom: 34px;
  }
  .products div { display:flex; align-items:center; gap:16px; }
  .impact {
    font-style: italic;
    font-size: 48px;
    color: #7a3b1e;
    margin-bottom: 36px;
  }
  .whatsapp {
    font-family: 'Helvetica', Arial, sans-serif;
    background: #7a3b1e;
    color: #f7ead2;
    padding: 22px 60px;
    border-radius: 60px;
    font-size: 46px;
    font-weight: bold;
    letter-spacing: 1px;
  }
</style>
</head>
<body>
  <div class="banner">
    <div class="kicker">Feito em casa • Bairro</div>
    <h1 class="brand">Casa <span>Recheada</span></h1>
    <div class="subtitle">Pães Recheados &amp; Sobremesas Gourmet Artesanais</div>
    <div class="products">
      <div>🥖 Pães Recheados</div>
      <div>🍰 Sobremesas no Pote</div>
    </div>
    <div class="impact">"Feito em casa com sabor artesanal"</div>
    <div class="whatsapp">📱 WhatsApp: (XX) XXXXX-XXXX</div>
  </div>
</body>
</html>
